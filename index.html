<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hailey · 初中英语班级管理工作台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📚%3C/text%3E%3C/svg%3E">
<style>
/* ===========================================================
 * app.css — 班级管理工作台
 * =========================================================== */
:root{
  --bg:#f5f6fb; --card:#fff; --line:#e8eaf2; --text:#1f2437; --muted:#8a90a6;
  --pri:#6366f1; --pri-soft:#eef0ff; --ok:#10b981; --warn:#f59e0b; --bad:#ef4444; --info:#0ea5e9;
  --r:14px; --sh:0 1px 2px rgba(23,26,47,.05),0 6px 20px rgba(23,26,47,.06);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;display:flex;background:var(--bg);color:var(--text);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,p{margin:0}
a{color:inherit;text-decoration:none}
.flex1{flex:1}
.nowrap{white-space:nowrap}
.muted{color:var(--muted)}
.sm{font-size:12px}
.tiny{font-size:11px;line-height:1.5}
.good{color:var(--ok)} .bad{color:var(--bad)} .mid{color:var(--warn)}
.strike{text-decoration:line-through;color:var(--muted)}
.ellip{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ellip.wide{max-width:320px}

/* ---------- 侧栏 ---------- */
.sidebar{
  width:224px;flex:0 0 224px;height:100vh;position:sticky;top:0;
  background:linear-gradient(170deg,#2b2f52,#1e2140);color:#e8eaf5;
  display:flex;flex-direction:column;padding:18px 12px;
}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px}
.logo{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.12);display:grid;place-items:center;font-size:20px}
.brand h1{font-size:15px;font-weight:650}
.brand p{font-size:11px;color:#a8adcc}
#nav{display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1}
.nav-item{
  display:flex;align-items:center;gap:9px;padding:9px 11px;border:0;border-radius:10px;cursor:pointer;
  background:transparent;color:#c9cde8;font-size:13.5px;text-align:left;font-family:inherit;transition:.15s;
}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{background:var(--pri);color:#fff;box-shadow:0 6px 16px rgba(99,102,241,.35)}
.ni{width:18px;text-align:center}
.nav-dot{
  margin-left:auto;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:rgba(255,255,255,.16);
  font-size:11px;display:grid;place-items:center;color:#fff;
}
.nav-item.active .nav-dot{background:rgba(0,0,0,.22)}
.side-foot{padding:12px 8px 0;border-top:1px solid rgba(255,255,255,.08);color:#8f95bb}
.mini-btn{width:100%;padding:7px;border-radius:9px;border:1px dashed rgba(255,255,255,.25);background:transparent;color:#c9cde8;cursor:pointer;font-family:inherit;font-size:12px;margin-bottom:8px}
.mini-btn:hover{background:rgba(255,255,255,.08)}

/* ---------- 主区 ---------- */
.main{flex:1;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 24px;background:rgba(245,246,251,.86);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.view{padding:18px 24px 8px;flex:1}
.foot{padding:16px 24px 28px;color:var(--muted);font-size:12px}
.only-mobile{display:none}
.sync-badge{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-size:12.5px;cursor:pointer;font-family:inherit}
.sync-badge.ok{color:var(--ok);border-color:#c7f0e0;background:#f2fdf9}
.sync-badge.dirty{color:var(--warn);border-color:#fbe6bd;background:#fffbf2}
.sync-badge.off{color:var(--muted)}

/* ---------- 通用 ---------- */
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.page-head h2{font-size:20px;font-weight:680}
.page-head .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.head-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh);margin-bottom:16px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-head h3{font-size:14.5px;font-weight:650}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-2>.card{margin-bottom:16px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar.inline{margin:0}
.hint{color:var(--muted);font-size:12.5px;margin-top:8px}
.warn-box{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;padding:10px 12px;border-radius:10px;font-size:13px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.confirm-text{font-size:14px;line-height:1.7}
.inline-lab{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}

/* 按钮 */
.btn{
  border:1px solid var(--line);background:#fff;color:var(--text);border-radius:10px;padding:8px 13px;
  font-size:13px;cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;
}
.btn:hover{border-color:#c9cdf0;background:#fafaff;transform:translateY(-1px)}
.btn.primary{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.primary:hover{background:#5457e5}
.btn.danger{color:var(--bad);border-color:#fbd5d5}
.btn.danger:hover{background:#fff5f5}
.btn.danger.primary,.modal-foot .btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ok{color:var(--ok);border-color:#bbf0dc}
.btn.ghost{background:transparent}
.btn.xs{padding:4px 9px;font-size:12px;border-radius:8px}
.btn.block{width:100%;justify-content:center;margin-bottom:8px}
.icon-btn{border:0;background:transparent;cursor:pointer;color:var(--muted);padding:4px 6px;border-radius:7px;font-size:14px;font-family:inherit}
.icon-btn:hover{background:#f1f2f8;color:var(--text)}
.icon-btn.danger:hover{background:#fff0f0;color:var(--bad)}
.icon-btn.xs{font-size:12px;padding:2px 5px}
.star{border:0;background:transparent;cursor:pointer;font-size:16px;color:#d7dae8;padding:2px}
.star.on{color:#fbbf24}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.seg button{border:0;background:transparent;padding:7px 14px;font-size:13px;cursor:pointer;font-family:inherit;color:var(--muted)}
.seg button.on{background:var(--pri);color:#fff}

/* 表单 */
.inp{
  width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:13.5px;
  font-family:inherit;background:#fff;color:var(--text);outline:none;transition:.15s;
}
.inp:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-soft)}
.inp.xs{padding:4px 8px;font-size:12px;width:auto}
.inp.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.7}
.inp.num{padding:5px 7px;text-align:center;width:74px}
textarea.inp{resize:vertical}
.form{display:flex;flex-direction:column;gap:12px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted)}
.form label>.inp,.form label>select{color:var(--text)}
.form.grid2,.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* Supabase 配置分组：Project URL + 公开密钥 */
.cfg-group{border:1px solid var(--line);border-radius:12px;padding:12px 12px 14px;background:#fbfbff;display:flex;flex-direction:column;gap:11px}
.cfg-group-title{font-size:12px;font-weight:650;color:var(--pri);letter-spacing:.3px}
.cfg-group .form,.cfg-group>.grid2{gap:11px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.span2{grid-column:span 2}
.check,.check-inline{display:flex;flex-direction:row!important;align-items:center;gap:6px;font-size:13px;color:var(--text)!important;cursor:pointer}
.tag-picker{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;background:#f1f2f8;color:#5a6079;border-radius:7px;padding:2px 8px;font-size:11.5px;margin-right:4px}
.chip.sm{font-size:11px;padding:1px 6px}
.chip.pick{cursor:pointer;background:#fff;border:1px solid var(--line);padding:4px 10px;font-size:12.5px}
.chip.pick:has(input:checked){background:var(--pri-soft);border-color:#c3c6ff;color:var(--pri)}
.chip.pick input{margin:0}

/* 表格 */
.table-wrap{overflow:auto;border-radius:10px;border:1px solid var(--line)}
.max200{max-height:200px}.max260{max-height:260px}.max360{max-height:360px}
.max420{max-height:420px}.max480{max-height:480px}
.tbl{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
.tbl th{position:sticky;top:0;background:#fafbff;text-align:left;font-weight:600;color:#6b7189;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
.tbl td{padding:8px 10px;border-bottom:1px solid #f2f3f8;vertical-align:middle}
.tbl tbody tr:hover{background:#fafaff}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl.mini{font-size:12.5px}
.tbl.mini th,.tbl.mini td{padding:6px 8px}
.tbl tr.sum td{background:#fafbff;font-weight:600}
.tbl tr.row-high td{background:#f7fbff}
.cell-bad{color:var(--bad);background:#fff6f6}
.cell-good{color:var(--ok);background:#f4fdf9}
.link{color:var(--pri);cursor:pointer;border-bottom:1px dashed transparent}
.link:hover{border-color:var(--pri)}
.tel{color:var(--info)}
.score-tbl input{width:70px}

/* 徽标 */
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;background:#f1f2f8;color:#5a6079;white-space:nowrap}
.pill.ok{background:#e8faf3;color:#0f9b74}
.pill.warn{background:#fff5e5;color:#b3730a}
.pill.bad{background:#ffeef0;color:#d13c47}
.pill.high{background:#eef0ff;color:var(--pri)}
.pill.mid{background:#e9f6ff;color:#0d80b8}
.pill.low{background:#e8faf3;color:#0f9b74}
.pill.sm{font-size:11px}
.badge{display:inline-block;padding:0 7px;border-radius:6px;background:#f1f2f8;color:#6b7189;font-size:11.5px;margin-left:4px}
.badge.danger{background:#ffeef0;color:#d13c47}
.rate{font-weight:650}
.rate.good{color:var(--ok)}.rate.mid{color:var(--warn)}.rate.bad{color:var(--bad)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
.meter{height:5px;border-radius:3px;background:#eef0f6;overflow:hidden;margin:4px 0}
.meter i{display:block;height:100%;border-radius:3px}

/* KPI */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi-row.five{grid-template-columns:repeat(5,1fr)}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;gap:12px;align-items:center;box-shadow:var(--sh);transition:.15s}
.kpi[data-go]{cursor:pointer}
.kpi[data-go]:hover{transform:translateY(-2px);border-color:#c9cdf0}
.kpi-ico{width:38px;height:38px;border-radius:11px;background:var(--pri-soft);display:grid;place-items:center;font-size:18px;flex:0 0 38px}
.kpi-v{font-size:19px;font-weight:680;line-height:1.25}

/* 分数线快捷条 */
.line-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;margin-bottom:12px;box-shadow:var(--sh)}
.line-bar-label{font-weight:600;font-size:13px;color:var(--muted);flex:0 0 auto}
.line-tag{display:flex;align-items:center;gap:4px;padding:4px 10px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
.line-tag.high{background:#fef2f2;color:#ef4444}
.line-tag.mid{background:#fffbeb;color:#f59e0b}
.line-tag.low{background:#f0fdf4;color:#10b981}
.line-tag input{font-weight:700;color:inherit;border:1px solid currentColor;opacity:.5;padding:2px 6px;border-radius:5px}
.line-tag input:focus{opacity:1;outline:none}
.kpi-l{font-size:12px;color:var(--muted)}
.kpi.warn .kpi-ico{background:#fff5e5}
.kpi.danger .kpi-ico{background:#ffeef0}
.kpi.danger .kpi-v{color:var(--bad)}

/* 列表 */
.list{display:flex;flex-direction:column}
.list-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px dashed #eef0f6}
.list-item:last-child{border-bottom:0}
.list.tight .list-item{padding:8px 2px}
.list.log .list-item{font-size:12.5px}
.list-item.done{opacity:.6}
.period{display:inline-block;background:var(--pri-soft);color:var(--pri);border-radius:6px;padding:1px 7px;font-size:11.5px;margin-right:6px}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.empty-ico{font-size:30px;margin-bottom:6px}
.chips-row{display:flex;flex-wrap:wrap;gap:8px}
.follow-chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:#fafbff}

/* 仪表盘 */
.dash-hero{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;
  background:linear-gradient(120deg,#eef0ff,#f6f7ff 55%,#fff);border:1px solid var(--line);
  border-radius:var(--r);padding:18px 20px;margin-bottom:16px;box-shadow:var(--sh)}
.dash-hero h2{font-size:20px;font-weight:680}
.dash-hero .sub{color:var(--muted);font-size:12.5px;margin-top:3px}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.qbtn{border:1px solid #dfe2f5;background:#fff;border-radius:10px;padding:8px 12px;font-size:13px;cursor:pointer;font-family:inherit;transition:.15s}
.qbtn:hover{background:var(--pri);color:#fff;border-color:var(--pri);transform:translateY(-1px)}
.dash-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.dash-grid .card{margin:0}

/* 班级卡 */
.cls-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.cls-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px;min-width:150px;cursor:pointer;box-shadow:var(--sh);transition:.15s}
.cls-card:hover{transform:translateY(-2px)}
.cls-card.active{border-color:var(--pri);background:var(--pri-soft)}
.cls-name{font-weight:650;font-size:14px;display:flex;align-items:center;gap:4px}
.cls-meta{font-size:12px;color:var(--muted);margin-top:2px}
.cls-add{border:1px dashed #cfd3e6;background:transparent;border-radius:12px;padding:12px 16px;color:var(--muted);cursor:pointer;font-family:inherit;font-size:13px}
.cls-add:hover{border-color:var(--pri);color:var(--pri)}

/* 听写录入 */
.stu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;max-height:320px;overflow-y:auto;padding:4px;border:1px solid var(--line);border-radius:10px;background:#fafbff}
.stu-chip{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 6px;cursor:pointer;font-family:inherit;text-align:center;transition:.12s}
.stu-chip .n{display:block;font-size:13px;font-weight:600}
.stu-chip .m{display:block;font-size:11px;color:var(--muted)}
.stu-chip.pass{border-color:#bbf0dc;background:#f3fdf9}
.stu-chip.pass .m{color:var(--ok)}
.stu-chip.fail{border-color:#fbd5d5;background:#fff5f5}
.stu-chip.fail .m{color:var(--bad)}
.stu-sum{background:#fafbff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:10px 0;font-size:13px}

/* 四象限 */
.quad-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.quad{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh);min-height:190px}
.quad-head{display:flex;align-items:center;gap:6px;font-weight:650;font-size:13.5px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.quad-head .icon-btn{margin-left:auto}
.quad-body{display:flex;flex-direction:column;gap:6px}
.quad-empty{color:var(--muted);font-size:12.5px;padding:10px 0}
.todo{display:flex;align-items:flex-start;gap:8px;padding:8px;border-radius:10px;background:#fafbff;border:1px solid transparent}
.todo:hover{border-color:var(--line)}
.todo.overdue{background:#fff7f7}
.todo-main{flex:1}
.todo-t{font-size:13.5px}
.todo-m{margin-top:2px}
.q1{border-top:3px solid var(--bad)}.q2{border-top:3px solid var(--pri)}
.q3{border-top:3px solid var(--warn)}.q4{border-top:3px solid #94a3b8}

/* 课表 */
.timetable td{text-align:center;height:66px;cursor:pointer;transition:.12s;min-width:110px}
.timetable td:hover{background:var(--pri-soft)}
.timetable td.has{background:#fbfcff}
.timetable td.today,.timetable th.today{background:#fffdf3}
.timetable td.today.has{background:#fff8e6}
.p-th{background:#fafbff!important;font-size:12px;color:var(--muted);width:66px}
.tt-cls{font-weight:650;font-size:13px}
.tt-ct{font-size:12px;color:#5a6079}
.tt-room{font-size:11px;color:var(--muted)}
.tt-add{color:#d5d8e8;font-size:16px}
.today-row{display:flex;gap:10px;flex-wrap:wrap}
.course-chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:linear-gradient(120deg,#fff,#fafbff)}
.course-chip b{color:var(--pri)}
.course-chip em{font-style:normal;color:#5a6079;font-size:13px}
.course-chip i{font-style:normal;color:var(--muted);font-size:12px}

/* 图表 */
.chart{width:100%}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart.radar,.chart.donut{max-width:360px;margin:0 auto}
.chart-empty{padding:36px;text-align:center;color:var(--muted);font-size:13px;background:#fafbff;border-radius:10px}
.grid{stroke:#eef0f6;stroke-width:1}
.ax-y{font-size:10px;fill:#a2a8bd;text-anchor:end}
.ax-x{font-size:10.5px;fill:#8a90a6;text-anchor:middle}
.bar-val{font-size:11px;fill:#5a6079;text-anchor:middle;font-weight:600}
.radar-grid{stroke:#e8eaf2;fill:none;stroke-width:1}
.radar-label{font-size:11px;fill:#6b7189}
.donut-v{font-size:22px;font-weight:700;fill:#1f2437;text-anchor:middle}
.donut-l{font-size:11px;fill:#8a90a6;text-anchor:middle}
.chart-legend{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:8px;font-size:12px;color:#6b7189}
.chart-legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
.chart-legend.wrap{max-width:100%}

/* 强弱项 */
.sw-box{background:#fafbff;border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px}
.sw-line{font-size:13px;margin-bottom:4px}

/* 学生档案 */
.profile h4{font-size:13px;color:#6b7189;margin:14px 0 8px}
.pf-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.pf-head h3{font-size:18px}
.pf-actions{display:flex;gap:6px;flex-wrap:wrap}
.pf-risks{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.pf-kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:12px 0;background:#fafbff;border:1px solid var(--line);border-radius:12px;padding:12px}
.pf-kpis div{text-align:center}
.pf-kpis b{display:block;font-size:17px}
.pf-kpis span{font-size:11px;color:var(--muted)}
.timeline{display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.tl-item{padding:6px 8px;background:#fafbff;border-left:3px solid var(--pri);border-radius:6px}
.tl-item.bad{border-color:var(--bad)}
.tl-d{color:var(--muted);margin-right:6px}

/* 导入预览 / 推荐 */
.preview{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fafbff}
.preview-head{font-size:13px;margin-bottom:6px}
.pick-list{display:flex;flex-direction:column;gap:6px;max-height:320px;overflow-y:auto}
.pick-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fafbff;cursor:pointer;font-size:13px}
.part-row{display:flex;gap:8px;margin-bottom:6px}
.tips{margin:8px 0;padding-left:18px;font-size:13px;line-height:1.9;color:#5a6079}
.sql summary{cursor:pointer;font-size:12.5px;color:var(--pri)}
.code{background:#1e2140;color:#d7dbf5;padding:12px;border-radius:10px;font-size:12px;overflow:auto;margin:8px 0}
.sync-state{font-size:12.5px;padding:6px 12px;border-radius:999px;background:#f1f2f8;color:var(--muted)}
.sync-state.ok{background:#f2fdf9;color:var(--ok)}
.sync-state.dirty{background:#fffbf2;color:var(--warn)}

/* 弹窗 */
.modal-mask{position:fixed;inset:0;background:rgba(20,23,44,.42);display:grid;place-items:center;z-index:100;opacity:0;transition:.2s;padding:20px}
.modal-mask.show{opacity:1}
.modal{background:#fff;border-radius:16px;width:100%;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(20,23,44,.28);transform:translateY(8px);transition:.2s}
.modal-mask.show .modal{transform:none}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal-head h3{font-size:15.5px;font-weight:650}
.modal-body{padding:18px;overflow-y:auto}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:#fafbff;border-radius:0 0 16px 16px}
.tabs.sm{display:flex;gap:6px;margin-bottom:6px}
.tabs .tab{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 12px;font-size:12.5px;cursor:pointer;font-family:inherit;color:var(--muted)}
.tabs .tab.active{background:var(--pri);border-color:var(--pri);color:#fff}

/* Toast */
#toast-root{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:#1f2437;color:#fff;padding:9px 18px;border-radius:999px;font-size:13px;opacity:0;transform:translateY(-8px);transition:.25s;box-shadow:0 10px 26px rgba(20,23,44,.25)}
.toast.show{opacity:1;transform:none}
.toast.err{background:var(--bad)}
.toast.warn{background:var(--warn)}

/* 响应式 */
@media(max-width:1180px){
  .dash-grid{grid-template-columns:1fr 1fr}
  .kpi-row.five{grid-template-columns:repeat(3,1fr)}
  .pf-kpis{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:900px){
  .sidebar{position:fixed;left:-232px;z-index:60;transition:.25s}
  body.nav-open .sidebar{left:0;box-shadow:0 0 40px rgba(0,0,0,.3)}
  .only-mobile{display:inline-flex}
  .grid-2,.dash-grid,.quad-grid,.form.grid2,.grid2,.grid3{grid-template-columns:1fr}
  .kpi-row,.kpi-row.five{grid-template-columns:1fr 1fr}
  .span2{grid-column:auto}
  .view{padding:14px}
  body.nav-open .nav-overlay{display:block;position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.4)}
}
.nav-overlay{display:none}

    <div>
      <h1>班级管理工作台</h1>

</main>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script>
var LS = (function(){
  try {
    var t = '__ls_probe__';
    window.localStorage.setItem(t, t);
    window.localStorage.removeItem(t);
    return window.localStorage;
  } catch (e) {
    var mem = {};
    return {
      getItem: function(k){ return (k in mem) ? mem[k] : null; },
      setItem: function(k, v){ mem[k] = String(v); },
      removeItem: function(k){ delete mem[k]; }
    };
  }
})();

/* ===========================================================
 * store.js — 本地数据层（LS）
 * 所有数据默认只存在本机浏览器，可选推送到 Supabase
 * =========================================================== */
(function () {
  const KEY = 'hailey_workbench_v1';
  const nowISO = () => new Date().toISOString();

  function uid(p) {
    return (p || 'id') + '_' + Date.now().toString(36).slice(-5) + Math.random().toString(36).slice(2, 7);
  }

  const DEFAULT_PARTS = [
    { name: '选择题', full: 100 },
    { name: '主观题', full: 50 },
    { name: '听力表格', full: 10 },
    { name: '短文填空', full: 10 },
    { name: '阅读表达', full: 10 },
    { name: '回答问题', full: 10 },
    { name: '作文', full: 10 }
  ];

  function currentTerm() {
    const d = new Date();
    // 9 月之后算新学年
    const y = d.getMonth() + 1 >= 9 ? d.getFullYear() : d.getFullYear() - 1;
    return y + '-' + (y + 1) + ' 学年';
  }

  // 按“中考年份”推导届别：初三在本学年 6 月毕业
  function defaultGradYear() {
    const d = new Date();
    return d.getMonth() + 1 >= 9 ? d.getFullYear() + 1 : d.getFullYear();
  }

  function defaultDB() {
    const gy = defaultGradYear();
    return {
      meta: {
        version: 1,
        teacher: 'Hailey',
        subject: '英语',
        term: currentTerm(),
        gradYear: gy, // 届别（中考年份）
        updatedAt: nowISO()
      },
      classes: [
        { id: 'cls_4', name: '初三四班', grade: '初三', gradYear: gy },
        { id: 'cls_8', name: '初三八班', grade: '初三', gradYear: gy }
      ],
      students: [],   // {id,classId,name,no,parentPhone,parentName,tags[],focus,note}
      checks: [],     // {id,kind:'dictation'|'recitation',classId,date,scope,note,results:{sid:1|0}}
      retests: [],    // {id,studentId,kind,scope,date,srcId,done,doneDate}
      exams: [],      // {id,name,date,scope,parts:[{name,full}],lines:{high,mid,low},scores:[{studentId,total,parts:[]}]}
      comms: [],      // {id,studentId,date,way,topic,content,needFollow,followDate,followDone}
      todos: [],      // {id,title,quadrant:1..4,due,done,source,refId,createdAt}
      discipline: [], // {id,studentId,date,type,detail,handled}
      timetable: {},  // {'1-3': {classId,content,room}}
      settings: {
        parts: DEFAULT_PARTS,
        lines: { high: 130, mid: 110, low: 90 },
        fullScore: 150,
        band: 8,                  // 临界生分差
        periods: 8,               // 每天节次
        days: 5,                  // 周几到周几
        tags: ['临界生', '全卷及格生', 'A卷合格生', '需家校跟进', '偏科', '待提升', '进步显著', '课堂活跃'],
        discTypes: ['迟到', '作业未交', '上课讲话', '不带课本', '顶撞老师', '违规带手机', '其他'],
        commWays: ['电话', '微信', '面谈', '家访', '家长会'],
        supabase: { url: 'https://wnenjltqmvqemrbrkgub.supabase.co', key: 'sb_publishable_rlq1LndXZ2PRat5AaQVPjw_2wHdljGJ', table: 'workbench', rowId: 'hailey', auto: true, interval: 60 }
      }
    };
  }

  function deepMerge(base, patch) {
    if (Array.isArray(base) || typeof base !== 'object' || base === null) return patch === undefined ? base : patch;
    const out = Object.assign({}, base);
    if (patch && typeof patch === 'object') {
      Object.keys(patch).forEach(k => {
        out[k] = (k in base) ? deepMerge(base[k], patch[k]) : patch[k];
      });
    }
    return out;
  }

  let db;
  try {
    const raw = LS.getItem(KEY);
    db = raw ? deepMerge(defaultDB(), JSON.parse(raw)) : defaultDB();
  } catch (e) {
    console.warn('本地数据解析失败，已重置', e);
    db = defaultDB();
  }

  let timer = null;
  let dirty = false;

  function persist() {
    db.meta.updatedAt = nowISO();
    LS.setItem(KEY, JSON.stringify(db));
    dirty = true;
    document.dispatchEvent(new CustomEvent('store:change'));
  }

  function save() {
    clearTimeout(timer);
    timer = setTimeout(persist, 120);
  }

  const Store = {
    KEY,
    get db() { return db; },
    uid,
    save,
    saveNow: persist,
    get dirty() { return dirty; },
    clearDirty() { dirty = false; },

    setDB(next) {
      db = deepMerge(defaultDB(), next || {});
      LS.setItem(KEY, JSON.stringify(db));
      dirty = false;
      document.dispatchEvent(new CustomEvent('store:change'));
    },

    reset() {
      db = defaultDB();
      persist();
    },

    /* ---------- 查询辅助 ---------- */
    classes() { return db.classes; },
    className(id) { const c = db.classes.find(c => c.id === id); return c ? c.name : '—'; },
    students(classId) {
      const list = classId ? db.students.filter(s => s.classId === classId) : db.students.slice();
      return list.sort((a, b) => (a.classId === b.classId)
        ? (Number(a.no || 999) - Number(b.no || 999) || a.name.localeCompare(b.name, 'zh'))
        : a.classId.localeCompare(b.classId));
    },
    student(id) { return db.students.find(s => s.id === id); },
    studentName(id) { const s = this.student(id); return s ? s.name : '（已删除学生）'; },

    /* ---------- 学生 ---------- */
    addStudent(s) {
      const stu = Object.assign({
        id: uid('stu'), classId: db.classes[0] && db.classes[0].id, name: '', no: '',
        parentPhone: '', parentName: '', tags: [], focus: false, note: ''
      }, s);
      db.students.push(stu);
      save();
      return stu;
    },
    updateStudent(id, patch) {
      const s = this.student(id);
      if (s) { Object.assign(s, patch); save(); }
      return s;
    },
    removeStudent(id) {
      db.students = db.students.filter(s => s.id !== id);
      db.retests = db.retests.filter(r => r.studentId !== id);
      save();
    },

    /* ---------- 听写 / 背诵 ---------- */
    saveCheck(rec) {
      const exist = rec.id && db.checks.find(c => c.id === rec.id);
      let item;
      if (exist) { Object.assign(exist, rec); item = exist; }
      else { item = Object.assign({ id: uid('chk') }, rec); db.checks.push(item); }
      this.syncRetests(item);
      save();
      return item;
    },
    removeCheck(id) {
      db.checks = db.checks.filter(c => c.id !== id);
      db.retests = db.retests.filter(r => r.srcId !== id);
      save();
    },
    // 未过关 -> 二次待办池；过关 -> 自动销项
    syncRetests(rec) {
      Object.keys(rec.results || {}).forEach(sid => {
        const pass = rec.results[sid] === 1;
        const key = r => r.studentId === sid && r.kind === rec.kind && r.scope === rec.scope;
        const found = db.retests.find(r => key(r) && r.srcId === rec.id);
        if (!pass) {
          if (!found) {
            db.retests.push({
              id: uid('rt'), studentId: sid, kind: rec.kind, scope: rec.scope,
              date: rec.date, srcId: rec.id, done: false, doneDate: ''
            });
          } else { found.done = false; found.doneDate = ''; }
        } else {
          if (found) { found.done = true; found.doneDate = rec.date; }
          // 同范围同类型的历史欠账一并销项
          db.retests.filter(r => key(r) && !r.done && r.date <= rec.date).forEach(r => {
            r.done = true; r.doneDate = rec.date;
          });
        }
      });
    },
    pendingRetests(studentId) {
      return db.retests.filter(r => !r.done && (!studentId || r.studentId === studentId));
    },

    /* ---------- 通用增删改 ---------- */
    push(coll, item, prefix) {
      const it = Object.assign({ id: uid(prefix || coll.slice(0, 3)) }, item);
      db[coll].push(it); save(); return it;
    },
    patch(coll, id, patch) {
      const it = db[coll].find(x => x.id === id);
      if (it) { Object.assign(it, patch); save(); }
      return it;
    },
    remove(coll, id) {
      db[coll] = db[coll].filter(x => x.id !== id);
      save();
    },

    /* ---------- 备份 / 换届 ---------- */
    exportJSON() { return JSON.stringify(db, null, 2); },
    importJSON(text) {
      const obj = JSON.parse(text);
      if (!obj || !obj.students) throw new Error('文件格式不正确');
      this.setDB(obj);
    },
    // 换届：保留课表与设置，清空学生与全部记录
    newTerm(opts) {
      const o = Object.assign({ keepTimetable: true, keepSettings: true, gradYear: defaultGradYear(), classNames: [] }, opts);
      const fresh = defaultDB();
      if (o.keepSettings) fresh.settings = JSON.parse(JSON.stringify(db.settings));
      if (o.keepTimetable) fresh.timetable = JSON.parse(JSON.stringify(db.timetable));
      fresh.meta.gradYear = o.gradYear;
      fresh.meta.term = currentTerm();
      if (o.classNames.length) {
        fresh.classes = o.classNames.map((n, i) => ({
          id: 'cls_' + (i + 1) + '_' + o.gradYear, name: n, grade: n.replace(/[^初高一二三年级]/g, '') || '初三', gradYear: o.gradYear
        }));
      } else {
        fresh.classes = db.classes.map(c => ({ id: c.id, name: c.name, grade: c.grade, gradYear: o.gradYear }));
      }
      db = fresh;
      persist();
    },

    defaultParts: () => JSON.parse(JSON.stringify(DEFAULT_PARTS))
  };

  window.Store = Store;
})();

</script>
<script>
/* ===========================================================
 * ui.js — 通用工具：DOM、日期、弹窗、提示
 * =========================================================== */
(function () {
  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

  function esc(s) {
    return String(s === undefined || s === null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  /* ---------- 日期 ---------- */
  const pad = n => (n < 10 ? '0' + n : '' + n);
  function ymd(d) {
    const x = d ? new Date(d) : new Date();
    return x.getFullYear() + '-' + pad(x.getMonth() + 1) + '-' + pad(x.getDate());
  }
  const today = () => ymd(new Date());
  function addDays(dateStr, n) {
    const d = new Date(dateStr + 'T00:00:00');
    d.setDate(d.getDate() + n);
    return ymd(d);
  }
  function diffDays(a, b) {
    return Math.round((new Date(a + 'T00:00:00') - new Date(b + 'T00:00:00')) / 86400000);
  }
  function weekday(dateStr) {
    const d = new Date((dateStr || today()) + 'T00:00:00');
    return d.getDay() === 0 ? 7 : d.getDay(); // 1..7
  }
  function weekRange(dateStr) {
    const base = dateStr || today();
    const wd = weekday(base);
    return { start: addDays(base, 1 - wd), end: addDays(base, 7 - wd) };
  }
  function mdLabel(dateStr) { return dateStr ? dateStr.slice(5) : ''; }

  /* ---------- 提示 ---------- */
  let toastTimer;
  function toast(msg, type) {
    const root = $('#toast-root');
    const el = document.createElement('div');
    el.className = 'toast ' + (type || 'ok');
    el.innerHTML = esc(msg);
    root.appendChild(el);
    setTimeout(() => el.classList.add('show'), 10);
    setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, 2600);
  }

  /* ---------- 弹窗 ---------- */
  function modal(opt) {
    const o = Object.assign({ title: '', body: '', okText: '保存', cancelText: '取消', width: 560, onOk: null, hideFooter: false }, opt);
    const root = $('#modal-root');
    const wrap = document.createElement('div');
    wrap.className = 'modal-mask';
    wrap.innerHTML = `
      <div class="modal" style="max-width:${o.width}px">
        <div class="modal-head"><h3>${esc(o.title)}</h3><button class="icon-btn" data-close>✕</button></div>
        <div class="modal-body">${o.body}</div>
        ${o.hideFooter ? '' : `<div class="modal-foot">
          <button class="btn ghost" data-close>${esc(o.cancelText)}</button>
          <button class="btn primary" data-ok>${esc(o.okText)}</button>
        </div>`}
      </div>`;
    root.appendChild(wrap);
    requestAnimationFrame(() => wrap.classList.add('show'));
    const close = () => { wrap.classList.remove('show'); setTimeout(() => wrap.remove(), 200); };
    $$('[data-close]', wrap).forEach(b => b.onclick = close);
    wrap.addEventListener('mousedown', e => { if (e.target === wrap) close(); });
    const okBtn = $('[data-ok]', wrap);
    if (okBtn) okBtn.onclick = () => { if (!o.onOk || o.onOk(wrap, close) !== false) close(); };
    return { el: wrap, close };
  }

  function confirmBox(msg, onOk, opt) {
    const o = Object.assign({ title: '请确认', okText: '确定', danger: false }, opt);
    const m = modal({
      title: o.title, width: 420,
      body: `<p class="confirm-text">${msg}</p>`,
      okText: o.okText,
      onOk: () => { onOk && onOk(); }
    });
    if (o.danger) $('[data-ok]', m.el).classList.add('danger');
    return m;
  }

  function download(filename, content, mime) {
    const blob = new Blob(['\ufeff' + content], { type: mime || 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  function pct(n, d) { return d ? Math.round((n / d) * 1000) / 10 : 0; }

  function tagChip(t) { return `<span class="chip">${esc(t)}</span>`; }

  function selectOptions(list, value, labelKey, valueKey) {
    return list.map(x => {
      const v = valueKey ? x[valueKey] : x;
      const l = labelKey ? x[labelKey] : x;
      return `<option value="${esc(v)}"${String(v) === String(value) ? ' selected' : ''}>${esc(l)}</option>`;
    }).join('');
  }

  function classOptions(value, allLabel) {
    const opts = Store.classes().map(c => `<option value="${c.id}"${c.id === value ? ' selected' : ''}>${esc(c.name)}</option>`).join('');
    return (allLabel ? `<option value=""${!value ? ' selected' : ''}>${esc(allLabel)}</option>` : '') + opts;
  }

  function studentOptions(value, classId) {
    return Store.students(classId).map(s =>
      `<option value="${s.id}"${s.id === value ? ' selected' : ''}>${esc(s.name)}（${esc(Store.className(s.classId))}）</option>`).join('');
  }

  function empty(text, icon) {
    return `<div class="empty"><div class="empty-ico">${icon || '📭'}</div><p>${esc(text)}</p></div>`;
  }

  window.UI = {
    $, $$, esc, ymd, today, addDays, diffDays, weekday, weekRange, mdLabel,
    toast, modal, confirmBox, download, pct, tagChip, selectOptions,
    classOptions, studentOptions, empty
  };
})();

</script>
<script>
/* ===========================================================
 * charts.js — 零依赖 SVG 图表（折线 / 雷达 / 柱状 / 环形）
 * 全部返回 HTML 字符串，直接插入即可
 * =========================================================== */
(function () {
  const PAL = ['#6366f1', '#f59e0b', '#10b981', '#ef4444', '#0ea5e9', '#a855f7', '#ec4899', '#14b8a6'];
  const esc = s => String(s === undefined || s === null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  function legend(series) {
    if (!series || series.length < 1) return '';
    return `<div class="chart-legend">` + series.map((s, i) =>
      `<span><i style="background:${s.color || PAL[i % PAL.length]}"></i>${esc(s.name)}</span>`).join('') + `</div>`;
  }

  function niceMax(v) {
    if (v <= 0) return 10;
    const p = Math.pow(10, Math.floor(Math.log10(v)));
    const n = v / p;
    const step = n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10;
    return step * p;
  }

  /* ---------------- 折线图 ---------------- */
  function line(opt) {
    const o = Object.assign({ labels: [], series: [], height: 240, yMax: null, suffix: '', area: true }, opt);
    if (!o.labels.length) return `<div class="chart-empty">暂无数据</div>`;
    const W = 720, H = o.height, pl = 44, pr = 16, pt = 16, pb = 34;
    const iw = W - pl - pr, ih = H - pt - pb;
    let max = o.yMax;
    if (max === null) {
      const all = o.series.reduce((a, s) => a.concat(s.data.filter(v => v !== null && v !== undefined)), []);
      max = niceMax(Math.max.apply(null, all.length ? all : [1]));
    }
    max = max || 1;
    const n = o.labels.length;
    const x = i => pl + (n === 1 ? iw / 2 : (i * iw) / (n - 1));
    const y = v => pt + ih - (Math.max(0, Math.min(v, max)) / max) * ih;

    let g = '';
    for (let i = 0; i <= 4; i++) {
      const yy = pt + (ih * i) / 4;
      const val = Math.round((max * (4 - i)) / 4 * 10) / 10;
      g += `<line x1="${pl}" y1="${yy}" x2="${W - pr}" y2="${yy}" class="grid"/>
            <text x="${pl - 8}" y="${yy + 4}" class="ax-y">${val}</text>`;
    }
    const step = Math.ceil(n / 10);
    let xl = '';
    o.labels.forEach((l, i) => {
      if (i % step === 0 || i === n - 1) xl += `<text x="${x(i)}" y="${H - 10}" class="ax-x">${esc(l)}</text>`;
    });

    let paths = '';
    o.series.forEach((s, si) => {
      const color = s.color || PAL[si % PAL.length];
      const pts = s.data.map((v, i) => (v === null || v === undefined) ? null : [x(i), y(v)]).filter(Boolean);
      if (!pts.length) return;
      const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
      if (o.area && o.series.length <= 2) {
        paths += `<path d="${d} L${pts[pts.length - 1][0].toFixed(1)},${pt + ih} L${pts[0][0].toFixed(1)},${pt + ih} Z" fill="${color}" opacity=".10"/>`;
      }
      paths += `<path d="${d}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`;
      s.data.forEach((v, i) => {
        if (v === null || v === undefined) return;
        paths += `<circle cx="${x(i)}" cy="${y(v)}" r="3.6" fill="#fff" stroke="${color}" stroke-width="2">
          <title>${esc(s.name)} · ${esc(o.labels[i])}：${v}${esc(o.suffix)}</title></circle>`;
      });
    });

    return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${g}${paths}${xl}</svg></div>` + legend(o.series);
  }

  /* ---------------- 雷达图 ---------------- */
  function radar(opt) {
    const o = Object.assign({ axes: [], series: [], size: 320, max: 100, suffix: '%' }, opt);
    if (!o.axes.length) return `<div class="chart-empty">暂无数据</div>`;
    const S = o.size, c = S / 2, r = S / 2 - 54, n = o.axes.length;
    const pt = (i, ratio) => {
      const a = -Math.PI / 2 + (i * 2 * Math.PI) / n;
      return [c + Math.cos(a) * r * ratio, c + Math.sin(a) * r * ratio];
    };
    let grid = '';
    for (let k = 1; k <= 4; k++) {
      const p = o.axes.map((_, i) => pt(i, k / 4).map(v => v.toFixed(1)).join(',')).join(' ');
      grid += `<polygon points="${p}" class="radar-grid"/>`;
    }
    o.axes.forEach((_, i) => {
      const p = pt(i, 1);
      grid += `<line x1="${c}" y1="${c}" x2="${p[0].toFixed(1)}" y2="${p[1].toFixed(1)}" class="radar-grid"/>`;
    });
    let labels = '';
    o.axes.forEach((a, i) => {
      const p = pt(i, 1.19);
      const anchor = p[0] > c + 6 ? 'start' : (p[0] < c - 6 ? 'end' : 'middle');
      labels += `<text x="${p[0].toFixed(1)}" y="${(p[1] + 4).toFixed(1)}" text-anchor="${anchor}" class="radar-label">${esc(a)}</text>`;
    });
    let shapes = '';
    o.series.forEach((s, si) => {
      const color = s.color || PAL[si % PAL.length];
      const pts = s.data.map((v, i) => pt(i, Math.max(0, Math.min(v / o.max, 1))));
      shapes += `<polygon points="${pts.map(p => p.map(v => v.toFixed(1)).join(',')).join(' ')}"
                 fill="${color}" fill-opacity=".16" stroke="${color}" stroke-width="2"/>`;
      pts.forEach((p, i) => {
        shapes += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="${color}">
          <title>${esc(s.name)} · ${esc(o.axes[i])}：${Math.round(s.data[i] * 10) / 10}${esc(o.suffix)}</title></circle>`;
      });
    });
    return `<div class="chart radar"><svg viewBox="0 0 ${S} ${S}">${grid}${shapes}${labels}</svg></div>` + legend(o.series);
  }

  /* ---------------- 柱状图 ---------------- */
  function bar(opt) {
    const o = Object.assign({ labels: [], data: [], height: 230, colors: null, suffix: '', yMax: null }, opt);
    if (!o.labels.length) return `<div class="chart-empty">暂无数据</div>`;
    const W = 720, H = o.height, pl = 44, pr = 16, pt = 16, pb = 40;
    const iw = W - pl - pr, ih = H - pt - pb;
    const max = o.yMax || niceMax(Math.max.apply(null, o.data.concat([1])));
    const bw = Math.min(56, (iw / o.labels.length) * 0.58);
    let g = '';
    for (let i = 0; i <= 4; i++) {
      const yy = pt + (ih * i) / 4;
      g += `<line x1="${pl}" y1="${yy}" x2="${W - pr}" y2="${yy}" class="grid"/>
            <text x="${pl - 8}" y="${yy + 4}" class="ax-y">${Math.round(max * (4 - i) / 4 * 10) / 10}</text>`;
    }
    let bars = '';
    o.labels.forEach((l, i) => {
      const cx = pl + (iw / o.labels.length) * (i + 0.5);
      const v = o.data[i] || 0;
      const h = (Math.max(0, v) / max) * ih;
      const color = (o.colors && o.colors[i]) || PAL[i % PAL.length];
      bars += `<rect x="${(cx - bw / 2).toFixed(1)}" y="${(pt + ih - h).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(h, 0).toFixed(1)}"
                rx="6" fill="${color}" opacity=".88"><title>${esc(l)}：${v}${esc(o.suffix)}</title></rect>
               <text x="${cx.toFixed(1)}" y="${(pt + ih - h - 6).toFixed(1)}" class="bar-val">${v}${esc(o.suffix)}</text>
               <text x="${cx.toFixed(1)}" y="${H - 14}" class="ax-x">${esc(l)}</text>`;
    });
    return `<div class="chart"><svg viewBox="0 0 ${W} ${H}">${g}${bars}</svg></div>`;
  }

  /* ---------------- 环形图 ---------------- */
  function donut(opt) {
    const o = Object.assign({ items: [], size: 220, centerLabel: '', centerValue: '' }, opt);
    const total = o.items.reduce((a, b) => a + b.value, 0);
    if (!total) return `<div class="chart-empty">暂无数据</div>`;
    const S = o.size, c = S / 2, r = S / 2 - 16, cir = 2 * Math.PI * r;
    let off = 0, arcs = '';
    o.items.forEach((it, i) => {
      const frac = it.value / total;
      const color = it.color || PAL[i % PAL.length];
      arcs += `<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${color}" stroke-width="22"
        stroke-dasharray="${(frac * cir).toFixed(2)} ${(cir - frac * cir).toFixed(2)}"
        stroke-dashoffset="${(-off * cir).toFixed(2)}" transform="rotate(-90 ${c} ${c})">
        <title>${esc(it.label)}：${it.value}（${Math.round(frac * 100)}%）</title></circle>`;
      off += frac;
    });
    const center = `<text x="${c}" y="${c - 2}" class="donut-v">${esc(o.centerValue || total)}</text>
                    <text x="${c}" y="${c + 18}" class="donut-l">${esc(o.centerLabel || '合计')}</text>`;
    const list = o.items.map((it, i) =>
      `<span><i style="background:${it.color || PAL[i % PAL.length]}"></i>${esc(it.label)} · ${it.value}</span>`).join('');
    return `<div class="chart donut"><svg viewBox="0 0 ${S} ${S}">${arcs}${center}</svg></div>
            <div class="chart-legend wrap">${list}</div>`;
  }

  /* ---------------- 迷你横条 ---------------- */
  function meter(v, max, color) {
    const p = max ? Math.max(0, Math.min(100, (v / max) * 100)) : 0;
    return `<div class="meter"><i style="width:${p.toFixed(1)}%;background:${color || '#6366f1'}"></i></div>`;
  }

  window.Charts = { line, radar, bar, donut, meter, PAL };
})();

</script>
<script>
/* ===========================================================
 * analytics.js — 统计与分析（过关率 / 成绩 / 预警）
 * =========================================================== */
(function () {
  const D = () => Store.db;

  /* ---------------- 听写 / 背诵 ---------------- */
  function checks(kind, classId, from, to) {
    return D().checks.filter(c =>
      (!kind || c.kind === kind) &&
      (!classId || c.classId === classId) &&
      (!from || c.date >= from) &&
      (!to || c.date <= to)
    ).sort((a, b) => a.date.localeCompare(b.date));
  }

  function recordRate(rec) {
    const vals = Object.values(rec.results || {});
    const total = vals.length;
    const pass = vals.filter(v => v === 1).length;
    return { total, pass, fail: total - pass, rate: total ? Math.round((pass / total) * 1000) / 10 : 0 };
  }

  // 某学生近 N 天过关情况
  function studentPass(studentId, kind, days) {
    const from = days ? UI.addDays(UI.today(), -days) : null;
    let total = 0, pass = 0, failList = [];
    checks(kind, null, from).forEach(c => {
      const v = c.results && c.results[studentId];
      if (v === undefined) return;
      total++;
      if (v === 1) pass++; else failList.push({ date: c.date, scope: c.scope, kind: c.kind });
    });
    return { total, pass, fail: total - pass, rate: total ? Math.round((pass / total) * 1000) / 10 : null, failList };
  }

  // 班级 × 范围 过关率矩阵
  function scopeMatrix(kind, classId) {
    const list = checks(kind, classId);
    const scopes = [];
    const map = {};
    list.forEach(c => {
      const key = c.scope || '未命名范围';
      if (!map[key]) { map[key] = {}; scopes.push(key); }
      const r = recordRate(c);
      const cur = map[key][c.classId] || { total: 0, pass: 0 };
      cur.total += r.total; cur.pass += r.pass;
      map[key][c.classId] = cur;
    });
    return { scopes, map };
  }

  /* ---------------- 成绩 ---------------- */
  function exam(id) { return D().exams.find(e => e.id === id); }

  function examStats(ex) {
    if (!ex) return null;
    const parts = ex.parts || Store.db.settings.parts;
    const lines = ex.lines || Store.db.settings.lines;
    const rows = (ex.scores || []).map(s => {
      const stu = Store.student(s.studentId);
      return stu ? Object.assign({}, s, { name: stu.name, classId: stu.classId, focus: stu.focus, tags: stu.tags || [] }) : null;
    }).filter(Boolean);

    const group = (list) => {
      if (!list.length) return null;
      const totals = list.map(r => r.total || 0);
      const sum = totals.reduce((a, b) => a + b, 0);
      const partAvg = parts.map((p, i) => {
        const vs = list.map(r => (r.parts && r.parts[i]) || 0);
        return Math.round((vs.reduce((a, b) => a + b, 0) / list.length) * 10) / 10;
      });
      const sorted = list.slice().sort((a, b) => b.total - a.total);
      return {
        count: list.length,
        avg: Math.round((sum / list.length) * 10) / 10,
        max: Math.max.apply(null, totals),
        min: Math.min.apply(null, totals),
        partAvg,
        partRate: partAvg.map((v, i) => Math.round((v / (parts[i].full || 1)) * 1000) / 10),
        lineCount: {
          high: list.filter(r => r.total >= lines.high).length,
          mid: list.filter(r => r.total >= lines.mid).length,
          low: list.filter(r => r.total >= lines.low).length
        },
        ranked: sorted.map((r, i) => Object.assign({}, r, { rank: i + 1 }))
      };
    };

    const byClass = {};
    Store.classes().forEach(c => {
      const g = group(rows.filter(r => r.classId === c.id));
      if (g) byClass[c.id] = g;
    });

    return { exam: ex, parts, lines, rows, all: group(rows), byClass };
  }

  // 临界生：低于某条线但差距在 band 之内
  function borderline(ex, band) {
    const st = examStats(ex);
    if (!st || !st.all) return [];
    const b = band || Store.db.settings.band || 8;
    const lines = st.lines;
    const out = [];
    st.rows.forEach(r => {
      ['high', 'mid', 'low'].forEach(k => {
        const gap = lines[k] - (r.total || 0);
        if (gap > 0 && gap <= b) {
          out.push({ studentId: r.studentId, name: r.name, classId: r.classId, total: r.total, line: k, lineScore: lines[k], gap: Math.round(gap * 10) / 10 });
        }
      });
    });
    const order = { high: 0, mid: 1, low: 2 };
    return out.sort((a, b2) => order[a.line] - order[b2.line] || a.gap - b2.gap);
  }

  // 重点关注分类：全卷及格生 + A卷合格生
  // 全卷及格生：总分 ≥ 90 分
  // A卷合格生：选择题（或"英语A卷"）得分在 50-70 分之间
  function focusStudents(ex) {
    const st = examStats(ex);
    if (!st || !st.all) return { fullPass: [], aPass: [] };
    const passLine = 90; // 全卷及格线

    // 找到"A卷"/"选择题"分项的索引
    const partNames = (st.parts || []).map(p => p.name);
    const aPartIdx = partNames.findIndex(n => n === '选择题' || n === '英语A卷' || n === 'A卷');

    const fullPass = [];
    const aPass = [];
    st.rows.forEach(r => {
      const total = r.total || 0;
      // 全卷及格生：总分 ≥ 90
      if (total >= passLine) {
        fullPass.push({
          studentId: r.studentId, name: r.name, classId: r.classId,
          total, lineScore: passLine
        });
      }
      // A卷合格生：选择题/A卷得分在 50-70 分之间
      if (aPartIdx >= 0) {
        const aScore = (r.parts || [])[aPartIdx];
        if (aScore !== undefined && aScore !== null && aScore >= 50 && aScore <= 70) {
          aPass.push({
            studentId: r.studentId, name: r.name, classId: r.classId,
            total, aScore, partName: partNames[aPartIdx]
          });
        }
      }
    });

    fullPass.sort((a, b) => b.total - a.total);
    aPass.sort((a, b) => b.total - a.total);
    return { fullPass, aPass };
  }

  // 自动更新学生重点关注标签
  function autoFocusStudents(ex) {
    const { fullPass, aPass } = focusStudents(ex);
    const passIds = new Set(fullPass.map(s => s.studentId));
    const aPassIds = new Set(aPass.map(s => s.studentId));

    // 获取所有当前已有标签的学生，清理旧的自动标签（含已废弃的"高线指标生"）
    Store.students().forEach(s => {
      const tags = (s.tags || []).filter(t => t !== '高线指标生' && t !== 'A卷合格生' && t !== '全卷及格生');
      let newTags = tags.slice();
      let needUpdate = false;

      if (passIds.has(s.id)) {
        newTags.push('全卷及格生');
        needUpdate = true;
      }
      if (aPassIds.has(s.id)) {
        newTags.push('A卷合格生');
        needUpdate = true;
      }

      // 如果学生有自动标签，设为 focus；如果之前只有自动标签且现在没有了，也保留 focus（手动加的不动）
      const wasAutoFocus = (s.tags || []).some(t => t === '高线指标生' || t === 'A卷合格生' || t === '全卷及格生');
      const hasAutoNow = passIds.has(s.id) || aPassIds.has(s.id);

      if (newTags.length !== (s.tags || []).length || newTags.some(t => !(s.tags || []).includes(t))) {
        needUpdate = true;
      }

      if (needUpdate || (wasAutoFocus && !hasAutoNow)) {
        const focus = hasAutoNow ? true : s.focus; // 有自动标签的一定关注；没有的不取消手动关注的
        Store.updateStudent(s.id, { tags: newTags, focus });
      }
    });

    return { fullPass, aPass };
  }

  // 按最近一次有成绩的考试自动更新关注标签（供页面渲染时调用，幂等：无变化不写库）
  function autoFocusLatest() {
    const exs = (Store.db.exams || [])
      .filter(e => (e.scores || []).length)
      .sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    if (!exs.length) return null;
    return autoFocusStudents(exs[0]);
  }

  // 个人历次考试
  function studentExams(studentId) {
    return D().exams
      .filter(e => (e.scores || []).some(s => s.studentId === studentId))
      .sort((a, b) => (a.date || '').localeCompare(b.date || ''))
      .map(e => {
        const st = examStats(e);
        const row = st.rows.find(r => r.studentId === studentId);
        const cls = st.byClass[row.classId];
        const rank = cls ? cls.ranked.findIndex(r => r.studentId === studentId) + 1 : 0;
        return {
          exam: e, total: row.total || 0, parts: row.parts || [], rank,
          gradeRank: row.gradeRank || null,
          classCount: cls ? cls.count : 0, classAvg: cls ? cls.avg : 0,
          partRate: (e.parts || st.parts).map((p, i) => Math.round((((row.parts || [])[i] || 0) / (p.full || 1)) * 1000) / 10),
          classPartRate: cls ? cls.partRate : []
        };
      });
  }

  // 强弱项：与班级平均得分率对比
  function strengthWeakness(studentId, examId) {
    const list = studentExams(studentId);
    if (!list.length) return null;
    const last = examId ? list.find(x => x.exam.id === examId) : list[list.length - 1];
    if (!last) return null;
    const parts = last.exam.parts || Store.db.settings.parts;
    const items = parts.map((p, i) => ({
      name: p.name,
      rate: last.partRate[i] || 0,
      classRate: last.classPartRate[i] || 0,
      delta: Math.round(((last.partRate[i] || 0) - (last.classPartRate[i] || 0)) * 10) / 10
    }));
    const byRate = items.slice().sort((a, b) => b.rate - a.rate);
    return {
      exam: last.exam, items,
      strong: byRate.slice(0, 2),
      weak: byRate.slice(-2).reverse(),
      belowClass: items.filter(i => i.delta < -5).sort((a, b) => a.delta - b.delta)
    };
  }

  // 成绩变化（最近两次）
  function scoreTrendDelta(studentId) {
    const list = studentExams(studentId);
    if (list.length < 2) return null;
    const a = list[list.length - 2], b = list[list.length - 1];
    return {
      last: b.total, prev: a.total,
      delta: Math.round((b.total - a.total) * 10) / 10,
      rankDelta: a.rank && b.rank ? a.rank - b.rank : 0,
      examName: b.exam.name
    };
  }

  /* ---------------- 违纪 ---------------- */
  function disciplineCount(studentId, days) {
    const from = days ? UI.addDays(UI.today(), -days) : null;
    return D().discipline.filter(d => d.studentId === studentId && (!from || d.date >= from)).length;
  }

  function disciplineWarnings(threshold) {
    const t = threshold || 3;
    const map = {};
    D().discipline.forEach(d => { map[d.studentId] = (map[d.studentId] || 0) + 1; });
    return Object.keys(map).filter(sid => map[sid] >= t && Store.student(sid))
      .map(sid => ({ studentId: sid, name: Store.studentName(sid), classId: (Store.student(sid) || {}).classId, count: map[sid] }))
      .sort((a, b) => b.count - a.count);
  }

  /* ---------------- 家校 ---------------- */
  function followUps() {
    const { end } = UI.weekRange();
    return D().comms.filter(c => c.needFollow && !c.followDone && (!c.followDate || c.followDate <= end))
      .sort((a, b) => (a.followDate || '').localeCompare(b.followDate || ''));
  }

  function lastComm(studentId) {
    const list = D().comms.filter(c => c.studentId === studentId).sort((a, b) => b.date.localeCompare(a.date));
    return list[0] || null;
  }

  /* ---------------- 待办 ---------------- */
  const QUAD = {
    1: { name: '重要且紧急', color: '#ef4444' },
    2: { name: '重要不紧急', color: '#6366f1' },
    3: { name: '紧急不重要', color: '#f59e0b' },
    4: { name: '不重要不紧急', color: '#94a3b8' }
  };

  function topTodos(n) {
    const t = UI.today();
    return D().todos.filter(x => !x.done)
      .sort((a, b) => {
        const oa = (a.due && a.due <= t ? -100 : 0) + a.quadrant;
        const ob = (b.due && b.due <= t ? -100 : 0) + b.quadrant;
        if (oa !== ob) return oa - ob;
        return (a.due || '9999').localeCompare(b.due || '9999');
      }).slice(0, n || 3);
  }

  /* ---------------- 重点学生综合预警 ---------------- */
  function studentProfile(studentId) {
    const stu = Store.student(studentId);
    if (!stu) return null;
    const pass = studentPass(studentId, null, 30);
    const pending = Store.pendingRetests(studentId);
    const disc = D().discipline.filter(d => d.studentId === studentId);
    const disc30 = disc.filter(d => d.date >= UI.addDays(UI.today(), -30));
    const comms = D().comms.filter(c => c.studentId === studentId);
    const trend = scoreTrendDelta(studentId);
    const exams = studentExams(studentId);
    const last = exams[exams.length - 1] || null;
    const sw = strengthWeakness(studentId);

    const risks = [];
    if (pending.length >= 2) risks.push({ level: 'warn', text: `${pending.length} 项未过关待补` });
    if (pass.rate !== null && pass.rate < 60 && pass.total >= 3) risks.push({ level: 'danger', text: `近30天过关率 ${pass.rate}%` });
    if (disc.length >= 3) risks.push({ level: 'danger', text: `违纪累计 ${disc.length} 次` });
    else if (disc30.length >= 1) risks.push({ level: 'warn', text: `近30天违纪 ${disc30.length} 次` });
    if (trend && trend.delta <= -8) risks.push({ level: 'danger', text: `成绩下滑 ${Math.abs(trend.delta)} 分` });
    if (sw && sw.belowClass.length) risks.push({ level: 'warn', text: `弱项：${sw.belowClass.slice(0, 2).map(i => i.name).join('、')}` });
    if (comms.length === 0) risks.push({ level: 'info', text: '尚无家校沟通记录' });

    return {
      student: stu, pass, pending, disc, disc30, comms, trend, last, sw, risks,
      lastComm: comms.sort((a, b) => b.date.localeCompare(a.date))[0] || null
    };
  }

  // 过关预警：待补项 >= 2 的学生
  function passAlerts(min) {
    const m = min || 2;
    const map = {};
    Store.pendingRetests().forEach(r => {
      if (!Store.student(r.studentId)) return;
      (map[r.studentId] = map[r.studentId] || []).push(r);
    });
    return Object.keys(map).filter(k => map[k].length >= m)
      .map(k => ({ studentId: k, name: Store.studentName(k), classId: (Store.student(k) || {}).classId, items: map[k] }))
      .sort((a, b) => b.items.length - a.items.length);
  }

  window.An = {
    checks, recordRate, studentPass, scopeMatrix,
    exam, examStats, borderline, focusStudents, autoFocusStudents, autoFocusLatest, studentExams, strengthWeakness, scoreTrendDelta,
    disciplineCount, disciplineWarnings, followUps, lastComm,

  };
})();

<script>
/* ===========================================================
 * app.js — 路由、侧栏、初始化、示例数据
 * =========================================================== */
window.App = window.App || { pages: {} };

(function () {
  const NAV = [
    { id: 'dashboard', icon: '📊', name: '总览仪表盘' },
    { id: 'focus', icon: '⭐', name: '重点关注学生' },
    { id: 'students', icon: '👥', name: '班级与学生' },
    { id: 'dictation', icon: '✏️', name: '听写过关' },
    { id: 'recitation', icon: '📖', name: '背诵过关' },
    { id: 'exams', icon: '📈', name: '成绩分析' },
    { id: 'comm', icon: '📞', name: '家校沟通' },
    { id: 'todos', icon: '✅', name: '待办四象限' },
    { id: 'discipline', icon: '⚠️', name: '违纪记录' },
    { id: 'timetable', icon: '🗓️', name: '我的课表' },
    { id: 'sync', icon: '☁️', name: '云端同步' }
  ];

  let current = LS.getItem('hailey_page') || 'dashboard';

  App.go = function (id) {
    if (!App.pages[id]) return;
    current = id;
    LS.setItem('hailey_page', id);
    App.render();
    document.querySelector('.main').scrollTo({ top: 0, behavior: 'smooth' });
  };

  App.render = function () {
    const view = document.getElementById('view');
    UI.$$('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.id === current));
    const page = App.pages[current] || App.pages.dashboard;
    view.innerHTML = '';
    page.render(view);
    App.updateSyncBadge();
  };

  App.updateSyncBadge = function () {
    const el = document.getElementById('sync-badge');
    if (!el) return;
    const on = App.sync && App.sync.ready();
    el.className = 'sync-badge ' + (on ? (Store.dirty ? 'dirty' : 'ok') : 'off');
    el.innerHTML = on ? (Store.dirty ? '☁️ 待同步' : '☁️ 已同步') : '💾 本地存储';
    el.title = on ? '点击手动推送到云端' : '点击配置云端同步';
  };

  function renderNav() {
    document.getElementById('nav').innerHTML = NAV.map(n =>
      `<button class="nav-item" data-id="${n.id}"><span class="ni">${n.icon}</span>${n.name}
        <span class="nav-dot" data-dot="${n.id}"></span></button>`).join('');
    UI.$$('.nav-item').forEach(b => b.onclick = () => { App.go(b.dataset.id); document.body.classList.remove('nav-open'); });
  }

  function updateDots() {
    const dot = (id, n) => {
      const el = document.querySelector(`[data-dot="${id}"]`);
      if (el) { el.textContent = n || ''; el.style.display = n ? '' : 'none'; }
    };
    dot('todos', Store.db.todos.filter(t => !t.done).length);
    dot('dictation', Store.pendingRetests().filter(r => r.kind === 'dictation').length);
    dot('recitation', Store.pendingRetests().filter(r => r.kind === 'recitation').length);
    dot('discipline', An.disciplineWarnings(3).length);
    dot('comm', An.followUps().length);
  }

  /* ---------------- 示例数据 ---------------- */
  const XING = '王李张刘陈杨黄赵周吴徐孙马朱胡林郭何高罗郑梁谢宋唐许韩冯邓曹彭'.split('');
  const MING = ['小雨', '思远', '梓涵', '一鸣', '欣怡', '浩然', '子轩', '雨萱', '嘉豪', '诗涵', '明轩', '若曦', '天佑', '梦琪', '文博', '佳怡', '睿泽', '语嫣', '航', '悦', '晨', '琳', '涛', '婷'];

  App.seedDemo = function () {
    Store.reset();
    const cls = Store.classes();
    const used = new Set();
    cls.forEach((c, ci) => {
      for (let i = 1; i <= 22; i++) {
        let name;
        do { name = XING[Math.floor(Math.random() * XING.length)] + MING[Math.floor(Math.random() * MING.length)]; }
        while (used.has(name));
        used.add(name);
        Store.addStudent({
          name, no: String(i), classId: c.id,
          parentName: name[0] + (Math.random() > .5 ? '妈妈' : '爸爸'),
          parentPhone: '13' + String(Math.floor(Math.random() * 900000000) + 100000000),
          tags: Math.random() > .8 ? ['待提升'] : [],
          focus: false
        });
      }
    });

    const scopes = ['Unit 1 单词', 'Unit 2 单词', 'Unit 2 短语', 'Unit 3 单词', 'Unit 3 课文段落'];
    scopes.forEach((sc, k) => {
      cls.forEach(c => {
        ['dictation', 'recitation'].forEach((kind, ki) => {
          if (kind === 'recitation' && k % 2) return;
          const results = {};
          Store.students(c.id).forEach(s => results[s.id] = Math.random() > (0.12 + ki * 0.05) ? 1 : 0);
          Store.saveCheck({ kind, classId: c.id, date: UI.addDays(UI.today(), -(scopes.length - k) * 4 - ki), scope: sc, note: '', results });
        });
      });
    });

    const parts = Store.defaultParts();
    ['开学摸底', '第一次月考', '期中考试'].forEach((name, ei) => {
      const scores = Store.students().map(s => {
        const base = 55 + Math.random() * 55 + ei * 3;
        const ps = parts.map(p => Math.round(Math.min(p.full, p.full * (base / 150) * (0.75 + Math.random() * 0.5)) * 2) / 2);
        return { studentId: s.id, total: Math.round(ps.reduce((a, b) => a + b, 0) * 10) / 10, parts: ps };
      });
      Store.push('exams', {
        name, date: UI.addDays(UI.today(), -60 + ei * 25), scope: '', parts,
        lines: Object.assign({}, Store.db.settings.lines), scores
      }, 'exam');
    });

    const stus = Store.students();
    for (let i = 0; i < 9; i++) {
      const s = stus[Math.floor(Math.random() * stus.length)];
      Store.push('comms', {
        studentId: s.id, date: UI.addDays(UI.today(), -Math.floor(Math.random() * 20)),
        way: ['电话', '微信', '面谈'][i % 3], topic: ['近期听写情况', '月考成绩反馈', '课堂表现', '作业完成度'][i % 4],
        content: '与家长沟通了近期学习状态，家长表示会配合督促背诵与错题订正。',
        needFollow: i % 3 === 0, followDate: UI.addDays(UI.today(), 3), followDone: false
      }, 'comm');
    }
    const dtypes = Store.db.settings.discTypes;
    const bad = stus.slice(0, 6);
    for (let i = 0; i < 11; i++) {
      const s = bad[Math.floor(Math.random() * bad.length)];
      Store.push('discipline', {
        studentId: s.id, date: UI.addDays(UI.today(), -Math.floor(Math.random() * 25)),
        type: dtypes[Math.floor(Math.random() * (dtypes.length - 1))],
        detail: '课堂/作业问题，已口头提醒', handled: Math.random() > .5
      }, 'disc');
    }
    [['备好 Unit4 新课课件', 1, 0], ['整理月考错题本模板', 2, 3], ['交教研组听课记录', 3, 1], ['筛选期中临界生名单', 1, 1], ['给八班后进生排辅导时间', 2, 5]]
      .forEach(([title, q, d]) => Store.push('todos', { title, quadrant: q, due: UI.addDays(UI.today(), d), done: false, createdAt: UI.today() }, 'todo'));

    const tt = {};
    [[1, 1], [1, 3], [2, 2], [2, 5], [3, 1], [3, 4], [4, 2], [4, 6], [5, 1], [5, 3]].forEach(([d, p], i) => {
      tt[d + '-' + p] = { classId: cls[i % 2].id, content: i % 3 === 0 ? '新课' : (i % 3 === 1 ? '听写课' : '讲评课'), room: i % 2 ? '三楼多媒体' : '本班教室' };
    });
    Store.db.timetable = tt;

    stus.slice(0, 4).forEach(s => Store.updateStudent(s.id, { focus: true, tags: ['临界生'] }));
    Store.saveNow();
    UI.toast('已载入示例数据，随便点点看 🎈');
    App.render();
  };

  function firstRunTip() {
    if (Store.db.students.length || LS.getItem('hailey_tip')) return;
    LS.setItem('hailey_tip', '1');
    UI.modal({
      title: '👋 欢迎使用班级管理工作台',
      width: 520,
      okText: '载入示例数据看看',
      cancelText: '我自己来',
      body: `<div class="form">
        <p>这是一个<b>纯前端</b>的单页工作台，数据默认保存在<b>本机浏览器</b>里，不上传任何服务器。</p>
        <ul class="tips">
          <li>先去「班级与学生」把两个班的名单粘贴进来（支持从 Excel 直接复制）</li>
          <li>日常在「听写 / 背诵过关」勾一勾，未过关会自动进二次待办池</li>
          <li>考试后在「成绩分析」录总分与 7 个题型，上线、临界生、强弱项自动算</li>
          <li>需要多设备同步，去「云端同步」接自己的 Supabase</li>
        </ul>
        <p class="hint">不确定怎么用？先载入一份示例数据体验，之后在「云端同步 → 清空本机数据」一键清掉。</p>
      </div>`,
      onOk: () => App.seedDemo()
    });
  }

  /* ---------------- 初始化 ---------------- */
  function init() {
    renderNav();
    App.render();
    updateDots();

    document.addEventListener('store:change', () => { updateDots(); App.updateSyncBadge(); });

    document.getElementById('sync-badge').onclick = () => {
      if (App.sync.ready()) App.sync.push(); else App.go('sync');
    };
    document.getElementById('btn-menu').onclick = () => document.body.classList.toggle('nav-open');
    const navOverlay = document.createElement('div');
    navOverlay.className = 'nav-overlay';
    navOverlay.onclick = () => document.body.classList.remove('nav-open');
    document.body.appendChild(navOverlay);
    document.getElementById('demo-btn').onclick = () => UI.confirmBox(
      '载入示例数据会<b>覆盖</b>当前本机数据，确定吗？', () => App.seedDemo(), { okText: '载入', danger: true });

    document.addEventListener('keydown', e => {
      if (e.target.matches('input,textarea,select')) return;
      const map = { '1': 'dashboard', '2': 'focus', '3': 'students', '4': 'dictation', '5': 'recitation', '6': 'exams', '7': 'comm', '8': 'todos', '9': 'discipline', '0': 'timetable' };
      if (map[e.key]) App.go(map[e.key]);
    });

    App.sync.startAuto();
    firstRunTip();
  }

  document.addEventListener('DOMContentLoaded', init);

  /* Auto-import data from data.json when ?seed=1 is in URL */
  (function() {
    if (new URLSearchParams(location.search).get('seed') !== '1') return;
    if (LS.getItem('hailey_workbench_v1')) {
      var existing = JSON.parse(LS.getItem('hailey_workbench_v1'));
      if (existing.students && existing.students.length > 0) return; // already has data
    }
    fetch('data.json').then(function(r) { return r.json(); }).then(function(db) {
      LS.setItem('hailey_workbench_v1', JSON.stringify(db));
      location.search = '';
    }).catch(function(e) { console.warn('Auto-import failed:', e); });
  })();
})();

</script>
<script>
/* ===========================================================
 * pages/dashboard.js — 📊 总览仪表盘
 * =========================================================== */
(function () {
  const { esc, empty } = UI;

  function greet() {
    const h = new Date().getHours();
    if (h < 6) return '夜深了，早点休息';
    if (h < 11) return '早上好';
    if (h < 14) return '中午好';
    if (h < 18) return '下午好';
    return '晚上好';
  }

  function render(view) {
    const D = Store.db;
    const week = UI.weekRange();
    const courses = App.pages.timetable.todayCourses();
    const todos = An.topTodos(3);
    const openTodos = D.todos.filter(t => !t.done);
    const passAlerts = An.passAlerts(2);
    const pending = Store.pendingRetests();
    const discWarn = An.disciplineWarnings(3);
    const discWeek = D.discipline.filter(d => d.date >= week.start);
    const lastExam = D.exams.slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''))[0];
    const border = lastExam ? An.borderline(lastExam) : [];
    const focusList = Store.students().filter(s => s.focus).map(s => An.studentProfile(s.id))
      .filter(p => p.risks.some(r => r.level !== 'info'))
      .sort((a, b) => b.risks.filter(r => r.level === 'danger').length - a.risks.filter(r => r.level === 'danger').length);
    const follows = An.followUps();
    const weekChecks = An.checks(null, null, week.start, week.end);
    const wAgg = weekChecks.reduce((a, c) => { const r = An.recordRate(c); a.t += r.total; a.p += r.pass; return a; }, { t: 0, p: 0 });

    view.innerHTML = `
      <div class="dash-hero">
        <div>
          <h2>${greet()}，${esc(D.meta.teacher)} 老师 👋</h2>
          <p class="sub">${new Date().toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' })}
            · ${esc(D.meta.gradYear)}届 · ${D.classes.length} 个班 · ${D.students.length} 名学生</p>
        </div>
        <div class="quick">
          <button class="qbtn" data-go="dictation">✏️ 记听写</button>
          <button class="qbtn" data-go="recitation">📖 记背诵</button>
          <button class="qbtn" data-add="todo">＋ 待办</button>
          <button class="qbtn" data-add="comm">📞 沟通</button>
          <button class="qbtn" data-add="disc">⚠️ 违纪</button>
        </div>
      </div>

      <div class="kpi-row five">
        ${kpi('今日课程', courses.length + ' 节', '🗓️', '', 'timetable')}
        ${kpi('未完成待办', openTodos.length + ' 项', '✅', openTodos.filter(t => t.due && t.due < UI.today()).length ? 'warn' : '', 'todos')}
        ${kpi('待补过关', pending.length + ' 项', '🔁', pending.length > 5 ? 'warn' : '', 'dictation')}
        ${kpi('本周过关率', (wAgg.t ? UI.pct(wAgg.p, wAgg.t) : 0) + '%', '📊', '', 'dictation')}
        ${kpi('违纪预警', discWarn.length + ' 人', '🚨', discWarn.length ? 'danger' : '', 'discipline')}
      </div>

      <div class="dash-grid">
        <!-- 今日课程 -->
        <div class="card">
          <div class="card-head"><h3>🗓️ 今日课程</h3><button class="btn xs ghost" data-go="timetable">课表</button></div>
          ${courses.length ? `<div class="list tight">${courses.map(c => `
            <div class="list-item">
              <div><span class="period">第${c.period}节</span>
                <b>${esc(c.classId ? Store.className(c.classId) : '')}</b>
                <span class="muted">${esc(c.content || '')}</span></div>
              ${c.room ? `<span class="muted sm">📍${esc(c.room)}</span>` : ''}
            </div>`).join('')}</div>` : `<p class="hint">今天没有排课 ☕</p>`}
        </div>

        <!-- 待办 TOP3 -->
        <div class="card">
          <div class="card-head"><h3>✅ 待办 TOP3</h3><button class="btn xs ghost" data-go="todos">全部</button></div>
          ${todos.length ? `<div class="list tight">${todos.map(t => `
            <div class="list-item">
              <div><input type="checkbox" data-tdone="${t.id}">
                <span class="dot" style="background:${An.QUAD[t.quadrant].color}"></span>
                ${esc(t.title)}</div>
              ${t.due ? `<span class="badge ${t.due < UI.today() ? 'danger' : ''}">${esc(t.due)}</span>` : ''}
            </div>`).join('')}</div>` : `<p class="hint">待办清空了，厉害 🎉</p>`}
        </div>

        <!-- 过关预警 -->
        <div class="card">
          <div class="card-head"><h3>🔁 过关预警</h3><span class="muted sm">欠账 ≥2 项</span></div>
          ${passAlerts.length ? `<div class="list tight">${passAlerts.slice(0, 6).map(a => `
            <div class="list-item">
              <div><a class="link" data-stu="${a.studentId}"><b>${esc(a.name)}</b></a>
                <span class="muted sm">${esc(Store.className(a.classId))}</span>
                <div class="muted sm ellip">${esc(a.items.map(i => i.scope).join('、'))}</div></div>
              <span class="pill warn">${a.items.length} 项</span>
            </div>`).join('')}</div>` : `<p class="hint">没有欠账学生 👍</p>`}
        </div>

        <!-- 违纪关注 -->
        <div class="card">
          <div class="card-head"><h3>⚠️ 违纪关注</h3><button class="btn xs ghost" data-go="discipline">全部</button></div>
          ${discWarn.length || discWeek.length ? `<div class="list tight">
            ${discWarn.slice(0, 4).map(w => `<div class="list-item">
              <div><a class="link" data-stu="${w.studentId}"><b>${esc(w.name)}</b></a>
                <span class="muted sm">${esc(Store.className(w.classId))}</span></div>
              <span class="pill bad">累计 ${w.count} 次</span></div>`).join('')}
            ${discWeek.slice(0, 3).map(d => `<div class="list-item">
              <div><span class="muted sm">${esc(d.date)}</span> ${esc(Store.studentName(d.studentId))}
                <span class="chip sm">${esc(d.type)}</span></div>
              ${d.handled ? '<span class="pill ok">已处理</span>' : '<span class="pill warn">待处理</span>'}</div>`).join('')}

        </div>

        <!-- 临界生 -->
        <div class="card">
          <div class="card-head"><h3>🔶 临界生</h3>
            <span class="muted sm">${lastExam ? esc(lastExam.name) : '暂无考试'}</span></div>
          ${border.length ? `<div class="list tight">${border.slice(0, 6).map(b => `
            <div class="list-item">
              <div><a class="link" data-stu="${b.studentId}"><b>${esc(b.name)}</b></a>
                <span class="muted sm">${esc(Store.className(b.classId))} · ${b.total}分</span></div>
              <span class="pill ${b.line}">差 ${b.gap} 分上${b.line === 'high' ? '高' : b.line === 'mid' ? '中' : '低'}线</span>

        </div>

        <!-- 重点学生预警 -->
        <div class="card">
          <div class="card-head"><h3>⭐ 重点学生预警</h3><button class="btn xs ghost" data-go="focus">名单</button></div>

              <button class="btn xs" data-stu="${p.student.id}">档案</button>
            </div>`).join('')}</div>` : `<p class="hint">重点学生暂无异常，或名单为空</p>`}
        </div>
      </div>

      ${follows.length ? `<div class="card">
        <div class="card-head"><h3>📞 本周需跟进家长</h3><button class="btn xs ghost" data-go="comm">全部</button></div>
        <div class="chips-row">${follows.slice(0, 8).map(c => {
          const s = Store.student(c.studentId) || {};
          return `<div class="follow-chip"><b>${esc(Store.studentName(c.studentId))}</b>
            <span class="muted sm">${esc(c.followDate || '')}</span>
            ${s.parentPhone ? `<a class="tel" href="tel:${esc(s.parentPhone)}">📞</a>` : ''}</div>`;
        }).join('')}</div></div>` : ''}`;

    bind(view);
  }

  function kpi(label, value, icon, tone, go) {
    return `<div class="kpi ${tone || ''}" ${go ? `data-go="${go}"` : ''}><div class="kpi-ico">${icon}</div>
      <div><div class="kpi-v">${esc(value)}</div><div class="kpi-l">${esc(label)}</div></div></div>`;
  }

  function bind(view) {
    const { $$ } = UI;
    $$('[data-go]', view).forEach(b => b.onclick = () => App.go(b.dataset.go));
    $$('[data-stu]', view).forEach(b => b.onclick = e => { e.stopPropagation(); App.openStudent(b.dataset.stu); });
    $$('[data-tdone]', view).forEach(c => c.onchange = () => {
      Store.patch('todos', c.dataset.tdone, { done: true, doneAt: UI.today() });
      UI.toast('完成一项 🎉'); App.render();
    });
    $$('[data-add]', view).forEach(b => b.onclick = () => {
      const t = b.dataset.add;
      if (t === 'todo') App.pages.todos.edit(null, 1);
      if (t === 'comm') App.pages.comm.edit(null);
      if (t === 'disc') App.pages.discipline.edit(null);
    });
  }

  App.pages.dashboard = { title: '总览仪表盘', render };
})();

</script>
<script>
/* ===========================================================
 * pages/focus.js — ⭐ 重点关注学生 + 学生全维度档案
 * =========================================================== */
(function () {
  const { esc, toast, modal, empty, classOptions } = UI;
  const state = { classId: '', tag: '', cond: '', kw: '', scope: 'focus' };

  const CONDS = [
    { v: '', n: '不限条件' },
    { v: 'retest', n: '有未过关欠账' },
    { v: 'disc', n: '有违纪记录' },
    { v: 'drop', n: '成绩下滑 ≥5 分' },
    { v: 'nocomm', n: '30天未家校沟通' },
    { v: 'border', n: '最近考试临界生' },
    { v: 'lowpass', n: '近30天过关率 <70%' }
  ];

  function pool() {
    let list = Store.students(state.classId);
    if (state.scope === 'focus') list = list.filter(s => s.focus);
    if (state.tag) list = list.filter(s => (s.tags || []).includes(state.tag));
    if (state.kw) list = list.filter(s => s.name.includes(state.kw));
    if (state.cond) {
      const lastExam = Store.db.exams.slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''))[0];
      const bl = lastExam ? An.borderline(lastExam).map(b => b.studentId) : [];
      list = list.filter(s => {
        const p = An.studentProfile(s.id);
        switch (state.cond) {
          case 'retest': return p.pending.length > 0;
          case 'disc': return p.disc.length > 0;
          case 'drop': return p.trend && p.trend.delta <= -5;
          case 'nocomm': return !p.lastComm || p.lastComm.date < UI.addDays(UI.today(), -30);
          case 'border': return bl.includes(s.id);
          case 'lowpass': return p.pass.rate !== null && p.pass.rate < 70 && p.pass.total >= 2;
          default: return true;
        }
      });
    }
    return list;
  }

  function render(view) {
    /* 每次打开页面，自动按最近一次考试更新「全卷及格生 / A卷合格生」标签（无变化不写库） */
    const fs = An.autoFocusLatest ? An.autoFocusLatest() : null;
    const list = pool();
    const profiles = list.map(s => An.studentProfile(s.id));
    const riskN = profiles.filter(p => p.risks.some(r => r.level === 'danger')).length;

    view.innerHTML = `
      <div class="page-head">

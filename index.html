<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hailey · 初中英语班级管理工作台</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<style>
/* ===========================================================
 * app.css — 班级管理工作台
 * =========================================================== */
:root{
  --bg:#f5f6fb; --card:#fff; --line:#e8eaf2; --text:#1f2437; --muted:#8a90a6;
  --pri:#6366f1; --pri-soft:#eef0ff; --ok:#10b981; --warn:#f59e0b; --bad:#ef4444; --info:#0ea5e9;
  --r:14px; --sh:0 1px 2px rgba(23,26,47,.05),0 6px 20px rgba(23,26,47,.06);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;display:flex;background:var(--bg);color:var(--text);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,p{margin:0}
a{color:inherit;text-decoration:none}
.flex1{flex:1}
.nowrap{white-space:nowrap}
.muted{color:var(--muted)}
.sm{font-size:12px}
.tiny{font-size:11px;line-height:1.5}
.good{color:var(--ok)} .bad{color:var(--bad)} .mid{color:var(--warn)}
.strike{text-decoration:line-through;color:var(--muted)}
.ellip{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ellip.wide{max-width:320px}

/* ---------- 侧栏 ---------- */
.sidebar{
  width:224px;flex:0 0 224px;height:100vh;position:sticky;top:0;
  background:linear-gradient(170deg,#2b2f52,#1e2140);color:#e8eaf5;
  display:flex;flex-direction:column;padding:18px 12px;
}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px}
.logo{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.12);display:grid;place-items:center;font-size:20px}
.brand h1{font-size:15px;font-weight:650}
.brand p{font-size:11px;color:#a8adcc}
#nav{display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1}
.nav-item{
  display:flex;align-items:center;gap:9px;padding:9px 11px;border:0;border-radius:10px;cursor:pointer;
  background:transparent;color:#c9cde8;font-size:13.5px;text-align:left;font-family:inherit;transition:.15s;
}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{background:var(--pri);color:#fff;box-shadow:0 6px 16px rgba(99,102,241,.35)}
.ni{width:18px;text-align:center}
.nav-dot{
  margin-left:auto;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:rgba(255,255,255,.16);
  font-size:11px;display:grid;place-items:center;color:#fff;
}
.nav-item.active .nav-dot{background:rgba(0,0,0,.22)}
.side-foot{padding:12px 8px 0;border-top:1px solid rgba(255,255,255,.08);color:#8f95bb}
.mini-btn{width:100%;padding:7px;border-radius:9px;border:1px dashed rgba(255,255,255,.25);background:transparent;color:#c9cde8;cursor:pointer;font-family:inherit;font-size:12px;margin-bottom:8px}
.mini-btn:hover{background:rgba(255,255,255,.08)}

/* ---------- 主区 ---------- */
.main{flex:1;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 24px;background:rgba(245,246,251,.86);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.view{padding:18px 24px 8px;flex:1}
.foot{padding:16px 24px 28px;color:var(--muted);font-size:12px}
.only-mobile{display:none}
.sync-badge{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-size:12.5px;cursor:pointer;font-family:inherit}
.sync-badge.ok{color:var(--ok);border-color:#c7f0e0;background:#f2fdf9}
.sync-badge.dirty{color:var(--warn);border-color:#fbe6bd;background:#fffbf2}
.sync-badge.off{color:var(--muted)}

/* ---------- 通用 ---------- */
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.page-head h2{font-size:20px;font-weight:680}
.page-head .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.head-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh);margin-bottom:16px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-head h3{font-size:14.5px;font-weight:650}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-2>.card{margin-bottom:16px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar.inline{margin:0}
.hint{color:var(--muted);font-size:12.5px;margin-top:8px}
.warn-box{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;padding:10px 12px;border-radius:10px;font-size:13px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.confirm-text{font-size:14px;line-height:1.7}
.inline-lab{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}

/* 按钮 */
.btn{
  border:1px solid var(--line);background:#fff;color:var(--text);border-radius:10px;padding:8px 13px;
  font-size:13px;cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;
}
.btn:hover{border-color:#c9cdf0;background:#fafaff;transform:translateY(-1px)}
.btn.primary{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.primary:hover{background:#5457e5}
.btn.danger{color:var(--bad);border-color:#fbd5d5}
.btn.danger:hover{background:#fff5f5}
.btn.danger.primary,.modal-foot .btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ok{color:var(--ok);border-color:#bbf0dc}
.btn.ghost{background:transparent}
.btn.xs{padding:4px 9px;font-size:12px;border-radius:8px}
.btn.block{width:100%;justify-content:center;margin-bottom:8px}
.icon-btn{border:0;background:transparent;cursor:pointer;color:var(--muted);padding:4px 6px;border-radius:7px;font-size:14px;font-family:inherit}
.icon-btn:hover{background:#f1f2f8;color:var(--text)}
.icon-btn.danger:hover{background:#fff0f0;color:var(--bad)}
.icon-btn.xs{font-size:12px;padding:2px 5px}
.star{border:0;background:transparent;cursor:pointer;font-size:16px;color:#d7dae8;padding:2px}
.star.on{color:#fbbf24}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.seg button{border:0;background:transparent;padding:7px 14px;font-size:13px;cursor:pointer;font-family:inherit;color:var(--muted)}
.seg button.on{background:var(--pri);color:#fff}

/* 表单 */
.inp{
  width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:13.5px;
  font-family:inherit;background:#fff;color:var(--text);outline:none;transition:.15s;
}
.inp:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-soft)}
.inp.xs{padding:4px 8px;font-size:12px;width:auto}
.inp.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.7}
.inp.num{padding:5px 7px;text-align:center;width:74px}
textarea.inp{resize:vertical}
.form{display:flex;flex-direction:column;gap:12px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted)}
.form label>.inp,.form label>select{color:var(--text)}
.form.grid2,.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* Supabase 配置分组：Project URL + 公开密钥 */
.cfg-group{border:1px solid var(--line);border-radius:12px;padding:12px 12px 14px;background:#fbfbff;display:flex;flex-direction:column;gap:11px}
.cfg-group-title{font-size:12px;font-weight:650;color:var(--pri);letter-spacing:.3px}
.cfg-group .form,.cfg-group>.grid2{gap:11px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.span2{grid-column:span 2}
.check,.check-inline{display:flex;flex-direction:row!important;align-items:center;gap:6px;font-size:13px;color:var(--text)!important;cursor:pointer}
.tag-picker{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;background:#f1f2f8;color:#5a6079;border-radius:7px;padding:2px 8px;font-size:11.5px;margin-right:4px}
.chip.sm{font-size:11px;padding:1px 6px}
.chip.pick{cursor:pointer;background:#fff;border:1px solid var(--line);padding:4px 10px;font-size:12.5px}
.chip.pick:has(input:checked){background:var(--pri-soft);border-color:#c3c6ff;color:var(--pri)}
.chip.pick input{margin:0}

/* 表格 */
.table-wrap{overflow:auto;border-radius:10px;border:1px solid var(--line)}
.max200{max-height:200px}.max260{max-height:260px}.max360{max-height:360px}
.max420{max-height:420px}.max480{max-height:480px}
.tbl{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
.tbl th{position:sticky;top:0;background:#fafbff;text-align:left;font-weight:600;color:#6b7189;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
.tbl td{padding:8px 10px;border-bottom:1px solid #f2f3f8;vertical-align:middle}
.tbl tbody tr:hover{background:#fafaff}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl.mini{font-size:12.5px}
.tbl.mini th,.tbl.mini td{padding:6px 8px}
.tbl tr.sum td{background:#fafbff;font-weight:600}
.tbl tr.row-high td{background:#f7fbff}
.cell-bad{color:var(--bad);background:#fff6f6}
.cell-good{color:var(--ok);background:#f4fdf9}
.link{color:var(--pri);cursor:pointer;border-bottom:1px dashed transparent}
.link:hover{border-color:var(--pri)}
.tel{color:var(--info)}
.score-tbl input{width:70px}

/* 徽标 */
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;background:#f1f2f8;color:#5a6079;white-space:nowrap}
.pill.ok{background:#e8faf3;color:#0f9b74}
.pill.warn{background:#fff5e5;color:#b3730a}
.pill.bad{background:#ffeef0;color:#d13c47}
.pill.high{background:#eef0ff;color:var(--pri)}
.pill.mid{background:#e9f6ff;color:#0d80b8}
.pill.low{background:#e8faf3;color:#0f9b74}
.pill.sm{font-size:11px}
.badge{display:inline-block;padding:0 7px;border-radius:6px;background:#f1f2f8;color:#6b7189;font-size:11.5px;margin-left:4px}
.badge.danger{background:#ffeef0;color:#d13c47}
.rate{font-weight:650}
.rate.good{color:var(--ok)}.rate.mid{color:var(--warn)}.rate.bad{color:var(--bad)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
.meter{height:5px;border-radius:3px;background:#eef0f6;overflow:hidden;margin:4px 0}
.meter i{display:block;height:100%;border-radius:3px}

/* KPI */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi-row.five{grid-template-columns:repeat(5,1fr)}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;gap:12px;align-items:center;box-shadow:var(--sh);transition:.15s}
.kpi[data-go]{cursor:pointer}
.kpi[data-go]:hover{transform:translateY(-2px);border-color:#c9cdf0}
.kpi-ico{width:38px;height:38px;border-radius:11px;background:var(--pri-soft);display:grid;place-items:center;font-size:18px;flex:0 0 38px}
.kpi-v{font-size:19px;font-weight:680;line-height:1.25}
.kpi-l{font-size:12px;color:var(--muted)}
.kpi.warn .kpi-ico{background:#fff5e5}
.kpi.danger .kpi-ico{background:#ffeef0}
.kpi.danger .kpi-v{color:var(--bad)}

/* 列表 */
.list{display:flex;flex-direction:column}
.list-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px dashed #eef0f6}
.list-item:last-child{border-bottom:0}
.list.tight .list-item{padding:8px 2px}
.list.log .list-item{font-size:12.5px}
.list-item.done{opacity:.6}
.period{display:inline-block;background:var(--pri-soft);color:var(--pri);border-radius:6px;padding:1px 7px;font-size:11.5px;margin-right:6px}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.empty-ico{font-size:30px;margin-bottom:6px}
.chips-row{display:flex;flex-wrap:wrap;gap:8px}
.follow-chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:#fafbff}

/* 仪表盘 */
.dash-hero{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;
  background:linear-gradient(120deg,#eef0ff,#f6f7ff 55%,#fff);border:1px solid var(--line);
  border-radius:var(--r);padding:18px 20px;margin-bottom:16px;box-shadow:var(--sh)}
.dash-hero h2{font-size:20px;font-weight:680}
.dash-hero .sub{color:var(--muted);font-size:12.5px;margin-top:3px}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.qbtn{border:1px solid #dfe2f5;background:#fff;border-radius:10px;padding:8px 12px;font-size:13px;cursor:pointer;font-family:inherit;transition:.15s}
.qbtn:hover{background:var(--pri);color:#fff;border-color:var(--pri);transform:translateY(-1px)}
.dash-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.dash-grid .card{margin:0}

/* 班级卡 */
.cls-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.cls-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px;min-width:150px;cursor:pointer;box-shadow:var(--sh);transition:.15s}
.cls-card:hover{transform:translateY(-2px)}
.cls-card.active{border-color:var(--pri);background:var(--pri-soft)}
.cls-name{font-weight:650;font-size:14px;display:flex;align-items:center;gap:4px}
.cls-meta{font-size:12px;color:var(--muted);margin-top:2px}
.cls-add{border:1px dashed #cfd3e6;background:transparent;border-radius:12px;padding:12px 16px;color:var(--muted);cursor:pointer;font-family:inherit;font-size:13px}
.cls-add:hover{border-color:var(--pri);color:var(--pri)}

/* 听写录入 */
.stu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;max-height:320px;overflow-y:auto;padding:4px;border:1px solid var(--line);border-radius:10px;background:#fafbff}
.stu-chip{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 6px;cursor:pointer;font-family:inherit;text-align:center;transition:.12s}
.stu-chip .n{display:block;font-size:13px;font-weight:600}
.stu-chip .m{display:block;font-size:11px;color:var(--muted)}
.stu-chip.pass{border-color:#bbf0dc;background:#f3fdf9}
.stu-chip.pass .m{color:var(--ok)}
.stu-chip.fail{border-color:#fbd5d5;background:#fff5f5}
.stu-chip.fail .m{color:var(--bad)}
.stu-sum{background:#fafbff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:10px 0;font-size:13px}

/* 四象限 */
.quad-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.quad{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh);min-height:190px}
.quad-head{display:flex;align-items:center;gap:6px;font-weight:650;font-size:13.5px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.quad-head .icon-btn{margin-left:auto}
.quad-body{display:flex;flex-direction:column;gap:6px}
.quad-empty{color:var(--muted);font-size:12.5px;padding:10px 0}
.todo{display:flex;align-items:flex-start;gap:8px;padding:8px;border-radius:10px;background:#fafbff;border:1px solid transparent}
.todo:hover{border-color:var(--line)}
.todo.overdue{background:#fff7f7}
.todo-main{flex:1}
.todo-t{font-size:13.5px}
.todo-m{margin-top:2px}
.q1{border-top:3px solid var(--bad)}.q2{border-top:3px solid var(--pri)}
.q3{border-top:3px solid var(--warn)}.q4{border-top:3px solid #94a3b8}

/* 课表 */
.timetable td{text-align:center;height:66px;cursor:pointer;transition:.12s;min-width:110px}
.timetable td:hover{background:var(--pri-soft)}
.timetable td.has{background:#fbfcff}
.timetable td.today,.timetable th.today{background:#fffdf3}
.timetable td.today.has{background:#fff8e6}
.p-th{background:#fafbff!important;font-size:12px;color:var(--muted);width:66px}
.tt-cls{font-weight:650;font-size:13px}
.tt-ct{font-size:12px;color:#5a6079}
.tt-room{font-size:11px;color:var(--muted)}
.tt-add{color:#d5d8e8;font-size:16px}
.today-row{display:flex;gap:10px;flex-wrap:wrap}
.course-chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:linear-gradient(120deg,#fff,#fafbff)}
.course-chip b{color:var(--pri)}
.course-chip em{font-style:normal;color:#5a6079;font-size:13px}
.course-chip i{font-style:normal;color:var(--muted);font-size:12px}

/* 图表 */
.chart{width:100%}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart.radar,.chart.donut{max-width:360px;margin:0 auto}
.chart-empty{padding:36px;text-align:center;color:var(--muted);font-size:13px;background:#fafbff;border-radius:10px}
.grid{stroke:#eef0f6;stroke-width:1}
.ax-y{font-size:10px;fill:#a2a8bd;text-anchor:end}
.ax-x{font-size:10.5px;fill:#8a90a6;text-anchor:middle}
.bar-val{font-size:11px;fill:#5a6079;text-anchor:middle;font-weight:600}
.radar-grid{stroke:#e8eaf2;fill:none;stroke-width:1}
.radar-label{font-size:11px;fill:#6b7189}
.donut-v{font-size:22px;font-weight:700;fill:#1f2437;text-anchor:middle}
.donut-l{font-size:11px;fill:#8a90a6;text-anchor:middle}
.chart-legend{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:8px;font-size:12px;color:#6b7189}
.chart-legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
.chart-legend.wrap{max-width:100%}

/* 强弱项 */
.sw-box{background:#fafbff;border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px}
.sw-line{font-size:13px;margin-bottom:4px}

/* 学生档案 */
.profile h4{font-size:13px;color:#6b7189;margin:14px 0 8px}
.pf-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.pf-head h3{font-size:18px}
.pf-actions{display:flex;gap:6px;flex-wrap:wrap}
.pf-risks{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.pf-kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:12px 0;background:#fafbff;border:1px solid var(--line);border-radius:12px;padding:12px}
.pf-kpis div{text-align:center}
.pf-kpis b{display:block;font-size:17px}
.pf-kpis span{font-size:11px;color:var(--muted)}
.timeline{display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.tl-item{padding:6px 8px;background:#fafbff;border-left:3px solid var(--pri);border-radius:6px}
.tl-item.bad{border-color:var(--bad)}
.tl-d{color:var(--muted);margin-right:6px}

/* 导入预览 / 推荐 */
.preview{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fafbff}
.preview-head{font-size:13px;margin-bottom:6px}
.pick-list{display:flex;flex-direction:column;gap:6px;max-height:320px;overflow-y:auto}
.pick-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fafbff;cursor:pointer;font-size:13px}
.part-row{display:flex;gap:8px;margin-bottom:6px}
.tips{margin:8px 0;padding-left:18px;font-size:13px;line-height:1.9;color:#5a6079}
.sql summary{cursor:pointer;font-size:12.5px;color:var(--pri)}
.code{background:#1e2140;color:#d7dbf5;padding:12px;border-radius:10px;font-size:12px;overflow:auto;margin:8px 0}
.sync-state{font-size:12.5px;padding:6px 12px;border-radius:999px;background:#f1f2f8;color:var(--muted)}
.sync-state.ok{background:#f2fdf9;color:var(--ok)}
.sync-state.dirty{background:#fffbf2;color:var(--warn)}

/* 弹窗 */
.modal-mask{position:fixed;inset:0;background:rgba(20,23,44,.42);display:grid;place-items:center;z-index:100;opacity:0;transition:.2s;padding:20px}
.modal-mask.show{opacity:1}
.modal{background:#fff;border-radius:16px;width:100%;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(20,23,44,.28);transform:translateY(8px);transition:.2s}
.modal-mask.show .modal{transform:none}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal-head h3{font-size:15.5px;font-weight:650}
.modal-body{padding:18px;overflow-y:auto}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:#fafbff;border-radius:0 0 16px 16px}
.tabs.sm{display:flex;gap:6px;margin-bottom:6px}
.tabs .tab{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 12px;font-size:12.5px;cursor:pointer;font-family:inherit;color:var(--muted)}
.tabs .tab.active{background:var(--pri);border-color:var(--pri);color:#fff}

/* Toast */
#toast-root{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:#1f2437;color:#fff;padding:9px 18px;border-radius:999px;font-size:13px;opacity:0;transform:translateY(-8px);transition:.25s;box-shadow:0 10px 26px rgba(20,23,44,.25)}
.toast.show{opacity:1;transform:none}
.toast.err{background:var(--bad)}
.toast.warn{background:var(--warn)}

/* 响应式 */
@media(max-width:1180px){
  .dash-grid{grid-template-columns:1fr 1fr}
  .kpi-row.five{grid-template-columns:repeat(3,1fr)}
  .pf-kpis{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:900px){
  .sidebar{position:fixed;left:-232px;z-index:60;transition:.25s}
  body.nav-open .sidebar{left:0;box-shadow:0 0 40px rgba(0,0,0,.3)}
  .only-mobile{display:inline-flex}
  .grid-2,.dash-grid,.quad-grid,.form.grid2,.grid2,.grid3{grid-template-columns:1fr}
  .kpi-row,.kpi-row.five{grid-template-columns:1fr 1fr}
  .span2{grid-column:auto}
  .view{padding:14px}
  body.nav-open .nav-overlay{display:block;position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.4)}
}
.nav-overlay{display:none}

</style>

<aside class="sidebar">
  <div class="brand">
    <div class="logo">📚</div>
    <div>
      <h1>班级管理工作台</h1>
      <p>初中英语 · Hailey</p>

<main class="main">
  <header class="topbar">

<div id="toast-root"></div>

<script>var LS = (function(){
  try {
    var t = '__ls_probe__';
    window.localStorage.setItem(t, t);
    window.localStorage.removeItem(t);
    return window.localStorage;
  } catch (e) {
    var mem = {};
    return {
      getItem: function(k){ return (k in mem) ? mem[k] : null; },
      setItem: function(k, v){ mem[k] = String(v); },
      removeItem: function(k){ delete mem[k]; }
    };
  }
})();

/* ===========================================================
 * store.js — 本地数据层（LS）
 * 所有数据默认只存在本机浏览器，可选推送到 Supabase
 * =========================================================== */
(function () {
  const KEY = 'hailey_workbench_v1';
  const nowISO = () => new Date().toISOString();

  function uid(p) {
    return (p || 'id') + '_' + Date.now().toString(36).slice(-5) + Math.random().toString(36).slice(2, 7);
  }

  const DEFAULT_PARTS = [
    { name: '选择题', full: 100 },
    { name: '听力表格', full: 0 },
    { name: '短文填空', full: 0 },
    { name: '阅读表达', full: 0 },
    { name: '回答问题', full: 0 },
    { name: '作文', full: 0 }
  ];

  function currentTerm() {
    const d = new Date();
    // 9 月之后算新学年
    const y = d.getMonth() + 1 >= 9 ? d.getFullYear() : d.getFullYear() - 1;
    return y + '-' + (y + 1) + ' 学年';
  }

  // 按“中考年份”推导届别：初三在本学年 6 月毕业
  function defaultGradYear() {
    const d = new Date();
    return d.getMonth() + 1 >= 9 ? d.getFullYear() + 1 : d.getFullYear();
  }

  function defaultDB() {
    const gy = defaultGradYear();
    return {
      meta: {
        version: 1,
        teacher: 'Hailey',
        subject: '英语',
        term: currentTerm(),
        gradYear: gy, // 届别（中考年份）
        updatedAt: nowISO()
      },
      classes: [
        { id: 'cls_4', name: '初三四班', grade: '初三', gradYear: gy },
        { id: 'cls_8', name: '初三八班', grade: '初三', gradYear: gy }
      ],
      students: [],   // {id,classId,name,no,parentPhone,parentName,tags[],focus,note}
      checks: [],     // {id,kind:'dictation'|'recitation',classId,date,scope,note,results:{sid:1|0}}
      retests: [],    // {id,studentId,kind,scope,date,srcId,done,doneDate}
      exams: [],      // {id,name,date,scope,parts:[{name,full}],lines:{high,mid,low},scores:[{studentId,total,parts:[]}]}
      comms: [],      // {id,studentId,date,way,topic,content,needFollow,followDate,followDone}
      todos: [],      // {id,title,quadrant:1..4,due,done,source,refId,createdAt}
      discipline: [], // {id,studentId,date,type,detail,handled}
      timetable: {},  // {'1-3': {classId,content,room}}
      settings: {
        parts: DEFAULT_PARTS,
        lines: { high: 130, mid: 110, low: 90 },
        fullScore: 120,
        band: 8,                  // 临界生分差
        periods: 8,               // 每天节次
        days: 5,                  // 周几到周几
        tags: ['临界生', '需家校跟进', '偏科', '待提升', '进步显著', '课堂活跃'],
        discTypes: ['迟到', '作业未交', '上课讲话', '不带课本', '顶撞老师', '违规带手机', '其他'],
        commWays: ['电话', '微信', '面谈', '家访', '家长会'],
        supabase: { url: 'https://wnenjltqmvqemrbrkgub.supabase.co', key: 'sb_publishable_rlq1LndXZ2PRat5AaQVPjw_2wHdljGJ', table: 'workbench', rowId: 'hailey', auto: true, interval: 60 }
      }
    };
  }

  function deepMerge(base, patch) {
    if (Array.isArray(base) || typeof base !== 'object' || base === null) return patch === undefined ? base : patch;
    const out = Object.assign({}, base);
    if (patch && typeof patch === 'object') {
      Object.keys(patch).forEach(k => {
        out[k] = (k in base) ? deepMerge(base[k], patch[k]) : patch[k];
      });
    }
    return out;
  }

  let db;
  try {
    const raw = LS.getItem(KEY);
    db = raw ? deepMerge(defaultDB(), JSON.parse(raw)) : defaultDB();
  } catch (e) {
    console.warn('本地数据解析失败，已重置', e);
    db = defaultDB();
  }

  let timer = null;
  let dirty = false;

  function persist() {
    db.meta.updatedAt = nowISO();
    LS.setItem(KEY, JSON.stringify(db));
    dirty = true;
    document.dispatchEvent(new CustomEvent('store:change'));
  }

  function save() {
    clearTimeout(timer);
    timer = setTimeout(persist, 120);
  }

  const Store = {
    KEY,
    get db() { return db; },
    uid,
    save,
    saveNow: persist,
    get dirty() { return dirty; },
    clearDirty() { dirty = false; },

    setDB(next) {
      db = deepMerge(defaultDB(), next || {});
      LS.setItem(KEY, JSON.stringify(db));
      dirty = false;
      document.dispatchEvent(new CustomEvent('store:change'));
    },

    reset() {
      db = defaultDB();
      persist();
    },

    /* ---------- 查询辅助 ---------- */
    classes() { return db.classes; },
    className(id) { const c = db.classes.find(c => c.id === id); return c ? c.name : '—'; },
    students(classId) {
      const list = classId ? db.students.filter(s => s.classId === classId) : db.students.slice();
      return list.sort((a, b) => (a.classId === b.classId)
        ? (Number(a.no || 999) - Number(b.no || 999) || a.name.localeCompare(b.name, 'zh'))
        : a.classId.localeCompare(b.classId));
    },
    student(id) { return db.students.find(s => s.id === id); },
    studentName(id) { const s = this.student(id); return s ? s.name : '（已删除学生）'; },

    /* ---------- 学生 ---------- */
    addStudent(s) {
      const stu = Object.assign({
        id: uid('stu'), classId: db.classes[0] && db.classes[0].id, name: '', no: '',
        parentPhone: '', parentName: '', tags: [], focus: false, note: ''
      }, s);
      db.students.push(stu);
      save();
      return stu;
    },
    updateStudent(id, patch) {
      const s = this.student(id);
      if (s) { Object.assign(s, patch); save(); }
      return s;
    },
    removeStudent(id) {
      db.students = db.students.filter(s => s.id !== id);
      db.retests = db.retests.filter(r => r.studentId !== id);
      save();
    },

    /* ---------- 听写 / 背诵 ---------- */
    saveCheck(rec) {
      const exist = rec.id && db.checks.find(c => c.id === rec.id);
      let item;
      if (exist) { Object.assign(exist, rec); item = exist; }
      else { item = Object.assign({ id: uid('chk') }, rec); db.checks.push(item); }
      this.syncRetests(item);
      save();
      return item;
    },
    removeCheck(id) {
      db.checks = db.checks.filter(c => c.id !== id);
      db.retests = db.retests.filter(r => r.srcId !== id);
      save();
    },
    // 未过关 -> 二次待办池；过关 -> 自动销项
    syncRetests(rec) {
      Object.keys(rec.results || {}).forEach(sid => {
        const pass = rec.results[sid] === 1;
        const key = r => r.studentId === sid && r.kind === rec.kind && r.scope === rec.scope;
        const found = db.retests.find(r => key(r) && r.srcId === rec.id);
        if (!pass) {
          if (!found) {
            db.retests.push({
              id: uid('rt'), studentId: sid, kind: rec.kind, scope: rec.scope,
              date: rec.date, srcId: rec.id, done: false, doneDate: ''
            });
          } else { found.done = false; found.doneDate = ''; }
        } else {
          if (found) { found.done = true; found.doneDate = rec.date; }
          // 同范围同类型的历史欠账一并销项
          db.retests.filter(r => key(r) && !r.done && r.date <= rec.date).forEach(r => {
            r.done = true; r.doneDate = rec.date;
          });
        }
      });
    },
    pendingRetests(studentId) {
      return db.retests.filter(r => !r.done && (!studentId || r.studentId === studentId));
    },

    /* ---------- 通用增删改 ---------- */
    push(coll, item, prefix) {
      const it = Object.assign({ id: uid(prefix || coll.slice(0, 3)) }, item);
      db[coll].push(it); save(); return it;
    },
    patch(coll, id, patch) {
      const it = db[coll].find(x => x.id === id);
      if (it) { Object.assign(it, patch); save(); }
      return it;
    },
    remove(coll, id) {
      db[coll] = db[coll].filter(x => x.id !== id);
      save();
    },

    /* ---------- 备份 / 换届 ---------- */
    exportJSON() { return JSON.stringify(db, null, 2); },
    importJSON(text) {
      const obj = JSON.parse(text);
      if (!obj || !obj.students) throw new Error('文件格式不正确');
      this.setDB(obj);
    },
    // 换届：保留课表与设置，清空学生与全部记录
    newTerm(opts) {
      const o = Object.assign({ keepTimetable: true, keepSettings: true, gradYear: defaultGradYear(), classNames: [] }, opts);
      const fresh = defaultDB();
      if (o.keepSettings) fresh.settings = JSON.parse(JSON.stringify(db.settings));
      if (o.keepTimetable) fresh.timetable = JSON.parse(JSON.stringify(db.timetable));
      fresh.meta.gradYear = o.gradYear;
      fresh.meta.term = currentTerm();
      if (o.classNames.length) {
        fresh.classes = o.classNames.map((n, i) => ({
          id: 'cls_' + (i + 1) + '_' + o.gradYear, name: n, grade: n.replace(/[^初高一二三年级]/g, '') || '初三', gradYear: o.gradYear
        }));
      } else {
        fresh.classes = db.classes.map(c => ({ id: c.id, name: c.name, grade: c.grade, gradYear: o.gradYear }));
      }
      db = fresh;
      persist();
    },

    defaultParts: () => JSON.parse(JSON.stringify(DEFAULT_PARTS))
  };

  window.Store = Store;
})();
</script>

<script>/* ===========================================================
 * app.js — 路由、侧栏、初始化、示例数据
 * =========================================================== */
window.App = window.App || { pages: {} };

(function () {
  const NAV = [
    { id: 'dashboard', icon: '📊', name: '总览仪表盘' },
    { id: 'focus', icon: '⭐', name: '重点关注学生' },
    { id: 'students', icon: '👥', name: '班级与学生' },
    { id: 'dictation', icon: '✏️', name: '听写过关' },
    { id: 'recitation', icon: '📖', name: '背诵过关' },
    { id: 'exams', icon: '📈', name: '成绩分析' },
    { id: 'comm', icon: '📞', name: '家校沟通' },
    { id: 'todos', icon: '✅', name: '待办四象限' },
    { id: 'discipline', icon: '⚠️', name: '违纪记录' },
    { id: 'timetable', icon: '🗓️', name: '我的课表' },
    { id: 'sync', icon: '☁️', name: '云端同步' }
  ];

  let current = LS.getItem('hailey_page') || 'dashboard';

  App.go = function (id) {
    if (!App.pages[id]) return;
    current = id;
    LS.setItem('hailey_page', id);
    App.render();
    document.querySelector('.main').scrollTo({ top: 0, behavior: 'smooth' });
  };

  App.render = function () {
    const view = document.getElementById('view');
    UI.$$('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.id === current));
    const page = App.pages[current] || App.pages.dashboard;
    view.innerHTML = '';
    page.render(view);
    App.updateSyncBadge();
  };

  App.updateSyncBadge = function () {
    const el = document.getElementById('sync-badge');
    if (!el) return;
    const on = App.sync && App.sync.ready();
    el.className = 'sync-badge ' + (on ? (Store.dirty ? 'dirty' : 'ok') : 'off');
    el.innerHTML = on ? (Store.dirty ? '☁️ 待同步' : '☁️ 已同步') : '💾 本地存储';
    el.title = on ? '点击手动推送到云端' : '点击配置云端同步';
  };

  function renderNav() {
    document.getElementById('nav').innerHTML = NAV.map(n =>
      `<button class="nav-item" data-id="${n.id}"><span class="ni">${n.icon}</span>${n.name}
        <span class="nav-dot" data-dot="${n.id}"></span></button>`).join('');
    UI.$$('.nav-item').forEach(b => b.onclick = () => { App.go(b.dataset.id); document.body.classList.remove('nav-open'); });
  }

  function updateDots() {
    const dot = (id, n) => {
      const el = document.querySelector(`[data-dot="${id}"]`);
      if (el) { el.textContent = n || ''; el.style.display = n ? '' : 'none'; }
    };
    dot('todos', Store.db.todos.filter(t => !t.done).length);
    dot('dictation', Store.pendingRetests().filter(r => r.kind === 'dictation').length);
    dot('recitation', Store.pendingRetests().filter(r => r.kind === 'recitation').length);
    dot('discipline', An.disciplineWarnings(3).length);
    dot('comm', An.followUps().length);
  }

  /* ---------------- 示例数据 ---------------- */
  const XING = '王李张刘陈杨黄赵周吴徐孙马朱胡林郭何高罗郑梁谢宋唐许韩冯邓曹彭'.split('');
  const MING = ['小雨', '思远', '梓涵', '一鸣', '欣怡', '浩然', '子轩', '雨萱', '嘉豪', '诗涵', '明轩', '若曦', '天佑', '梦琪', '文博', '佳怡', '睿泽', '语嫣', '航', '悦', '晨', '琳', '涛', '婷'];

  App.seedDemo = function () {
    Store.reset();
    const cls = Store.classes();
    const used = new Set();
    cls.forEach((c, ci) => {
      for (let i = 1; i <= 22; i++) {
        let name;
        do { name = XING[Math.floor(Math.random() * XING.length)] + MING[Math.floor(Math.random() * MING.length)]; }
        while (used.has(name));
        used.add(name);
        Store.addStudent({
          name, no: String(i), classId: c.id,
          parentName: name[0] + (Math.random() > .5 ? '妈妈' : '爸爸'),
          parentPhone: '13' + String(Math.floor(Math.random() * 900000000) + 100000000),
          tags: Math.random() > .8 ? ['待提升'] : [],
          focus: false
        });
      }
    });

    const scopes = ['Unit 1 单词', 'Unit 2 单词', 'Unit 2 短语', 'Unit 3 单词', 'Unit 3 课文段落'];
    scopes.forEach((sc, k) => {
      cls.forEach(c => {
        ['dictation', 'recitation'].forEach((kind, ki) => {
          if (kind === 'recitation' && k % 2) return;
          const results = {};
          Store.students(c.id).forEach(s => results[s.id] = Math.random() > (0.12 + ki * 0.05) ? 1 : 0);
          Store.saveCheck({ kind, classId: c.id, date: UI.addDays(UI.today(), -(scopes.length - k) * 4 - ki), scope: sc, note: '', results });
        });
      });
    });

    const parts = Store.defaultParts();
    ['开学摸底', '第一次月考', '期中考试'].forEach((name, ei) => {
      const scores = Store.students().map(s => {
        const base = 55 + Math.random() * 55 + ei * 3;
        const ps = parts.map(p => Math.round(Math.min(p.full, p.full * (base / 120) * (0.75 + Math.random() * 0.5)) * 2) / 2);
        return { studentId: s.id, total: Math.round(ps.reduce((a, b) => a + b, 0) * 10) / 10, parts: ps };
      });
      Store.push('exams', {
        name, date: UI.addDays(UI.today(), -60 + ei * 25), scope: '', parts,
        lines: Object.assign({}, Store.db.settings.lines), scores
      }, 'exam');
    });

    const stus = Store.students();
    for (let i = 0; i < 9; i++) {
      const s = stus[Math.floor(Math.random() * stus.length)];
      Store.push('comms', {
        studentId: s.id, date: UI.addDays(UI.today(), -Math.floor(Math.random() * 20)),
        way: ['电话', '微信', '面谈'][i % 3], topic: ['近期听写情况', '月考成绩反馈', '课堂表现', '作业完成度'][i % 4],
        content: '与家长沟通了近期学习状态，家长表示会配合督促背诵与错题订正。',
        needFollow: i % 3 === 0, followDate: UI.addDays(UI.today(), 3), followDone: false
      }, 'comm');
    }
    const dtypes = Store.db.settings.discTypes;
    const bad = stus.slice(0, 6);
    for (let i = 0; i < 11; i++) {
      const s = bad[Math.floor(Math.random() * bad.length)];
      Store.push('discipline', {
        studentId: s.id, date: UI.addDays(UI.today(), -Math.floor(Math.random() * 25)),
        type: dtypes[Math.floor(Math.random() * (dtypes.length - 1))],
        detail: '课堂/作业问题，已口头提醒', handled: Math.random() > .5
      }, 'disc');
    }
    [['备好 Unit4 新课课件', 1, 0], ['整理月考错题本模板', 2, 3], ['交教研组听课记录', 3, 1], ['筛选期中临界生名单', 1, 1], ['给八班后进生排辅导时间', 2, 5]]
      .forEach(([title, q, d]) => Store.push('todos', { title, quadrant: q, due: UI.addDays(UI.today(), d), done: false, createdAt: UI.today() }, 'todo'));

    const tt = {};
    [[1, 1], [1, 3], [2, 2], [2, 5], [3, 1], [3, 4], [4, 2], [4, 6], [5, 1], [5, 3]].forEach(([d, p], i) => {
      tt[d + '-' + p] = { classId: cls[i % 2].id, content: i % 3 === 0 ? '新课' : (i % 3 === 1 ? '听写课' : '讲评课'), room: i % 2 ? '三楼多媒体' : '本班教室' };
    });
    Store.db.timetable = tt;

    stus.slice(0, 4).forEach(s => Store.updateStudent(s.id, { focus: true, tags: ['临界生'] }));
    Store.saveNow();
    UI.toast('已载入示例数据，随便点点看 🎈');
    App.render();
  };

  function firstRunTip() {
    if (Store.db.students.length || LS.getItem('hailey_tip')) return;
    LS.setItem('hailey_tip', '1');
    UI.modal({
      title: '👋 欢迎使用班级管理工作台',
      width: 520,
      okText: '载入示例数据看看',
      cancelText: '我自己来',
      body: `<div class="form">
        <p>这是一个<b>纯前端</b>的单页工作台，数据默认保存在<b>本机浏览器</b>里，不上传任何服务器。</p>
        <ul class="tips">
          <li>先去「班级与学生」把两个班的名单粘贴进来（支持从 Excel 直接复制）</li>
          <li>日常在「听写 / 背诵过关」勾一勾，未过关会自动进二次待办池</li>
          <li>考试后在「成绩分析」录总分与 7 个题型，上线、临界生、强弱项自动算</li>
          <li>需要多设备同步，去「云端同步」接自己的 Supabase</li>
        </ul>
        <p class="hint">不确定怎么用？先载入一份示例数据体验，之后在「云端同步 → 清空本机数据」一键清掉。</p>
      </div>`,
      onOk: () => App.seedDemo()
    });
  }

  /* ---------------- 初始化 ---------------- */
  function init() {
    renderNav();
    App.render();
    updateDots();

    document.addEventListener('store:change', () => { updateDots(); App.updateSyncBadge(); });

    document.getElementById('sync-badge').onclick = () => {
      if (App.sync.ready()) App.sync.push(); else App.go('sync');
    };
    document.getElementById('btn-menu').onclick = () => document.body.classList.toggle('nav-open');
    const navOverlay = document.createElement('div');
    navOverlay.className = 'nav-overlay';
    navOverlay.onclick = () => document.body.classList.remove('nav-open');
    document.body.appendChild(navOverlay);
    document.getElementById('demo-btn').onclick = () => UI.confirmBox(
      '载入示例数据会<b>覆盖</b>当前本机数据，确定吗？', () => App.seedDemo(), { okText: '载入', danger: true });

    document.addEventListener('keydown', e => {
      if (e.target.matches('input,textarea,select')) return;
      const map = { '1': 'dashboard', '2': 'focus', '3': 'students', '4': 'dictation', '5': 'recitation', '6': 'exams', '7': 'comm', '8': 'todos', '9': 'discipline', '0': 'timetable' };
      if (map[e.key]) App.go(map[e.key]);
    });

    App.sync.startAuto();
    firstRunTip();
  }

  document.addEventListener('DOMContentLoaded', init);
})();
</script>

<script>/* ===========================================================
 * pages/students.js — 班级与学生名单
 * =========================================================== */
(function () {
  const { esc, toast, modal, confirmBox, download, classOptions, empty } = UI;
  const state = { classId: '', kw: '', tag: '', onlyFocus: false };

  /* ------------- 批量导入解析 ------------- */
  const PHONE = /^1[3-9]\d{9}$/;
  const NAME = /^[\u4e00-\u9fa5·•]{2,8}$/;

  // 有制表符/逗号等分隔符时按分隔符切；否则按空白切，并把被空格拆开的手机号拼回来
  function splitCells(line) {
    let cells = /[\t,，;；|]/.test(line) ? line.split(/[\t,，;；|]+/) : line.split(/\s+/);
    cells = cells.map(s => s.trim()).filter(s => s !== '');
    return mergePhoneCells(cells);
  }

  function mergePhoneCells(cells) {
    const out = [];
    for (let i = 0; i < cells.length; i++) {
      if (/^\d+$/.test(cells[i])) {
        let j = i, buf = '';
        while (j < cells.length && /^\d+$/.test(cells[j]) && buf.length < 11) { buf += cells[j]; j++; }
        if (buf.length === 11 && /^1[3-9]/.test(buf)) { out.push(buf); i = j - 1; continue; }
      }
      out.push(cells[i]);
    }
    return out;
  }

  function parseRoster(text) {
    const lines = String(text).replace(/\r/g, '').split('\n').map(l => l.trim()).filter(Boolean);
    const rows = [];
    lines.forEach(line => {
      const cells = splitCells(line);
      if (!cells.length) return;
      // 跳过表头
      const joined = cells.join('');
      if (/^(序号)?(姓名|学生|名字)/.test(joined) && /(电话|手机|班级|家长)/.test(joined)) return;

      const item = { name: '', className: '', parentPhone: '', parentName: '', no: '' };
      const rest = [];
      cells.forEach(c => {
        const clean = c.replace(/[\s\-()（）]/g, '');
        if (!item.parentPhone && PHONE.test(clean)) { item.parentPhone = clean; return; }
        if (!item.className && /[一二三四五六七八九十\d]\s*班$/.test(c)) { item.className = c; return; }
        if (!item.no && /^\d{1,3}$/.test(c)) { item.no = c; return; }
        if (/(爸|妈|父|母|家长|监护)/.test(c) && c.length <= 6) { item.parentName = c; return; }
        rest.push(c);
      });
      rest.forEach(c => {
        if (!item.name && NAME.test(c)) item.name = c;
        else if (!item.parentName && NAME.test(c)) item.parentName = c;
        else if (!item.name) item.name = c;
      });
      if (item.name) rows.push(item);
    });
    return rows;
  }

  function ensureClass(name) {
    if (!name) return null;
    const norm = name.replace(/\s/g, '');
    let c = Store.classes().find(c => c.name.replace(/\s/g, '') === norm || c.name.indexOf(norm) >= 0 || norm.indexOf(c.name) >= 0);
    if (c) return c.id;
    c = { id: Store.uid('cls'), name: norm, grade: (norm.match(/^(初|高)[一二三]/) || [''])[0] || '初三', gradYear: Store.db.meta.gradYear };
    Store.db.classes.push(c);
    Store.save();
    return c.id;
  }

  /* ------------- 渲染 ------------- */
  function render(view) {
    const cls = Store.classes();
    const all = Store.students(state.classId || '');
    const list = all.filter(s => {
      if (state.onlyFocus && !s.focus) return false;
      if (state.tag && !(s.tags || []).includes(state.tag)) return false;
      if (state.kw) {
        const k = state.kw.toLowerCase();
        return (s.name || '').toLowerCase().includes(k) || (s.parentPhone || '').includes(k) || (s.no || '').includes(k);
      }
      return true;
    });

    const clsCards = cls.map(c => {
      const n = Store.students(c.id).length;
      const focus = Store.students(c.id).filter(s => s.focus).length;
      return `<div class="cls-card ${state.classId === c.id ? 'active' : ''}" data-cls="${c.id}">
        <div class="cls-name">${esc(c.name)}<button class="icon-btn xs" data-editcls="${c.id}" title="重命名">✎</button></div>
        <div class="cls-meta"><b>${n}</b> 人 · 重点 <b>${focus}</b> 人</div>
      </div>`;
    }).join('');

    const tags = Store.db.settings.tags;

    view.innerHTML = `
      <div class="page-head">
        <div><h2>👥 班级与学生名单</h2>
          <p class="sub">${esc(Store.db.meta.gradYear)} 届 · ${esc(Store.db.meta.term)} · 共 ${Store.db.students.length} 名学生</p></div>
        <div class="head-actions">
          <button class="btn" id="btn-import">📥 批量导入</button>
          <button class="btn" id="btn-export">📤 导出备份</button>
          <button class="btn danger ghost" id="btn-newterm">🔄 换届清空</button>
          <button class="btn primary" id="btn-add">＋ 新增学生</button>
        </div>
      </div>

      <div class="cls-row">
        <div class="cls-card ${!state.classId ? 'active' : ''}" data-cls="">
          <div class="cls-name">全部班级</div>
          <div class="cls-meta"><b>${Store.db.students.length}</b> 人</div>
        </div>
        ${clsCards}
        <button class="cls-add" id="btn-addcls">＋ 新增班级</button>
      </div>

      <div class="card">
        <div class="toolbar">
          <input class="inp" id="f-kw" placeholder="搜索姓名 / 学号 / 家长电话" value="${esc(state.kw)}" style="max-width:240px">
          <select class="inp" id="f-tag" style="max-width:160px">
            <option value="">全部标签</option>
            ${tags.map(t => `<option value="${esc(t)}"${state.tag === t ? ' selected' : ''}>${esc(t)}</option>`).join('')}
          </select>
          <label class="check"><input type="checkbox" id="f-focus" ${state.onlyFocus ? 'checked' : ''}> 只看重点关注</label>
          <span class="flex1"></span>
          <span class="muted">共 ${list.length} 条</span>
        </div>
        ${list.length ? `
        <div class="table-wrap">
          <table class="tbl">
            <thead><tr>
              <th style="width:44px">重点</th><th style="width:64px">学号</th><th>姓名</th><th>班级</th>
              <th>家长</th><th>电话</th><th>标签</th><th>备注</th><th style="width:110px">操作</th>
            </tr></thead>
            <tbody>${list.map(s => `
              <tr>
                <td><button class="star ${s.focus ? 'on' : ''}" data-star="${s.id}" title="设为重点关注">★</button></td>
                <td class="muted">${esc(s.no)}</td>
                <td><a class="link" data-view="${s.id}">${esc(s.name)}</a></td>
                <td>${esc(Store.className(s.classId))}</td>
                <td>${esc(s.parentName)}</td>
                <td>${s.parentPhone ? `<a class="tel" href="tel:${esc(s.parentPhone)}">${esc(s.parentPhone)}</a>` : '<span class="muted">—</span>'}</td>
                <td>${(s.tags || []).map(UI.tagChip).join('') || '<span class="muted">—</span>'}</td>
                <td class="muted ellip" title="${esc(s.note)}">${esc(s.note)}</td>
                <td class="nowrap">
                  <button class="icon-btn" data-edit="${s.id}" title="编辑">✎</button>
                  <button class="icon-btn danger" data-del="${s.id}" title="删除">🗑</button>
                </td>
              </tr>`).join('')}</tbody>
          </table>
        </div>` : empty('还没有学生，点右上角「批量导入」把名单粘贴进来吧', '🧑‍🎓')}
      </div>`;

    bind(view);
  }

  function bind(view) {
    const { $, $$ } = UI;
    $$('[data-cls]', view).forEach(el => el.onclick = e => {
      if (e.target.dataset.editcls) return;
      state.classId = el.dataset.cls; App.render();
    });
    $$('[data-editcls]', view).forEach(b => b.onclick = e => { e.stopPropagation(); editClass(b.dataset.editcls); });
    $('#btn-addcls', view).onclick = () => editClass(null);
    $('#btn-add', view).onclick = () => editStudent(null);
    $('#btn-import', view).onclick = importDialog;
    $('#btn-export', view).onclick = exportDialog;
    $('#btn-newterm', view).onclick = newTermDialog;

    const kw = $('#f-kw', view);
    kw.oninput = () => { state.kw = kw.value; clearTimeout(kw._t); kw._t = setTimeout(() => { App.render(); UI.$('#f-kw').focus(); }, 250); };
    $('#f-tag', view).onchange = e => { state.tag = e.target.value; App.render(); };
    $('#f-focus', view).onchange = e => { state.onlyFocus = e.target.checked; App.render(); };

    $$('[data-star]', view).forEach(b => b.onclick = () => {
      const s = Store.student(b.dataset.star);
      Store.updateStudent(s.id, { focus: !s.focus });
      App.render();
    });
    $$('[data-edit]', view).forEach(b => b.onclick = () => editStudent(b.dataset.edit));
    $$('[data-view]', view).forEach(b => b.onclick = () => App.openStudent(b.dataset.view));
    $$('[data-del]', view).forEach(b => b.onclick = () => {
      const s = Store.student(b.dataset.del);
      confirmBox(`确定删除 <b>${esc(s.name)}</b> 吗？该学生的过关待补项会一并移除（成绩、沟通记录保留）。`,
        () => { Store.removeStudent(s.id); toast('已删除'); App.render(); }, { danger: true, okText: '删除' });
    });
  }

  /* ------------- 班级编辑 ------------- */
  function editClass(id) {
    const c = id ? Store.classes().find(x => x.id === id) : null;
    modal({
      title: c ? '编辑班级' : '新增班级',
      width: 420,
      body: `<div class="form">
        <label>班级名称<input class="inp" id="c-name" value="${esc(c ? c.name : '')}" placeholder="如：初三四班"></label>
        <label>年级<input class="inp" id="c-grade" value="${esc(c ? c.grade : '初三')}"></label>
        ${c ? `<p class="hint">删除班级不会删除学生，请先把学生转班。</p>
        <button class="btn danger ghost" id="c-del">删除该班级</button>` : ''}
      </div>`,
      onOk: (wrap) => {
        const name = UI.$('#c-name', wrap).value.trim();
        if (!name) { toast('请填写班级名称', 'err'); return false; }
        const grade = UI.$('#c-grade', wrap).value.trim() || '初三';
        if (c) { c.name = name; c.grade = grade; }
        else Store.db.classes.push({ id: Store.uid('cls'), name, grade, gradYear: Store.db.meta.gradYear });
        Store.save(); toast('已保存'); App.render();
      }
    });
    if (c) {
      const del = UI.$('#c-del');
      if (del) del.onclick = () => {
        if (Store.students(c.id).length) { toast('该班还有学生，无法删除', 'err'); return; }
        Store.db.classes = Store.classes().filter(x => x.id !== c.id);
        Store.save(); toast('已删除'); UI.$('.modal-mask.show [data-close]').click(); App.render();
      };
    }
  }

  /* ------------- 学生编辑 ------------- */
  function editStudent(id) {
    const s = id ? Store.student(id) : null;
    const tags = Store.db.settings.tags;
    modal({
      title: s ? '编辑学生' : '新增学生',
      width: 520,
      body: `<div class="form grid2">
        <label>姓名<input class="inp" id="s-name" value="${esc(s ? s.name : '')}"></label>
        <label>学号<input class="inp" id="s-no" value="${esc(s ? s.no : '')}"></label>
        <label>班级<select class="inp" id="s-cls">${classOptions(s ? s.classId : (Store.classes()[0] || {}).id)}</select></label>
        <label>家长称呼<input class="inp" id="s-pname" value="${esc(s ? s.parentName : '')}" placeholder="如：王妈妈"></label>
        <label>家长电话<input class="inp" id="s-phone" value="${esc(s ? s.parentPhone : '')}"></label>
        <label class="check-inline"><input type="checkbox" id="s-focus" ${s && s.focus ? 'checked' : ''}> ⭐ 列入重点关注</label>
        <label class="span2">标签
          <div class="tag-picker" id="s-tags">
            ${tags.map(t => `<label class="chip pick"><input type="checkbox" value="${esc(t)}" ${s && (s.tags || []).includes(t) ? 'checked' : ''}>${esc(t)}</label>`).join('')}
          </div>
        </label>
        <label class="span2">备注<textarea class="inp" id="s-note" rows="2">${esc(s ? s.note : '')}</textarea></label>
      </div>`,
      onOk: (wrap) => {
        const name = UI.$('#s-name', wrap).value.trim();
        if (!name) { toast('请填写姓名', 'err'); return false; }
        const data = {
          name, no: UI.$('#s-no', wrap).value.trim(),
          classId: UI.$('#s-cls', wrap).value,
          parentName: UI.$('#s-pname', wrap).value.trim(),
          parentPhone: UI.$('#s-phone', wrap).value.trim(),
          focus: UI.$('#s-focus', wrap).checked,
          tags: UI.$$('#s-tags input:checked', wrap).map(i => i.value),
          note: UI.$('#s-note', wrap).value.trim()
        };
        if (s) Store.updateStudent(s.id, data); else Store.addStudent(data);
        toast('已保存'); App.render();
      }
    });
  }

  /* ------------- 批量导入 ------------- */
  function importDialog() {
    const m = modal({
      title: '📥 批量导入学生名单',
      width: 720,
      okText: '识别并导入',
      body: `<div class="form">
        <div class="tabs sm" id="imp-tabs">
          <button class="tab active" data-t="paste">粘贴文本</button>
          <button class="tab" data-t="file">Excel / CSV 文件</button>
        </div>
        <div id="imp-paste">
          <p class="hint">直接从 Excel 复制整片单元格粘贴即可，系统自动识别<b>姓名、班级、家长电话</b>（还支持学号、家长称呼）。每行一名学生。</p>
          <textarea class="inp mono" id="imp-text" rows="9" placeholder="示例：
1	张小雨	初三四班	王妈妈	13800138000
2	李明	初三八班	13900139000
陈思远 初三四班 13712345678"></textarea>
        </div>
        <div id="imp-file" style="display:none">
          <p class="hint">支持 .csv / .txt 直接读取；.xlsx 需要联网加载解析库（离线时请另存为 CSV）。</p>
          <input type="file" id="imp-input" class="inp" accept=".csv,.txt,.xlsx,.xls">
        </div>
        <label>默认班级（行内未识别到班级时使用）
          <select class="inp" id="imp-cls">${classOptions((Store.classes()[0] || {}).id)}</select>
        </label>
        <label class="check-inline"><input type="checkbox" id="imp-dedup" checked> 同班同名自动跳过（不重复导入）</label>
        <div id="imp-preview"></div>
      </div>`,
      onOk: (wrap) => {
        const rows = parseRoster(UI.$('#imp-text', wrap).value);
        if (!rows.length) { toast('没有识别到可导入的数据', 'err'); return false; }
        doImport(rows, UI.$('#imp-cls', wrap).value, UI.$('#imp-dedup', wrap).checked);
      }
    });

    const wrap = m.el;
    UI.$$('#imp-tabs .tab', wrap).forEach(t => t.onclick = () => {
      UI.$$('#imp-tabs .tab', wrap).forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      UI.$('#imp-paste', wrap).style.display = t.dataset.t === 'paste' ? '' : 'none';
      UI.$('#imp-file', wrap).style.display = t.dataset.t === 'file' ? '' : 'none';
    });

    const ta = UI.$('#imp-text', wrap);
    const preview = () => {
      const rows = parseRoster(ta.value);
      UI.$('#imp-preview', wrap).innerHTML = rows.length ? `
        <div class="preview">
          <div class="preview-head">识别到 <b>${rows.length}</b> 名学生</div>
          <table class="tbl mini"><thead><tr><th>姓名</th><th>班级</th><th>家长</th><th>电话</th></tr></thead>
          <tbody>${rows.slice(0, 8).map(r => `<tr><td>${esc(r.name)}</td><td>${esc(r.className) || '<span class="muted">默认</span>'}</td><td>${esc(r.parentName)}</td><td>${esc(r.parentPhone)}</td></tr>`).join('')}</tbody></table>
          ${rows.length > 8 ? `<div class="muted sm">…… 其余 ${rows.length - 8} 条已识别</div>` : ''}
        </div>` : '';
    };
    ta.oninput = preview;

    UI.$('#imp-input', wrap).onchange = e => {
      const f = e.target.files[0];
      if (!f) return;
      if (/\.xlsx?$/i.test(f.name)) readExcel(f, text => { ta.value = text; preview(); switchToPaste(wrap); });
      else {
        const fr = new FileReader();
        fr.onload = () => { ta.value = String(fr.result).replace(/^\ufeff/, ''); preview(); switchToPaste(wrap); };
        fr.readAsText(f, 'utf-8');
      }
    };
  }

  function switchToPaste(wrap) {
    const t = UI.$('#imp-tabs .tab[data-t="paste"]', wrap);
    if (t) t.click();
    toast('已读取文件，请核对识别结果');
  }

  function readExcel(file, cb) {
    const run = () => {
      const fr = new FileReader();
      fr.onload = () => {
        try {
          const wb = XLSX.read(new Uint8Array(fr.result), { type: 'array' });
          const sheet = wb.Sheets[wb.SheetNames[0]];
          cb(XLSX.utils.sheet_to_csv(sheet));
        } catch (err) { toast('Excel 解析失败：' + err.message, 'err'); }
      };
      fr.readAsArrayBuffer(file);
    };
    if (window.XLSX) return run();
    toast('正在加载 Excel 解析库…');
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    s.onload = run;
    s.onerror = () => toast('无法联网加载解析库，请把文件另存为 CSV 再导入', 'err');
    document.head.appendChild(s);
  }

  function doImport(rows, defaultClass, dedup) {
    let added = 0, skipped = 0;
    rows.forEach(r => {
      const classId = r.className ? ensureClass(r.className) : defaultClass;
      if (dedup && Store.db.students.some(s => s.classId === classId && s.name === r.name)) { skipped++; return; }
      Store.addStudent({
        name: r.name, no: r.no, classId,
        parentName: r.parentName, parentPhone: r.parentPhone
      });
      added++;
    });
    toast(`导入完成：新增 ${added} 人${skipped ? `，跳过重复 ${skipped} 人` : ''}`);
    App.render();
  }

  /* ------------- 导出 / 换届 ------------- */
  function exportDialog() {
    modal({
      title: '📤 导出与备份',
      width: 460,
      hideFooter: true,
      body: `<div class="form">
        <button class="btn block" id="e-json">💾 全量备份（JSON，可再次导入恢复）</button>
        <button class="btn block" id="e-roster">📋 学生名单（CSV）</button>
        <button class="btn block" id="e-phone">📞 家长通讯录（CSV）</button>
        <p class="hint">数据默认只存在本机浏览器，建议每学期导出一次备份；开启云同步后也会存到你自己的 Supabase。</p>
      </div>`
    });
    const stamp = UI.today();
    UI.$('#e-json').onclick = () => { download(`班级工作台备份_${stamp}.json`, Store.exportJSON(), 'application/json'); toast('已导出备份'); };
    UI.$('#e-roster').onclick = () => {
      const rows = [['班级', '学号', '姓名', '家长', '家长电话', '标签', '重点关注', '备注']];
      Store.students().forEach(s => rows.push([Store.className(s.classId), s.no, s.name, s.parentName, s.parentPhone, (s.tags || []).join('/'), s.focus ? '是' : '', s.note]));
      download(`学生名单_${stamp}.csv`, rows.map(r => r.map(csvCell).join(',')).join('\n'), 'text/csv');
      toast('已导出名单');
    };
    UI.$('#e-phone').onclick = () => {
      const rows = [['姓名', '班级', '家长', '电话']];
      Store.students().filter(s => s.parentPhone).forEach(s => rows.push([s.name, Store.className(s.classId), s.parentName, s.parentPhone]));
      download(`家长通讯录_${stamp}.csv`, rows.map(r => r.map(csvCell).join(',')).join('\n'), 'text/csv');
      toast('已导出通讯录');
    };
  }

  function csvCell(v) {
    const s = String(v === undefined || v === null ? '' : v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }

  function newTermDialog() {
    const gy = Store.db.meta.gradYear;
    modal({
      title: '🔄 换届清空',
      width: 520,
      okText: '确认换届',
      body: `<div class="form">
        <p class="warn-box">⚠️ 换届会<b>清空全部学生、听写背诵、成绩、沟通、待办与违纪记录</b>。请先导出备份！</p>
        <label>新届别（中考年份）<input class="inp" id="n-gy" type="number" value="${gy + 1}"></label>
        <label>班级名称（逗号分隔，留空则沿用当前班级名）
          <input class="inp" id="n-cls" placeholder="初三四班,初三八班" value="${esc(Store.classes().map(c => c.name).join(','))}"></label>
        <label class="check-inline"><input type="checkbox" id="n-tt" checked> 保留我的课表</label>
        <label class="check-inline"><input type="checkbox" id="n-set" checked> 保留设置（题型/分数线/标签/云同步）</label>
        <label class="check-inline"><input type="checkbox" id="n-bak" checked> 换届前自动下载一份备份</label>
      </div>`,
      onOk: (wrap) => {
        if (UI.$('#n-bak', wrap).checked) download(`换届前备份_${UI.today()}.json`, Store.exportJSON(), 'application/json');
        const names = UI.$('#n-cls', wrap).value.split(/[,，]/).map(s => s.trim()).filter(Boolean);
        Store.newTerm({
          gradYear: Number(UI.$('#n-gy', wrap).value) || gy + 1,
          classNames: names,
          keepTimetable: UI.$('#n-tt', wrap).checked,
          keepSettings: UI.$('#n-set', wrap).checked
        });
        toast('已完成换届，开始新的一届吧 🎓');
        App.render();
      }
    });
  }

  App.pages.students = { title: '班级与学生名单', render };
  App.parseRoster = parseRoster;
})();
</script>
<script>/* ===========================================================
 * pages/checks.js — 听写过关 / 背诵过关（共用一套逻辑）
 * =========================================================== */
(function () {
  const { esc, toast, modal, confirmBox, empty, classOptions } = UI;
  const META = {
    dictation: { icon: '✏️', title: '听写过关', unit: '听写' },
    recitation: { icon: '📖', title: '背诵过关', unit: '背诵' }
  };
  const state = { dictation: { classId: '', stu: '' }, recitation: { classId: '', stu: '' } };

  function render(view, kind) {
    const m = META[kind], st = state[kind];
    const list = An.checks(kind, st.classId).slice().reverse();
    const pending = Store.pendingRetests().filter(r => r.kind === kind)
      .filter(r => !st.classId || (Store.student(r.studentId) || {}).classId === st.classId);
    const week = UI.weekRange();
    const weekRecs = An.checks(kind, st.classId, week.start, week.end);
    const totalAgg = list.reduce((a, c) => { const r = An.recordRate(c); a.t += r.total; a.p += r.pass; return a; }, { t: 0, p: 0 });

    view.innerHTML = `
      <div class="page-head">
        <div><h2>${m.icon} ${m.title}</h2><p class="sub">按班记录 · 未过关自动进入二次待办池</p></div>
        <div class="head-actions">
          <select class="inp" id="c-cls" style="max-width:160px">${classOptions(st.classId, '全部班级')}</select>
          <button class="btn primary" id="c-add">＋ 新建${m.unit}记录</button>
        </div>
      </div>

      <div class="kpi-row">
        ${kpi('本周记录', weekRecs.length + ' 次', '📅')}
        ${kpi('累计过关率', (totalAgg.t ? UI.pct(totalAgg.p, totalAgg.t) : 0) + '%', '✅')}
        ${kpi('待补过关', pending.length + ' 项', '🔁', pending.length ? 'warn' : '')}
        ${kpi('涉及学生', new Set(pending.map(p => p.studentId)).size + ' 人', '🧑‍🎓')}
      </div>

      <div class="grid-2">
        <div class="card">
          <div class="card-head"><h3>🔁 二次待办池</h3>
            <div><button class="btn xs" id="c-topodo">生成待办</button></div></div>
          ${pending.length ? `<div class="table-wrap max360"><table class="tbl">
            <thead><tr><th>学生</th><th>班级</th><th>范围</th><th>首次未过</th><th style="width:96px">操作</th></tr></thead>
            <tbody>${pending.sort((a, b) => a.date.localeCompare(b.date)).map(r => `
              <tr><td><a class="link" data-stu="${r.studentId}">${esc(Store.studentName(r.studentId))}</a></td>
                  <td>${esc(Store.className((Store.student(r.studentId) || {}).classId))}</td>
                  <td>${esc(r.scope)}</td>
                  <td class="muted">${esc(r.date)}<span class="badge sm ${UI.diffDays(UI.today(), r.date) > 7 ? 'danger' : ''}">${UI.diffDays(UI.today(), r.date)}天</span></td>
                  <td><button class="btn xs ok" data-clear="${r.id}">已补过</button></td></tr>`).join('')}
            </tbody></table></div>` : empty('太棒了，没有欠账 🎉', '✅')}
        </div>

        <div class="card">
          <div class="card-head"><h3>📈 过关率趋势</h3><span class="muted sm">按记录日期</span></div>
          ${trendChart(kind, st.classId)}
        </div>
      </div>

      <div class="card">
        <div class="card-head"><h3>📊 班级 × 范围 过关率</h3></div>
        ${matrixTable(kind)}
      </div>

      <div class="grid-2">
        <div class="card">
          <div class="card-head"><h3>🔍 按学生查询</h3></div>
          <select class="inp" id="c-stu"><option value="">选择学生…</option>${UI.studentOptions(st.stu, st.classId)}</select>
          <div id="c-stu-detail">${st.stu ? studentDetail(st.stu, kind) : `<p class="hint">选择一名学生，查看 TA 的每次${m.unit}结果。</p>`}</div>
        </div>

        <div class="card">
          <div class="card-head"><h3>🗂 记录列表</h3><span class="muted sm">共 ${list.length} 条</span></div>
          ${list.length ? `<div class="table-wrap max420"><table class="tbl">
            <thead><tr><th>日期</th><th>班级</th><th>范围</th><th>过关率</th><th style="width:90px">操作</th></tr></thead>
            <tbody>${list.map(c => {
              const r = An.recordRate(c);
              return `<tr><td>${esc(c.date)}</td><td>${esc(Store.className(c.classId))}</td>
                <td class="ellip" title="${esc(c.scope)}">${esc(c.scope)}</td>
                <td><span class="rate ${r.rate >= 90 ? 'good' : r.rate >= 70 ? 'mid' : 'bad'}">${r.rate}%</span>
                    <span class="muted sm">${r.pass}/${r.total}</span></td>
                <td class="nowrap"><button class="icon-btn" data-edit="${c.id}">✎</button>
                    <button class="icon-btn danger" data-del="${c.id}">🗑</button></td></tr>`;
            }).join('')}</tbody></table></div>` : empty('还没有记录', '📝')}
        </div>
      </div>`;

    bind(view, kind);
  }

  function kpi(label, value, icon, tone) {
    return `<div class="kpi ${tone || ''}"><div class="kpi-ico">${icon}</div>
      <div><div class="kpi-v">${esc(value)}</div><div class="kpi-l">${esc(label)}</div></div></div>`;
  }

  function trendChart(kind, classId) {
    const list = An.checks(kind, classId);
    if (!list.length) return `<div class="chart-empty">暂无数据</div>`;
    const dates = Array.from(new Set(list.map(c => c.date))).sort();
    const series = Store.classes()
      .filter(c => !classId || c.id === classId)
      .map(c => ({
        name: c.name,
        data: dates.map(d => {
          const recs = list.filter(x => x.date === d && x.classId === c.id);
          if (!recs.length) return null;
          const agg = recs.reduce((a, r) => { const s = An.recordRate(r); a.t += s.total; a.p += s.pass; return a; }, { t: 0, p: 0 });
          return agg.t ? UI.pct(agg.p, agg.t) : null;
        })
      })).filter(s => s.data.some(v => v !== null));
    return Charts.line({ labels: dates.map(UI.mdLabel), series, yMax: 100, suffix: '%', height: 230 });
  }

  function matrixTable(kind) {
    const { scopes, map } = An.scopeMatrix(kind);
    if (!scopes.length) return empty('还没有记录', '📊');
    const cls = Store.classes();
    return `<div class="table-wrap max360"><table class="tbl">
      <thead><tr><th>范围</th>${cls.map(c => `<th>${esc(c.name)}</th>`).join('')}<th>合计</th></tr></thead>
      <tbody>${scopes.slice().reverse().map(sc => {
        let t = 0, p = 0;
        const tds = cls.map(c => {
          const v = map[sc][c.id];
          if (!v) return '<td class="muted">—</td>';
          t += v.total; p += v.pass;
          const rate = UI.pct(v.pass, v.total);
          return `<td><span class="rate ${rate >= 90 ? 'good' : rate >= 70 ? 'mid' : 'bad'}">${rate}%</span>
                  <span class="muted sm">${v.pass}/${v.total}</span></td>`;
        }).join('');
        const all = UI.pct(p, t);
        return `<tr><td><b>${esc(sc)}</b></td>${tds}<td>${Charts.meter(all, 100, all >= 90 ? '#10b981' : all >= 70 ? '#f59e0b' : '#ef4444')}<span class="muted sm">${all}%</span></td></tr>`;
      }).join('')}</tbody></table></div>`;
  }

  function studentDetail(sid, kind) {
    const recs = An.checks(kind).filter(c => c.results && c.results[sid] !== undefined).reverse();
    const s = An.studentPass(sid, kind, 3650);
    if (!recs.length) return `<p class="hint">该学生暂无记录。</p>`;
    return `<div class="stu-sum">过关率 <b class="${s.rate >= 90 ? 'good' : s.rate >= 70 ? 'mid' : 'bad'}">${s.rate}%</b>
      　通过 ${s.pass} / ${s.total}　未过 <b class="bad">${s.fail}</b></div>
      <div class="table-wrap max260"><table class="tbl mini">
        <thead><tr><th>日期</th><th>范围</th><th>结果</th></tr></thead>
        <tbody>${recs.map(c => `<tr><td>${esc(c.date)}</td><td>${esc(c.scope)}</td>
          <td>${c.results[sid] === 1 ? '<span class="pill ok">过关</span>' : '<span class="pill bad">未过</span>'}</td></tr>`).join('')}
        </tbody></table></div>`;
  }

  /* ------------- 录入弹窗 ------------- */
  function editRecord(kind, id) {
    const m = META[kind];
    const rec = id ? Store.db.checks.find(c => c.id === id) : null;
    const classId = rec ? rec.classId : (state[kind].classId || (Store.classes()[0] || {}).id);

    const body = () => {
      const students = Store.students(UI.$('#r-cls') ? UI.$('#r-cls').value : classId);
      return students.map(s => {
        const v = rec ? rec.results[s.id] : 1;
        return `<button class="stu-chip ${v === 0 ? 'fail' : 'pass'}" data-sid="${s.id}" data-v="${v === 0 ? 0 : 1}">
          <span class="n">${esc(s.name)}</span><span class="m">${v === 0 ? '未过' : '过关'}</span></button>`;
      }).join('') || '<p class="hint">该班还没有学生，请先去「班级与学生名单」导入。</p>';
    };

    const mm = modal({
      title: `${m.icon} ${rec ? '编辑' : '新建'}${m.unit}记录`,
      width: 720,
      body: `<div class="form">
        <div class="grid3">
          <label>班级<select class="inp" id="r-cls">${classOptions(classId)}</select></label>
          <label>日期<input class="inp" type="date" id="r-date" value="${esc(rec ? rec.date : UI.today())}"></label>
          <label>范围<input class="inp" id="r-scope" value="${esc(rec ? rec.scope : '')}" placeholder="如 Unit 3 单词 / 课文 P42"></label>
        </div>
        <div class="row-between">
          <p class="hint" style="margin:0">默认全部过关，点击学生姓名切换为「未过」。</p>
          <div><button class="btn xs" id="r-allpass">全部过关</button>
               <button class="btn xs danger ghost" id="r-allfail">全部未过</button></div>
        </div>
        <div class="stu-grid" id="r-grid">${body()}</div>
        <label>备注<input class="inp" id="r-note" value="${esc(rec ? rec.note : '')}" placeholder="选填"></label>
      </div>`,
      onOk: (wrap) => {
        const scope = UI.$('#r-scope', wrap).value.trim();
        if (!scope) { toast('请填写听写/背诵范围', 'err'); return false; }
        const results = {};
        UI.$$('.stu-chip', wrap).forEach(b => results[b.dataset.sid] = Number(b.dataset.v));
        if (!Object.keys(results).length) { toast('该班没有学生', 'err'); return false; }
        Store.saveCheck({
          id: rec ? rec.id : undefined, kind,
          classId: UI.$('#r-cls', wrap).value,
          date: UI.$('#r-date', wrap).value || UI.today(),
          scope, note: UI.$('#r-note', wrap).value.trim(), results
        });
        const failN = Object.values(results).filter(v => v === 0).length;
        toast(`已保存${failN ? `，${failN} 人进入二次待办池` : '，全员过关 🎉'}`);
        App.render();
      }
    });

    const wrap = mm.el;
    const bindChips = () => UI.$$('.stu-chip', wrap).forEach(b => b.onclick = () => {
      const v = b.dataset.v === '1' ? 0 : 1;
      b.dataset.v = v;
      b.className = 'stu-chip ' + (v ? 'pass' : 'fail');
      UI.$('.m', b).textContent = v ? '过关' : '未过';
    });
    bindChips();
    UI.$('#r-cls', wrap).onchange = () => { UI.$('#r-grid', wrap).innerHTML = body(); bindChips(); };
    UI.$('#r-allpass', wrap).onclick = () => UI.$$('.stu-chip', wrap).forEach(b => { b.dataset.v = 1; b.className = 'stu-chip pass'; UI.$('.m', b).textContent = '过关'; });
    UI.$('#r-allfail', wrap).onclick = () => UI.$$('.stu-chip', wrap).forEach(b => { b.dataset.v = 0; b.className = 'stu-chip fail'; UI.$('.m', b).textContent = '未过'; });
  }

  function bind(view, kind) {
    const { $, $$ } = UI, st = state[kind];
    $('#c-cls', view).onchange = e => { st.classId = e.target.value; App.render(); };
    $('#c-add', view).onclick = () => editRecord(kind, null);
    $('#c-stu', view).onchange = e => { st.stu = e.target.value; App.render(); };
    $$('[data-edit]', view).forEach(b => b.onclick = () => editRecord(kind, b.dataset.edit));
    $$('[data-stu]', view).forEach(b => b.onclick = () => App.openStudent(b.dataset.stu));
    $$('[data-del]', view).forEach(b => b.onclick = () => confirmBox('删除这条记录？相关的待补项也会移除。',
      () => { Store.removeCheck(b.dataset.del); toast('已删除'); App.render(); }, { danger: true, okText: '删除' }));
    $$('[data-clear]', view).forEach(b => b.onclick = () => {
      Store.patch('retests', b.dataset.clear, { done: true, doneDate: UI.today() });
      toast('已销项 ✅'); App.render();
    });
    $('#c-topodo', view).onclick = () => {
      const pending = Store.pendingRetests().filter(r => r.kind === kind);
      if (!pending.length) { toast('没有待补项'); return; }
      const byScope = {};
      pending.forEach(r => (byScope[r.scope] = byScope[r.scope] || []).push(r));
      let n = 0;
      Object.keys(byScope).forEach(scope => {
        const names = byScope[scope].map(r => Store.studentName(r.studentId)).join('、');
        const title = `${META[kind].unit}补过关：${scope}（${byScope[scope].length}人）${names}`;
        if (Store.db.todos.some(t => !t.done && t.title === title)) return;
        Store.push('todos', { title, quadrant: 1, due: UI.today(), done: false, source: kind, createdAt: UI.today() }, 'todo');
        n++;
      });
      toast(n ? `已生成 ${n} 条待办` : '待办已存在，无需重复生成');
      App.render();
    };
  }

  App.pages.dictation = { title: '听写过关', render: v => render(v, 'dictation') };
  App.pages.recitation = { title: '背诵过关', render: v => render(v, 'recitation') };
})();
</script>
<script>/* ===========================================================
 * pages/exams.js — 成绩分析
 * =========================================================== */
(function () {
  const { esc, toast, modal, confirmBox, empty, classOptions } = UI;
  const state = { examId: '', classId: '', stu: '' };

  function currentExam() {
    const list = Store.db.exams;
    if (!list.length) return null;
    const found = list.find(e => e.id === state.examId);
    return found || list.slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''))[0];
  }

  function render(view) {
    const exams = Store.db.exams.slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    const ex = currentExam();
    if (ex) state.examId = ex.id;
    const st = ex ? An.examStats(ex) : null;

    view.innerHTML = `
      <div class="page-head">
        <div><h2>📈 成绩分析</h2><p class="sub">总分 + 分题型 · 上线统计 · 临界生 · 强弱项</p></div>
        <div class="head-actions">
          ${exams.length ? `<select class="inp" id="x-exam" style="max-width:220px">
            ${exams.map(e => `<option value="${e.id}"${ex && e.id === ex.id ? ' selected' : ''}>${esc(e.name)}（${esc(e.date)}）</option>`).join('')}
          </select>` : ''}
          ${ex ? `<button class="btn" id="x-scores">📝 录入成绩</button>
                  <button class="btn" id="x-edit">⚙️ 考试设置</button>` : ''}
          <button class="btn primary" id="x-new">＋ 新建考试</button>
        </div>
      </div>
      ${!ex ? empty('还没有考试数据，点「新建考试」录入第一次月考吧', '📊') : body(ex, st)}`;

    bind(view, ex, st);
  }

  function body(ex, st) {
    if (!st.all) return `<div class="card">${empty('该考试还没有成绩，点「录入成绩」开始', '📝')}</div>`;
    const lines = st.lines;
    const clsIds = Object.keys(st.byClass);

    /* 上线统计 */
    const lineBars = Charts.bar({
      labels: clsIds.map(id => Store.className(id)).concat(['年级合计']),
      data: clsIds.map(id => st.byClass[id].lineCount.high).concat([st.all.lineCount.high]),
      suffix: ' 人', height: 200
    });

    /* 题型雷达：各班对比 */
    const radar = Charts.radar({
      axes: st.parts.map(p => p.name),
      series: clsIds.map((id, i) => ({ name: Store.className(id), data: st.byClass[id].partRate })),
      max: 100, size: 340
    });

    /* 临界生 */
    const bl = An.borderline(ex, Store.db.settings.band);
    const lineName = { high: '高线', mid: '中线', low: '低线' };

    /* 强弱项（年级） */
    const partRank = st.parts.map((p, i) => ({ name: p.name, rate: st.all.partRate[i], avg: st.all.partAvg[i], full: p.full }))
      .sort((a, b) => a.rate - b.rate);

    /* 总分排名柱状图 */
    const sortedRows = st.rows.slice().sort((a, b) => b.total - a.total);
    const rankChart = scoreRankChart(sortedRows, lines);

    /* 总分分布柱状图 */
    const distChart = scoreDistChart(st.rows, clsIds, lines);

    return `
      <div class="kpi-row">
        ${kpi('参考人数', st.all.count + ' 人', '🧑‍🎓')}
        ${kpi('年级平均', st.all.avg + ' 分', '📊')}
        ${kpi('最高 / 最低', st.all.max + ' / ' + st.all.min, '🏅')}
        ${kpi(`高线(${lines.high})上线`, st.all.lineCount.high + ' 人 · ' + UI.pct(st.all.lineCount.high, st.all.count) + '%', '🎯')}
      </div>

      <div class="card">
        <div class="card-head"><h3>📊 总分分布对比</h3><span class="muted sm">各分数段人数 · 两班对比</span></div>
        ${distChart}
      </div>

      <div class="card">
        <div class="card-head"><h3>🏅 总分排名榜</h3><span class="muted sm">${sortedRows.length} 名学生按总分降序</span></div>
        ${rankChart}
      </div>

      <div class="card">
        <div class="card-head"><h3>🏫 班级对比</h3>
          <span class="muted sm">分数线：高 ${lines.high} / 中 ${lines.mid} / 低 ${lines.low}</span></div>
        <div class="table-wrap"><table class="tbl">
          <thead><tr><th>班级</th><th>人数</th><th>平均分</th><th>最高</th><th>最低</th>
            <th>高线</th><th>中线</th><th>低线</th></tr></thead>
          <tbody>${clsIds.map(id => {
            const g = st.byClass[id];
            return `<tr><td><b>${esc(Store.className(id))}</b></td><td>${g.count}</td>
              <td><b>${g.avg}</b></td><td>${g.max}</td><td>${g.min}</td>
              ${['high', 'mid', 'low'].map(k => `<td>${g.lineCount[k]} 人
                <span class="muted sm">${UI.pct(g.lineCount[k], g.count)}%</span>

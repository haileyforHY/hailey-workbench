        <div><h2>⭐ 重点关注学生</h2><p class="sub">过关 · 成绩 · 违纪 · 家校 全维度追踪</p></div>
        <div class="head-actions">
          <div class="seg">
            <button class="${state.scope === 'focus' ? 'on' : ''}" data-scope="focus">重点名单</button>
            <button class="${state.scope === 'all' ? 'on' : ''}" data-scope="all">全部学生</button>
          </div>
          <button class="btn" id="k-auto">🤖 智能推荐名单</button>
        </div>
      </div>

      <div class="kpi-row">
        ${kpi('名单人数', list.length + ' 人', '⭐')}
        ${kpi('高风险', riskN + ' 人', '🚨', riskN ? 'danger' : '')}
        ${kpi('待补过关', profiles.reduce((a, p) => a + p.pending.length, 0) + ' 项', '🔁')}
        ${kpi('本月违纪', profiles.reduce((a, p) => a + p.disc30.length, 0) + ' 次', '⚠️')}
      </div>

      ${fs ? focusGroups(fs) : ''}

      <div class="card">
        <div class="toolbar">
          <select class="inp" id="k-cls" style="max-width:150px">${classOptions(state.classId, '全部班级')}</select>
          <select class="inp" id="k-tag" style="max-width:150px">
            <option value="">全部标签</option>
            ${Store.db.settings.tags.map(t => `<option value="${esc(t)}"${state.tag === t ? ' selected' : ''}>${esc(t)}</option>`).join('')}
          </select>
          <select class="inp" id="k-cond" style="max-width:190px">
            ${CONDS.map(c => `<option value="${c.v}"${state.cond === c.v ? ' selected' : ''}>${c.n}</option>`).join('')}
          </select>
          <input class="inp" id="k-kw" placeholder="搜索姓名" value="${esc(state.kw)}" style="max-width:160px">
          <span class="flex1"></span>
          <span class="muted">共 ${list.length} 人</span>
        </div>

        ${list.length ? `<div class="table-wrap"><table class="tbl focus-tbl">
          <thead><tr>
            <th style="width:40px"></th><th>学生</th><th>标签</th>
            <th>近30天过关</th><th>待补</th><th>最近成绩</th><th>违纪</th><th>最近沟通</th><th>风险提示</th><th style="width:140px">操作</th>
          </tr></thead>
          <tbody>${profiles.map(p => row(p)).join('')}</tbody></table></div>`
        : empty(state.scope === 'focus' ? '重点名单还是空的，去名单里点 ★ 或用「智能推荐」快速生成' : '没有符合条件的学生', '⭐')}
      </div>`;

    bind(view);
  }

  function row(p) {
    const s = p.student;
    const rate = p.pass.rate;
    const t = p.trend;
    return `<tr>
      <td><button class="star ${s.focus ? 'on' : ''}" data-star="${s.id}">★</button></td>
      <td><a class="link" data-stu="${s.id}"><b>${esc(s.name)}</b></a>
          <div class="muted sm">${esc(Store.className(s.classId))}</div></td>
      <td>${(s.tags || []).map(UI.tagChip).join('') || '<span class="muted">—</span>'}</td>
      <td>${rate === null ? '<span class="muted">无记录</span>' :
        `<span class="rate ${rate >= 90 ? 'good' : rate >= 70 ? 'mid' : 'bad'}">${rate}%</span>
         <div class="muted sm">${p.pass.pass}/${p.pass.total}</div>`}</td>
      <td>${p.pending.length ? `<span class="pill warn">${p.pending.length} 项</span>` : '<span class="muted">—</span>'}</td>
      <td>${p.last ? `<b>${p.last.total}</b> <span class="muted sm">班${p.last.rank}名</span>
        ${t ? `<div class="sm ${t.delta >= 0 ? 'good' : 'bad'}">${t.delta >= 0 ? '↑' : '↓'}${Math.abs(t.delta)}</div>` : ''}`
        : '<span class="muted">—</span>'}</td>
      <td>${p.disc.length ? `<span class="pill ${p.disc.length >= 3 ? 'bad' : 'warn'}">${p.disc.length} 次</span>` : '<span class="muted">—</span>'}</td>
      <td class="muted sm">${p.lastComm ? esc(p.lastComm.date) : '<span class="bad">从未</span>'}</td>
      <td>${p.risks.length ? p.risks.slice(0, 3).map(r => `<span class="pill ${r.level === 'danger' ? 'bad' : r.level === 'warn' ? 'warn' : ''}">${esc(r.text)}</span>`).join(' ') : '<span class="pill ok">状态良好</span>'}</td>
      <td class="nowrap">
        <button class="btn xs" data-stu="${s.id}">档案</button>
        <button class="btn xs" data-comm="${s.id}">沟通</button>
        ${s.parentPhone ? `<a class="btn xs" href="tel:${esc(s.parentPhone)}">📞</a>` : ''}
      </td></tr>`;
  }

  function kpi(label, value, icon, tone) {
    return `<div class="kpi ${tone || ''}"><div class="kpi-ico">${icon}</div>
      <div><div class="kpi-v">${esc(value)}</div><div class="kpi-l">${esc(label)}</div></div></div>`;
  }

  /* ------------- 自动分类模块：全卷及格生 + A卷合格生（按最近一次考试） ------------- */
  function focusGroups(fs) {
    const fp = state.classId ? fs.fullPass.filter(s => s.classId === state.classId) : fs.fullPass;
    const ap = state.classId ? fs.aPass.filter(s => s.classId === state.classId) : fs.aPass;
    const showCls = !state.classId;
    const chip = (s, cls) => `<a class="pill ${cls}" data-stu="${s.studentId}" style="cursor:pointer;text-decoration:none">
      ${esc(s.name)} ${s.total}分${s.aScore !== undefined ? ` · A卷${s.aScore}` : ''}${showCls ? ` · ${esc(Store.className(s.classId).replace(/^初三/, ''))}` : ''}</a>`;
    return `<div class="grid-2">
      <div class="card">
        <div class="card-head"><h3>✅ 全卷及格学生</h3><span class="muted sm">最近考试总分 ≥90分 · ${fp.length} 人</span></div>
        <div style="display:flex;flex-wrap:wrap;gap:8px;padding:6px 0 2px">
          ${fp.length ? fp.map(s => chip(s, 'ok')).join('') : '<span class="muted">暂无学生</span>'}
        </div>
        <p class="hint">💡 每次成绩上传后自动更新，点击姓名可查看学生档案</p>
      </div>
      <div class="card">
        <div class="card-head"><h3>📝 A卷合格关注学生</h3><span class="muted sm">最近考试A卷 50-70分 · ${ap.length} 人</span></div>
        <div style="display:flex;flex-wrap:wrap;gap:8px;padding:6px 0 2px">
          ${ap.length ? ap.map(s => chip(s, 'warn')).join('') : '<span class="muted">暂无学生</span>'}
        </div>
        <p class="hint">💡 每次成绩上传后自动更新，点击姓名可查看学生档案</p>
      </div>
    </div>`;
  }

  function bind(view) {
    const { $, $$ } = UI;
    $$('[data-scope]', view).forEach(b => b.onclick = () => { state.scope = b.dataset.scope; App.render(); });
    $('#k-cls', view).onchange = e => { state.classId = e.target.value; App.render(); };
    $('#k-tag', view).onchange = e => { state.tag = e.target.value; App.render(); };
    $('#k-cond', view).onchange = e => { state.cond = e.target.value; App.render(); };
    const kw = $('#k-kw', view);
    kw.oninput = () => { state.kw = kw.value; clearTimeout(kw._t); kw._t = setTimeout(() => { App.render(); UI.$('#k-kw').focus(); }, 250); };
    $$('[data-star]', view).forEach(b => b.onclick = () => {
      const s = Store.student(b.dataset.star);
      Store.updateStudent(s.id, { focus: !s.focus }); App.render();
    });
    $$('[data-stu]', view).forEach(b => b.onclick = () => openStudent(b.dataset.stu));
    $$('[data-comm]', view).forEach(b => b.onclick = () => App.pages.comm.edit(null, b.dataset.comm));
    $('#k-auto', view).onclick = autoPick;
  }

  /* ------------- 智能推荐 ------------- */
  function autoPick() {
    const cands = Store.students().map(s => An.studentProfile(s.id))
      .map(p => {
        let score = 0;
        if (p.pending.length >= 2) score += 2;
        if (p.pass.rate !== null && p.pass.rate < 70 && p.pass.total >= 2) score += 2;
        if (p.disc.length >= 3) score += 3; else if (p.disc.length) score += 1;
        if (p.trend && p.trend.delta <= -8) score += 3; else if (p.trend && p.trend.delta <= -5) score += 1;
        if (!p.lastComm) score += 1;
        return { p, score };
      }).filter(x => x.score >= 3).sort((a, b) => b.score - a.score);

    if (!cands.length) { toast('暂时没有需要额外关注的学生 👍'); return; }
    modal({
      title: '🤖 智能推荐关注名单',
      width: 560,
      okText: '加入重点关注',
      body: `<div class="form">
        <p class="hint">根据过关欠账、过关率、违纪次数、成绩波动、家校沟通情况综合打分，勾选后加入名单。</p>
        <div class="pick-list">${cands.map(c => `<label class="pick-row">
          <input type="checkbox" value="${c.p.student.id}" checked>
          <b>${esc(c.p.student.name)}</b><span class="muted sm">${esc(Store.className(c.p.student.classId))}</span>
          <span class="flex1"></span>
          <span>${c.p.risks.slice(0, 2).map(r => `<span class="pill ${r.level === 'danger' ? 'bad' : 'warn'}">${esc(r.text)}</span>`).join(' ')}</span>
        </label>`).join('')}</div>
      </div>`,
      onOk: (wrap) => {
        const ids = UI.$$('.pick-list input:checked', wrap).map(i => i.value);
        ids.forEach(id => Store.updateStudent(id, { focus: true }));
        toast(`已加入 ${ids.length} 名学生 ⭐`);
        state.scope = 'focus';
        App.render();
      }
    });
  }

  /* ------------- 学生档案 ------------- */
  function openStudent(id) {
    const p = An.studentProfile(id);
    if (!p) return;
    const s = p.student;
    const exams = An.studentExams(id);
    const trend = exams.length ? Charts.line({
      labels: exams.map(x => x.exam.name),
      series: [{ name: '总分', data: exams.map(x => x.total) },
      { name: '班均', data: exams.map(x => x.classAvg), color: '#94a3b8' }],
      height: 200, suffix: ' 分'
    }) : '<div class="chart-empty">暂无成绩</div>';
    const radar = p.sw ? Charts.radar({
      axes: p.sw.items.map(i => i.name),
      series: [{ name: '本人', data: p.sw.items.map(i => i.rate) },
      { name: '班均', data: p.sw.items.map(i => i.classRate), color: '#94a3b8' }],
      max: 100, size: 300
    }) : '';
    const checks = An.checks(null).filter(c => c.results && c.results[id] !== undefined).slice(-8).reverse();

    modal({
      title: `${esc(s.name)} · 学生档案`,
      width: 900,
      hideFooter: true,
      body: `<div class="profile">
        <div class="pf-head">
          <div><h3>${esc(s.name)} ${s.focus ? '⭐' : ''}</h3>
            <p class="muted">${esc(Store.className(s.classId))}　学号 ${esc(s.no) || '—'}　
              ${s.parentName ? esc(s.parentName) : '家长'}：${s.parentPhone ? `<a class="tel" href="tel:${esc(s.parentPhone)}">${esc(s.parentPhone)}</a>` : '未填'}</p>
            <div>${(s.tags || []).map(UI.tagChip).join('')}</div></div>
          <div class="pf-actions">
            <button class="btn xs" id="pf-focus">${s.focus ? '取消关注' : '⭐ 加入关注'}</button>
            <button class="btn xs" id="pf-comm">📞 记沟通</button>
            <button class="btn xs" id="pf-disc">⚠️ 记违纪</button>
          </div>
        </div>

        ${p.risks.length ? `<div class="pf-risks">${p.risks.map(r =>
          `<span class="pill ${r.level === 'danger' ? 'bad' : r.level === 'warn' ? 'warn' : ''}">${esc(r.text)}</span>`).join('')}</div>` : ''}

        <div class="pf-kpis">
          <div><b>${p.pass.rate === null ? '—' : p.pass.rate + '%'}</b><span>近30天过关率</span></div>
          <div><b>${p.pending.length}</b><span>待补过关</span></div>
          <div><b>${p.last ? p.last.total : '—'}</b><span>最近总分</span></div>
          <div><b>${p.last ? p.last.rank + '/' + p.last.classCount : '—'}</b><span>班级名次</span></div>
          <div><b>${p.disc.length}</b><span>违纪次数</span></div>
          <div><b>${p.comms.length}</b><span>沟通次数</span></div>
        </div>

        <div class="grid-2">
          <div><h4>📈 成绩趋势</h4>${trend}</div>
          <div><h4>🕸 题型雷达</h4>${radar || '<div class="chart-empty">暂无成绩</div>'}</div>
        </div>

        <div class="grid-2">
          <div><h4>✏️ 最近过关</h4>
            ${checks.length ? `<table class="tbl mini"><thead><tr><th>日期</th><th>类型</th><th>范围</th><th>结果</th></tr></thead>
              <tbody>${checks.map(c => `<tr><td>${esc(c.date)}</td><td>${c.kind === 'dictation' ? '听写' : '背诵'}</td>
                <td>${esc(c.scope)}</td><td>${c.results[id] === 1 ? '<span class="pill ok">过</span>' : '<span class="pill bad">未过</span>'}</td></tr>`).join('')}
              </tbody></table>` : '<p class="hint">暂无记录</p>'}
          </div>
          <div><h4>📞 沟通与违纪</h4>
            ${p.comms.length || p.disc.length ? `<div class="timeline">
              ${p.comms.slice(-5).reverse().map(c => `<div class="tl-item"><span class="tl-d">${esc(c.date)}</span>
                <span class="chip">${esc(c.way)}</span> ${esc(c.topic || c.content).slice(0, 40)}</div>`).join('')}
              ${p.disc.slice(-5).reverse().map(d => `<div class="tl-item bad"><span class="tl-d">${esc(d.date)}</span>
                <span class="chip">${esc(d.type)}</span> ${esc(d.detail).slice(0, 40)}</div>`).join('')}
            </div>` : '<p class="hint">暂无记录</p>'}
          </div>
        </div>

        ${p.sw ? `<div class="sw-box">
          <div class="sw-line">✅ 优势：<b class="good">${esc(p.sw.strong.map(i => i.name).join('、'))}</b>
            　⚠️ 薄弱：<b class="bad">${esc(p.sw.weak.map(i => i.name).join('、'))}</b></div>
          <div class="sw-line muted">依据「${esc(p.sw.exam.name)}」分题型得分率与班级平均对比</div></div>` : ''}
      </div>`
    });

    UI.$('#pf-focus').onclick = () => { Store.updateStudent(id, { focus: !s.focus }); toast('已更新'); UI.$$('.modal-mask.show [data-close]')[0].click(); App.render(); };
    UI.$('#pf-comm').onclick = () => { UI.$$('.modal-mask.show [data-close]')[0].click(); App.pages.comm.edit(null, id); };
    UI.$('#pf-disc').onclick = () => { UI.$$('.modal-mask.show [data-close]')[0].click(); App.pages.discipline.edit(null, id); };
  }

  App.pages.focus = { title: '重点关注学生', render };
  App.openStudent = openStudent;
})();

</script>
<script>
/* ===========================================================
 * pages/students.js — 班级与学生名单
 * =========================================================== */
(function () {
  const { esc, toast, modal, confirmBox, download, classOptions, empty } = UI;
  const state = { classId: '', kw: '', tag: '', onlyFocus: false };

  /* ------------- 批量导入解析 ------------- */
  const PHONE = /^1[3-9]\d{9}$/;
  const NAME = /^[\u4e00-\u9fa5·•]{2,8}$/;

  // 有制表符/逗号等分隔符时按分隔符切；否则按空白切，并把被空格拆开的手机号拼回来
  function splitCells(line) {
    let cells = /[\t,，;；|]/.test(line) ? line.split(/[\t,，;；|]+/) : line.split(/\s+/);
    cells = cells.map(s => s.trim()).filter(s => s !== '');
    return mergePhoneCells(cells);
  }

  function mergePhoneCells(cells) {
    const out = [];
    for (let i = 0; i < cells.length; i++) {
      if (/^\d+$/.test(cells[i])) {
        let j = i, buf = '';
        while (j < cells.length && /^\d+$/.test(cells[j]) && buf.length < 11) { buf += cells[j]; j++; }
        if (buf.length === 11 && /^1[3-9]/.test(buf)) { out.push(buf); i = j - 1; continue; }
      }
      out.push(cells[i]);
    }
    return out;
  }

  function parseRoster(text) {
    const lines = String(text).replace(/\r/g, '').split('\n').map(l => l.trim()).filter(Boolean);
    const rows = [];
    lines.forEach(line => {
      const cells = splitCells(line);
      if (!cells.length) return;
      // 跳过表头
      const joined = cells.join('');
      if (/^(序号)?(姓名|学生|名字)/.test(joined) && /(电话|手机|班级|家长)/.test(joined)) return;

      const item = { name: '', className: '', parentPhone: '', parentName: '', no: '' };
      const rest = [];
      cells.forEach(c => {
        const clean = c.replace(/[\s\-()（）]/g, '');
        if (!item.parentPhone && PHONE.test(clean)) { item.parentPhone = clean; return; }
        if (!item.className && /[一二三四五六七八九十\d]\s*班$/.test(c)) { item.className = c; return; }
        if (!item.no && /^\d{1,3}$/.test(c)) { item.no = c; return; }
        if (/(爸|妈|父|母|家长|监护)/.test(c) && c.length <= 6) { item.parentName = c; return; }
        rest.push(c);
      });
      rest.forEach(c => {
        if (!item.name && NAME.test(c)) item.name = c;
        else if (!item.parentName && NAME.test(c)) item.parentName = c;
        else if (!item.name) item.name = c;
      });
      if (item.name) rows.push(item);
    });
    return rows;
  }

  function ensureClass(name) {
    if (!name) return null;
    const norm = name.replace(/\s/g, '');
    let c = Store.classes().find(c => c.name.replace(/\s/g, '') === norm || c.name.indexOf(norm) >= 0 || norm.indexOf(c.name) >= 0);
    if (c) return c.id;
    c = { id: Store.uid('cls'), name: norm, grade: (norm.match(/^(初|高)[一二三]/) || [''])[0] || '初三', gradYear: Store.db.meta.gradYear };
    Store.db.classes.push(c);
    Store.save();
    return c.id;
  }

  /* ------------- 渲染 ------------- */
  function render(view) {
    const cls = Store.classes();
    const all = Store.students(state.classId || '');
    const list = all.filter(s => {
      if (state.onlyFocus && !s.focus) return false;
      if (state.tag && !(s.tags || []).includes(state.tag)) return false;
      if (state.kw) {
        const k = state.kw.toLowerCase();
        return (s.name || '').toLowerCase().includes(k) || (s.parentPhone || '').includes(k) || (s.no || '').includes(k);
      }
      return true;
    });

    const clsCards = cls.map(c => {
      const n = Store.students(c.id).length;
      const focus = Store.students(c.id).filter(s => s.focus).length;
      return `<div class="cls-card ${state.classId === c.id ? 'active' : ''}" data-cls="${c.id}">
        <div class="cls-name">${esc(c.name)}<button class="icon-btn xs" data-editcls="${c.id}" title="重命名">✎</button></div>
        <div class="cls-meta"><b>${n}</b> 人 · 重点 <b>${focus}</b> 人</div>
      </div>`;
    }).join('');

    const tags = Store.db.settings.tags;

    view.innerHTML = `
      <div class="page-head">
        <div><h2>👥 班级与学生名单</h2>
          <p class="sub">${esc(Store.db.meta.gradYear)} 届 · ${esc(Store.db.meta.term)} · 共 ${Store.db.students.length} 名学生</p></div>
        <div class="head-actions">
          <button class="btn" id="btn-import">📥 批量导入</button>
          <button class="btn" id="btn-export">📤 导出备份</button>
          <button class="btn danger ghost" id="btn-newterm">🔄 换届清空</button>
          <button class="btn primary" id="btn-add">＋ 新增学生</button>
        </div>
      </div>

      <div class="cls-row">
        <div class="cls-card ${!state.classId ? 'active' : ''}" data-cls="">
          <div class="cls-name">全部班级</div>
          <div class="cls-meta"><b>${Store.db.students.length}</b> 人</div>
        </div>
        ${clsCards}
        <button class="cls-add" id="btn-addcls">＋ 新增班级</button>
      </div>

      <div class="card">
        <div class="toolbar">
          <input class="inp" id="f-kw" placeholder="搜索姓名 / 学号 / 家长电话" value="${esc(state.kw)}" style="max-width:240px">
          <select class="inp" id="f-tag" style="max-width:160px">
            <option value="">全部标签</option>
            ${tags.map(t => `<option value="${esc(t)}"${state.tag === t ? ' selected' : ''}>${esc(t)}</option>`).join('')}
          </select>
          <label class="check"><input type="checkbox" id="f-focus" ${state.onlyFocus ? 'checked' : ''}> 只看重点关注</label>
          <span class="flex1"></span>
          <span class="muted">共 ${list.length} 条</span>
        </div>
        ${list.length ? `
        <div class="table-wrap">
          <table class="tbl">
            <thead><tr>
              <th style="width:44px">重点</th><th style="width:64px">学号</th><th>姓名</th><th>班级</th>
              <th>家长</th><th>电话</th><th>标签</th><th>备注</th><th style="width:110px">操作</th>
            </tr></thead>
            <tbody>${list.map(s => `
              <tr>
                <td><button class="star ${s.focus ? 'on' : ''}" data-star="${s.id}" title="设为重点关注">★</button></td>
                <td class="muted">${esc(s.no)}</td>
                <td><a class="link" data-view="${s.id}">${esc(s.name)}</a></td>
                <td>${esc(Store.className(s.classId))}</td>
                <td>${esc(s.parentName)}</td>
                <td>${s.parentPhone ? `<a class="tel" href="tel:${esc(s.parentPhone)}">${esc(s.parentPhone)}</a>` : '<span class="muted">—</span>'}</td>
                <td>${(s.tags || []).map(UI.tagChip).join('') || '<span class="muted">—</span>'}</td>
                <td class="muted ellip" title="${esc(s.note)}">${esc(s.note)}</td>
                <td class="nowrap">
                  <button class="icon-btn" data-edit="${s.id}" title="编辑">✎</button>
                  <button class="icon-btn danger" data-del="${s.id}" title="删除">🗑</button>
                </td>
              </tr>`).join('')}</tbody>
          </table>
        </div>` : empty('还没有学生，点右上角「批量导入」把名单粘贴进来吧', '🧑‍🎓')}
      </div>`;

    bind(view);
  }

  function bind(view) {
    const { $, $$ } = UI;
    $$('[data-cls]', view).forEach(el => el.onclick = e => {
      if (e.target.dataset.editcls) return;
      state.classId = el.dataset.cls; App.render();
    });
    $$('[data-editcls]', view).forEach(b => b.onclick = e => { e.stopPropagation(); editClass(b.dataset.editcls); });
    $('#btn-addcls', view).onclick = () => editClass(null);
    $('#btn-add', view).onclick = () => editStudent(null);
    $('#btn-import', view).onclick = importDialog;
    $('#btn-export', view).onclick = exportDialog;
    $('#btn-newterm', view).onclick = newTermDialog;

    const kw = $('#f-kw', view);
    kw.oninput = () => { state.kw = kw.value; clearTimeout(kw._t); kw._t = setTimeout(() => { App.render(); UI.$('#f-kw').focus(); }, 250); };
    $('#f-tag', view).onchange = e => { state.tag = e.target.value; App.render(); };
    $('#f-focus', view).onchange = e => { state.onlyFocus = e.target.checked; App.render(); };

    $$('[data-star]', view).forEach(b => b.onclick = () => {
      const s = Store.student(b.dataset.star);
      Store.updateStudent(s.id, { focus: !s.focus });
      App.render();
    });
    $$('[data-edit]', view).forEach(b => b.onclick = () => editStudent(b.dataset.edit));
    $$('[data-view]', view).forEach(b => b.onclick = () => App.openStudent(b.dataset.view));
    $$('[data-del]', view).forEach(b => b.onclick = () => {
      const s = Store.student(b.dataset.del);
      confirmBox(`确定删除 <b>${esc(s.name)}</b> 吗？该学生的过关待补项会一并移除（成绩、沟通记录保留）。`,
        () => { Store.removeStudent(s.id); toast('已删除'); App.render(); }, { danger: true, okText: '删除' });
    });
  }

  /* ------------- 班级编辑 ------------- */
  function editClass(id) {
    const c = id ? Store.classes().find(x => x.id === id) : null;
    modal({
      title: c ? '编辑班级' : '新增班级',
      width: 420,
      body: `<div class="form">
        <label>班级名称<input class="inp" id="c-name" value="${esc(c ? c.name : '')}" placeholder="如：初三四班"></label>
        <label>年级<input class="inp" id="c-grade" value="${esc(c ? c.grade : '初三')}"></label>
        ${c ? `<p class="hint">删除班级不会删除学生，请先把学生转班。</p>
        <button class="btn danger ghost" id="c-del">删除该班级</button>` : ''}
      </div>`,
      onOk: (wrap) => {
        const name = UI.$('#c-name', wrap).value.trim();
        if (!name) { toast('请填写班级名称', 'err'); return false; }
        const grade = UI.$('#c-grade', wrap).value.trim() || '初三';
        if (c) { c.name = name; c.grade = grade; }
        else Store.db.classes.push({ id: Store.uid('cls'), name, grade, gradYear: Store.db.meta.gradYear });
        Store.save(); toast('已保存'); App.render();
      }
    });
    if (c) {
      const del = UI.$('#c-del');
      if (del) del.onclick = () => {
        if (Store.students(c.id).length) { toast('该班还有学生，无法删除', 'err'); return; }
        Store.db.classes = Store.classes().filter(x => x.id !== c.id);
        Store.save(); toast('已删除'); UI.$('.modal-mask.show [data-close]').click(); App.render();
      };
    }
  }

  /* ------------- 学生编辑 ------------- */
  function editStudent(id) {
    const s = id ? Store.student(id) : null;
    const tags = Store.db.settings.tags;
    modal({
      title: s ? '编辑学生' : '新增学生',
      width: 520,
      body: `<div class="form grid2">
        <label>姓名<input class="inp" id="s-name" value="${esc(s ? s.name : '')}"></label>
        <label>学号<input class="inp" id="s-no" value="${esc(s ? s.no : '')}"></label>
        <label>班级<select class="inp" id="s-cls">${classOptions(s ? s.classId : (Store.classes()[0] || {}).id)}</select></label>
        <label>家长称呼<input class="inp" id="s-pname" value="${esc(s ? s.parentName : '')}" placeholder="如：王妈妈"></label>
        <label>家长电话<input class="inp" id="s-phone" value="${esc(s ? s.parentPhone : '')}"></label>
        <label class="check-inline"><input type="checkbox" id="s-focus" ${s && s.focus ? 'checked' : ''}> ⭐ 列入重点关注</label>
        <label class="span2">标签
          <div class="tag-picker" id="s-tags">
            ${tags.map(t => `<label class="chip pick"><input type="checkbox" value="${esc(t)}" ${s && (s.tags || []).includes(t) ? 'checked' : ''}>${esc(t)}</label>`).join('')}
          </div>
        </label>
        <label class="span2">备注<textarea class="inp" id="s-note" rows="2">${esc(s ? s.note : '')}</textarea></label>
      </div>`,
      onOk: (wrap) => {
        const name = UI.$('#s-name', wrap).value.trim();
        if (!name) { toast('请填写姓名', 'err'); return false; }
        const data = {
          name, no: UI.$('#s-no', wrap).value.trim(),
          classId: UI.$('#s-cls', wrap).value,
          parentName: UI.$('#s-pname', wrap).value.trim(),
          parentPhone: UI.$('#s-phone', wrap).value.trim(),
          focus: UI.$('#s-focus', wrap).checked,
          tags: UI.$$('#s-tags input:checked', wrap).map(i => i.value),
          note: UI.$('#s-note', wrap).value.trim()
        };
        if (s) Store.updateStudent(s.id, data); else Store.addStudent(data);
        toast('已保存'); App.render();
      }
    });
  }

  /* ------------- 批量导入 ------------- */
  function importDialog() {
    const m = modal({
      title: '📥 批量导入学生名单',
      width: 720,
      okText: '识别并导入',
      body: `<div class="form">
        <div class="tabs sm" id="imp-tabs">
          <button class="tab active" data-t="paste">粘贴文本</button>
          <button class="tab" data-t="file">Excel / CSV 文件</button>
        </div>
        <div id="imp-paste">
          <p class="hint">直接从 Excel 复制整片单元格粘贴即可，系统自动识别<b>姓名、班级、家长电话</b>（还支持学号、家长称呼）。每行一名学生。</p>
          <textarea class="inp mono" id="imp-text" rows="9" placeholder="示例：
1	张小雨	初三四班	王妈妈	13800138000
2	李明	初三八班	13900139000
陈思远 初三四班 13712345678"></textarea>
        </div>
        <div id="imp-file" style="display:none">
          <p class="hint">支持 .csv / .txt 直接读取；.xlsx 需要联网加载解析库（离线时请另存为 CSV）。</p>
          <input type="file" id="imp-input" class="inp" accept=".csv,.txt,.xlsx,.xls">
        </div>
        <label>默认班级（行内未识别到班级时使用）
          <select class="inp" id="imp-cls">${classOptions((Store.classes()[0] || {}).id)}</select>
        </label>
        <label class="check-inline"><input type="checkbox" id="imp-dedup" checked> 同班同名自动跳过（不重复导入）</label>
        <div id="imp-preview"></div>
      </div>`,
      onOk: (wrap) => {
        const rows = parseRoster(UI.$('#imp-text', wrap).value);
        if (!rows.length) { toast('没有识别到可导入的数据', 'err'); return false; }
        doImport(rows, UI.$('#imp-cls', wrap).value, UI.$('#imp-dedup', wrap).checked);
      }
    });

    const wrap = m.el;
    UI.$$('#imp-tabs .tab', wrap).forEach(t => t.onclick = () => {
      UI.$$('#imp-tabs .tab', wrap).forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      UI.$('#imp-paste', wrap).style.display = t.dataset.t === 'paste' ? '' : 'none';
      UI.$('#imp-file', wrap).style.display = t.dataset.t === 'file' ? '' : 'none';
    });

    const ta = UI.$('#imp-text', wrap);
    const preview = () => {
      const rows = parseRoster(ta.value);
      UI.$('#imp-preview', wrap).innerHTML = rows.length ? `
        <div class="preview">
          <div class="preview-head">识别到 <b>${rows.length}</b> 名学生</div>
          <table class="tbl mini"><thead><tr><th>姓名</th><th>班级</th><th>家长</th><th>电话</th></tr></thead>
          <tbody>${rows.slice(0, 8).map(r => `<tr><td>${esc(r.name)}</td><td>${esc(r.className) || '<span class="muted">默认</span>'}</td><td>${esc(r.parentName)}</td><td>${esc(r.parentPhone)}</td></tr>`).join('')}</tbody></table>
          ${rows.length > 8 ? `<div class="muted sm">…… 其余 ${rows.length - 8} 条已识别</div>` : ''}
        </div>` : '';
    };
    ta.oninput = preview;

    UI.$('#imp-input', wrap).onchange = e => {
      const f = e.target.files[0];
      if (!f) return;
      if (/\.xlsx?$/i.test(f.name)) readExcel(f, text => { ta.value = text; preview(); switchToPaste(wrap); });
      else {
        const fr = new FileReader();
        fr.onload = () => { ta.value = String(fr.result).replace(/^\ufeff/, ''); preview(); switchToPaste(wrap); };
        fr.readAsText(f, 'utf-8');
      }
    };
  }

  function switchToPaste(wrap) {
    const t = UI.$('#imp-tabs .tab[data-t="paste"]', wrap);
    if (t) t.click();
    toast('已读取文件，请核对识别结果');
  }

  function readExcel(file, cb) {
    const run = () => {
      const fr = new FileReader();
      fr.onload = () => {
        try {
          const wb = XLSX.read(new Uint8Array(fr.result), { type: 'array' });
          const sheet = wb.Sheets[wb.SheetNames[0]];
          cb(XLSX.utils.sheet_to_csv(sheet));
        } catch (err) { toast('Excel 解析失败：' + err.message, 'err'); }
      };
      fr.readAsArrayBuffer(file);
    };
    if (window.XLSX) return run();
    toast('正在加载 Excel 解析库…');
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    s.onload = run;
    s.onerror = () => toast('无法联网加载解析库，请把文件另存为 CSV 再导入', 'err');
    document.head.appendChild(s);
  }

  function doImport(rows, defaultClass, dedup) {
    let added = 0, skipped = 0;
    rows.forEach(r => {
      const classId = r.className ? ensureClass(r.className) : defaultClass;
      if (dedup && Store.db.students.some(s => s.classId === classId && s.name === r.name)) { skipped++; return; }
      Store.addStudent({
        name: r.name, no: r.no, classId,
        parentName: r.parentName, parentPhone: r.parentPhone
      });
      added++;
    });
    toast(`导入完成：新增 ${added} 人${skipped ? `，跳过重复 ${skipped} 人` : ''}`);
    App.render();
  }

  /* ------------- 导出 / 换届 ------------- */
  function exportDialog() {
    modal({
      title: '📤 导出与备份',
      width: 460,
      hideFooter: true,
      body: `<div class="form">
        <button class="btn block" id="e-json">💾 全量备份（JSON，可再次导入恢复）</button>
        <button class="btn block" id="e-roster">📋 学生名单（CSV）</button>
        <button class="btn block" id="e-phone">📞 家长通讯录（CSV）</button>
        <p class="hint">数据默认只存在本机浏览器，建议每学期导出一次备份；开启云同步后也会存到你自己的 Supabase。</p>
      </div>`
    });
    const stamp = UI.today();
    UI.$('#e-json').onclick = () => { download(`班级工作台备份_${stamp}.json`, Store.exportJSON(), 'application/json'); toast('已导出备份'); };
    UI.$('#e-roster').onclick = () => {
      const rows = [['班级', '学号', '姓名', '家长', '家长电话', '标签', '重点关注', '备注']];
      Store.students().forEach(s => rows.push([Store.className(s.classId), s.no, s.name, s.parentName, s.parentPhone, (s.tags || []).join('/'), s.focus ? '是' : '', s.note]));
      download(`学生名单_${stamp}.csv`, rows.map(r => r.map(csvCell).join(',')).join('\n'), 'text/csv');
      toast('已导出名单');
    };
    UI.$('#e-phone').onclick = () => {
      const rows = [['姓名', '班级', '家长', '电话']];
      Store.students().filter(s => s.parentPhone).forEach(s => rows.push([s.name, Store.className(s.classId), s.parentName, s.parentPhone]));
      download(`家长通讯录_${stamp}.csv`, rows.map(r => r.map(csvCell).join(',')).join('\n'), 'text/csv');
      toast('已导出通讯录');
    };
  }

  function csvCell(v) {
    const s = String(v === undefined || v === null ? '' : v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }

  function newTermDialog() {
    const gy = Store.db.meta.gradYear;
    modal({
      title: '🔄 换届清空',
      width: 520,
      okText: '确认换届',
      body: `<div class="form">
        <p class="warn-box">⚠️ 换届会<b>清空全部学生、听写背诵、成绩、沟通、待办与违纪记录</b>。请先导出备份！</p>
        <label>新届别（中考年份）<input class="inp" id="n-gy" type="number" value="${gy + 1}"></label>
        <label>班级名称（逗号分隔，留空则沿用当前班级名）
          <input class="inp" id="n-cls" placeholder="初三四班,初三八班" value="${esc(Store.classes().map(c => c.name).join(','))}"></label>
        <label class="check-inline"><input type="checkbox" id="n-tt" checked> 保留我的课表</label>
        <label class="check-inline"><input type="checkbox" id="n-set" checked> 保留设置（题型/分数线/标签/云同步）</label>
        <label class="check-inline"><input type="checkbox" id="n-bak" checked> 换届前自动下载一份备份</label>
      </div>`,
      onOk: (wrap) => {
        if (UI.$('#n-bak', wrap).checked) download(`换届前备份_${UI.today()}.json`, Store.exportJSON(), 'application/json');
        const names = UI.$('#n-cls', wrap).value.split(/[,，]/).map(s => s.trim()).filter(Boolean);
        Store.newTerm({
          gradYear: Number(UI.$('#n-gy', wrap).value) || gy + 1,
          classNames: names,
          keepTimetable: UI.$('#n-tt', wrap).checked,
          keepSettings: UI.$('#n-set', wrap).checked
        });
        toast('已完成换届，开始新的一届吧 🎓');
        App.render();
      }
    });
  }

  App.pages.students = { title: '班级与学生名单', render };
  App.parseRoster = parseRoster;
})();

</script>
<script>
/* ===========================================================
 * pages/checks.js — 听写过关 / 背诵过关（共用一套逻辑）
 * =========================================================== */
(function () {
  const { esc, toast, modal, confirmBox, empty, classOptions } = UI;
  const META = {
    dictation: { icon: '✏️', title: '听写过关', unit: '听写' },
    recitation: { icon: '📖', title: '背诵过关', unit: '背诵' }
  };
  const state = { dictation: { classId: '', stu: '' }, recitation: { classId: '', stu: '' } };

  function render(view, kind) {
    const m = META[kind], st = state[kind];
    const list = An.checks(kind, st.classId).slice().reverse();
    const pending = Store.pendingRetests().filter(r => r.kind === kind)
      .filter(r => !st.classId || (Store.student(r.studentId) || {}).classId === st.classId);
    const week = UI.weekRange();
    const weekRecs = An.checks(kind, st.classId, week.start, week.end);
    const totalAgg = list.reduce((a, c) => { const r = An.recordRate(c); a.t += r.total; a.p += r.pass; return a; }, { t: 0, p: 0 });

    view.innerHTML = `
      <div class="page-head">
        <div><h2>${m.icon} ${m.title}</h2><p class="sub">按班记录 · 未过关自动进入二次待办池</p></div>
        <div class="head-actions">
          <select class="inp" id="c-cls" style="max-width:160px">${classOptions(st.classId, '全部班级')}</select>
          <button class="btn primary" id="c-add">＋ 新建${m.unit}记录</button>
        </div>
      </div>

      <div class="kpi-row">
        ${kpi('本周记录', weekRecs.length + ' 次', '📅')}
        ${kpi('累计过关率', (totalAgg.t ? UI.pct(totalAgg.p, totalAgg.t) : 0) + '%', '✅')}
        ${kpi('待补过关', pending.length + ' 项', '🔁', pending.length ? 'warn' : '')}
        ${kpi('涉及学生', new Set(pending.map(p => p.studentId)).size + ' 人', '🧑‍🎓')}
      </div>

      <div class="grid-2">
        <div class="card">
          <div class="card-head"><h3>🔁 二次待办池</h3>
            <div><button class="btn xs" id="c-topodo">生成待办</button></div></div>
          ${pending.length ? `<div class="table-wrap max360"><table class="tbl">
            <thead><tr><th>学生</th><th>班级</th><th>范围</th><th>首次未过</th><th style="width:96px">操作</th></tr></thead>
            <tbody>${pending.sort((a, b) => a.date.localeCompare(b.date)).map(r => `
              <tr><td><a class="link" data-stu="${r.studentId}">${esc(Store.studentName(r.studentId))}</a></td>
                  <td>${esc(Store.className((Store.student(r.studentId) || {}).classId))}</td>
                  <td>${esc(r.scope)}</td>
                  <td class="muted">${esc(r.date)}<span class="badge sm ${UI.diffDays(UI.today(), r.date) > 7 ? 'danger' : ''}">${UI.diffDays(UI.today(), r.date)}天</span></td>
                  <td><button class="btn xs ok" data-clear="${r.id}">已补过</button></td></tr>`).join('')}
            </tbody></table></div>` : empty('太棒了，没有欠账 🎉', '✅')}
        </div>

        <div class="card">
          <div class="card-head"><h3>📈 过关率趋势</h3><span class="muted sm">按记录日期</span></div>
          ${trendChart(kind, st.classId)}
        </div>
      </div>

      <div class="card">
        <div class="card-head"><h3>📊 班级 × 范围 过关率</h3></div>
        ${matrixTable(kind)}
      </div>

      <div class="grid-2">
        <div class="card">
          <div class="card-head"><h3>🔍 按学生查询</h3></div>
          <select class="inp" id="c-stu"><option value="">选择学生…</option>${UI.studentOptions(st.stu, st.classId)}</select>
          <div id="c-stu-detail">${st.stu ? studentDetail(st.stu, kind) : `<p class="hint">选择一名学生，查看 TA 的每次${m.unit}结果。</p>`}</div>
        </div>

        <div class="card">
          <div class="card-head"><h3>🗂 记录列表</h3><span class="muted sm">共 ${list.length} 条</span></div>
          ${list.length ? `<div class="table-wrap max420"><table class="tbl">
            <thead><tr><th>日期</th><th>班级</th><th>范围</th><th>过关率</th><th style="width:90px">操作</th></tr></thead>
            <tbody>${list.map(c => {
              const r = An.recordRate(c);
              return `<tr><td>${esc(c.date)}</td><td>${esc(Store.className(c.classId))}</td>
                <td class="ellip" title="${esc(c.scope)}">${esc(c.scope)}</td>
                <td><span class="rate ${r.rate >= 90 ? 'good' : r.rate >= 70 ? 'mid' : 'bad'}">${r.rate}%</span>
                    <span class="muted sm">${r.pass}/${r.total}</span></td>
                <td class="nowrap"><button class="icon-btn" data-edit="${c.id}">✎</button>
                    <button class="icon-btn danger" data-del="${c.id}">🗑</button></td></tr>`;
            }).join('')}</tbody></table></div>` : empty('还没有记录', '📝')}
        </div>
      </div>`;

    bind(view, kind);
  }

  function kpi(label, value, icon, tone) {
    return `<div class="kpi ${tone || ''}"><div class="kpi-ico">${icon}</div>
      <div><div class="kpi-v">${esc(value)}</div><div class="kpi-l">${esc(label)}</div></div></div>`;
  }

  function trendChart(kind, classId) {
    const list = An.checks(kind, classId);
    if (!list.length) return `<div class="chart-empty">暂无数据</div>`;
    const dates = Array.from(new Set(list.map(c => c.date))).sort();
    const series = Store.classes()
      .filter(c => !classId || c.id === classId)
      .map(c => ({
        name: c.name,
        data: dates.map(d => {
          const recs = list.filter(x => x.date === d && x.classId === c.id);
          if (!recs.length) return null;
          const agg = recs.reduce((a, r) => { const s = An.recordRate(r); a.t += s.total; a.p += s.pass; return a; }, { t: 0, p: 0 });
          return agg.t ? UI.pct(agg.p, agg.t) : null;
        })
      })).filter(s => s.data.some(v => v !== null));
    return Charts.line({ labels: dates.map(UI.mdLabel), series, yMax: 100, suffix: '%', height: 230 });
  }

  function matrixTable(kind) {
    const { scopes, map } = An.scopeMatrix(kind);
    if (!scopes.length) return empty('还没有记录', '📊');
    const cls = Store.classes();
    return `<div class="table-wrap max360"><table class="tbl">
      <thead><tr><th>范围</th>${cls.map(c => `<th>${esc(c.name)}</th>`).join('')}<th>合计</th></tr></thead>
      <tbody>${scopes.slice().reverse().map(sc => {
        let t = 0, p = 0;
        const tds = cls.map(c => {
          const v = map[sc][c.id];
          if (!v) return '<td class="muted">—</td>';
          t += v.total; p += v.pass;
          const rate = UI.pct(v.pass, v.total);
          return `<td><span class="rate ${rate >= 90 ? 'good' : rate >= 70 ? 'mid' : 'bad'}">${rate}%</span>
                  <span class="muted sm">${v.pass}/${v.total}</span></td>`;
        }).join('');
        const all = UI.pct(p, t);
        return `<tr><td><b>${esc(sc)}</b></td>${tds}<td>${Charts.meter(all, 100, all >= 90 ? '#10b981' : all >= 70 ? '#f59e0b' : '#ef4444')}<span class="muted sm">${all}%</span></td></tr>`;
      }).join('')}</tbody></table></div>`;
  }

  function studentDetail(sid, kind) {
    const recs = An.checks(kind).filter(c => c.results && c.results[sid] !== undefined).reverse();
    const s = An.studentPass(sid, kind, 3650);
    if (!recs.length) return `<p class="hint">该学生暂无记录。</p>`;
    return `<div class="stu-sum">过关率 <b class="${s.rate >= 90 ? 'good' : s.rate >= 70 ? 'mid' : 'bad'}">${s.rate}%</b>
      　通过 ${s.pass} / ${s.total}　未过 <b class="bad">${s.fail}</b></div>
      <div class="table-wrap max260"><table class="tbl mini">
        <thead><tr><th>日期</th><th>范围</th><th>结果</th></tr></thead>
        <tbody>${recs.map(c => `<tr><td>${esc(c.date)}</td><td>${esc(c.scope)}</td>
          <td>${c.results[sid] === 1 ? '<span class="pill ok">过关</span>' : '<span class="pill bad">未过</span>'}</td></tr>`).join('')}
        </tbody></table></div>`;
  }

  /* ------------- 录入弹窗 ------------- */
  function editRecord(kind, id) {
    const m = META[kind];
    const rec = id ? Store.db.checks.find(c => c.id === id) : null;
    const classId = rec ? rec.classId : (state[kind].classId || (Store.classes()[0] || {}).id);

    const body = () => {
      const students = Store.students(UI.$('#r-cls') ? UI.$('#r-cls').value : classId);
      return students.map(s => {
        const v = rec ? rec.results[s.id] : 1;
        return `<button class="stu-chip ${v === 0 ? 'fail' : 'pass'}" data-sid="${s.id}" data-v="${v === 0 ? 0 : 1}">
          <span class="n">${esc(s.name)}</span><span class="m">${v === 0 ? '未过' : '过关'}</span></button>`;
      }).join('') || '<p class="hint">该班还没有学生，请先去「班级与学生名单」导入。</p>';
    };

    const mm = modal({
      title: `${m.icon} ${rec ? '编辑' : '新建'}${m.unit}记录`,
      width: 720,
      body: `<div class="form">
        <div class="grid3">
          <label>班级<select class="inp" id="r-cls">${classOptions(classId)}</select></label>
          <label>日期<input class="inp" type="date" id="r-date" value="${esc(rec ? rec.date : UI.today())}"></label>
          <label>范围<input class="inp" id="r-scope" value="${esc(rec ? rec.scope : '')}" placeholder="如 Unit 3 单词 / 课文 P42"></label>
        </div>
        <div class="row-between">
          <p class="hint" style="margin:0">默认全部过关，点击学生姓名切换为「未过」。</p>
          <div><button class="btn xs" id="r-allpass">全部过关</button>
               <button class="btn xs danger ghost" id="r-allfail">全部未过</button></div>
        </div>
        <div class="stu-grid" id="r-grid">${body()}</div>
        <label>备注<input class="inp" id="r-note" value="${esc(rec ? rec.note : '')}" placeholder="选填"></label>
      </div>`,
      onOk: (wrap) => {
        const scope = UI.$('#r-scope', wrap).value.trim();
        if (!scope) { toast('请填写听写/背诵范围', 'err'); return false; }
        const results = {};
        UI.$$('.stu-chip', wrap).forEach(b => results[b.dataset.sid] = Number(b.dataset.v));
        if (!Object.keys(results).length) { toast('该班没有学生', 'err'); return false; }
        Store.saveCheck({
          id: rec ? rec.id : undefined, kind,
          classId: UI.$('#r-cls', wrap).value,
          date: UI.$('#r-date', wrap).value || UI.today(),
          scope, note: UI.$('#r-note', wrap).value.trim(), results
        });
        const failN = Object.values(results).filter(v => v === 0).length;
        toast(`已保存${failN ? `，${failN} 人进入二次待办池` : '，全员过关 🎉'}`);
        App.render();
      }
    });

    const wrap = mm.el;
    const bindChips = () => UI.$$('.stu-chip', wrap).forEach(b => b.onclick = () => {
      const v = b.dataset.v === '1' ? 0 : 1;
      b.dataset.v = v;
      b.className = 'stu-chip ' + (v ? 'pass' : 'fail');
      UI.$('.m', b).textContent = v ? '过关' : '未过';
    });
    bindChips();
    UI.$('#r-cls', wrap).onchange = () => { UI.$('#r-grid', wrap).innerHTML = body(); bindChips(); };
    UI.$('#r-allpass', wrap).onclick = () => UI.$$('.stu-chip', wrap).forEach(b => { b.dataset.v = 1; b.className = 'stu-chip pass'; UI.$('.m', b).textContent = '过关'; });
    UI.$('#r-allfail', wrap).onclick = () => UI.$$('.stu-chip', wrap).forEach(b => { b.dataset.v = 0; b.className = 'stu-chip fail'; UI.$('.m', b).textContent = '未过'; });
  }

  function bind(view, kind) {
    const { $, $$ } = UI, st = state[kind];
    $('#c-cls', view).onchange = e => { st.classId = e.target.value; App.render(); };
    $('#c-add', view).onclick = () => editRecord(kind, null);
    $('#c-stu', view).onchange = e => { st.stu = e.target.value; App.render(); };
    $$('[data-edit]', view).forEach(b => b.onclick = () => editRecord(kind, b.dataset.edit));
    $$('[data-stu]', view).forEach(b => b.onclick = () => App.openStudent(b.dataset.stu));
    $$('[data-del]', view).forEach(b => b.onclick = () => confirmBox('删除这条记录？相关的待补项也会移除。',
      () => { Store.removeCheck(b.dataset.del); toast('已删除'); App.render(); }, { danger: true, okText: '删除' }));
    $$('[data-clear]', view).forEach(b => b.onclick = () => {
      Store.patch('retests', b.dataset.clear, { done: true, doneDate: UI.today() });
      toast('已销项 ✅'); App.render();
    });
    $('#c-topodo', view).onclick = () => {
      const pending = Store.pendingRetests().filter(r => r.kind === kind);
      if (!pending.length) { toast('没有待补项'); return; }
      const byScope = {};
      pending.forEach(r => (byScope[r.scope] = byScope[r.scope] || []).push(r));
      let n = 0;
      Object.keys(byScope).forEach(scope => {
        const names = byScope[scope].map(r => Store.studentName(r.studentId)).join('、');
        const title = `${META[kind].unit}补过关：${scope}（${byScope[scope].length}人）${names}`;
        if (Store.db.todos.some(t => !t.done && t.title === title)) return;
        Store.push('todos', { title, quadrant: 1, due: UI.today(), done: false, source: kind, createdAt: UI.today() }, 'todo');
        n++;
      });
      toast(n ? `已生成 ${n} 条待办` : '待办已存在，无需重复生成');
      App.render();
    };
  }

  App.pages.dictation = { title: '听写过关', render: v => render(v, 'dictation') };
  App.pages.recitation = { title: '背诵过关', render: v => render(v, 'recitation') };
})();

</script>
<script>
/* ===========================================================
 * pages/exams.js — 成绩分析
 * =========================================================== */
(function () {
  const { esc, toast, modal, confirmBox, empty, classOptions } = UI;
  const state = { examId: '', classId: '', stu: '' };

  function currentExam() {
    const list = Store.db.exams;
    if (!list.length) return null;
    const found = list.find(e => e.id === state.examId);
    return found || list.slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''))[0];
  }

  function render(view) {
    const exams = Store.db.exams.slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    const ex = currentExam();
    if (ex) state.examId = ex.id;
    const st = ex ? An.examStats(ex) : null;

    view.innerHTML = `
      <div class="page-head">
        <div><h2>📈 成绩分析</h2><p class="sub">总分 + 分题型 · 上线统计 · 临界生 · 强弱项</p></div>
        <div class="head-actions">
          ${exams.length ? `<select class="inp" id="x-exam" style="max-width:220px">
            ${exams.map(e => `<option value="${e.id}"${ex && e.id === ex.id ? ' selected' : ''}>${esc(e.name)}（${esc(e.date)}）</option>`).join('')}
          </select>` : ''}
          ${ex ? `<select class="inp" id="x-filtercls" style="max-width:140px">
            ${classOptions(state.classId, '全部班级')}
          </select>` : ''}
          ${ex ? `<button class="btn" id="x-scores">📝 录入成绩</button>
                  <button class="btn" id="x-edit">⚙️ 考试设置</button>` : ''}
          <button class="btn primary" id="x-new">＋ 新建考试</button>
        </div>
      </div>
      ${!ex ? empty('还没有考试数据，点「新建考试」录入第一次月考吧', '📊') : body(ex, st)}`;

    bind(view, ex, st);
  }

  function body(ex, st) {
    if (!st.all) return `<div class="card">${empty('该考试还没有成绩，点「录入成绩」开始', '📝')}</div>`;
    const lines = st.lines;
    const clsIds = Object.keys(st.byClass);
    const cid = state.classId;
    const isClassMode = !!cid;

    /* 当前数据源：选了班就用该班统计，否则用全年级 */
    const scope = isClassMode ? st.byClass[cid] : st.all;
    if (!scope) return `<div class="card">${empty('该班级暂无成绩数据', '📋')}</div>`;
    const scopeRows = isClassMode ? st.rows.filter(r => r.classId === cid) : st.rows;
    const scopeName = isClassMode ? Store.className(cid) : '年级';

    /* 上线统计 */
    const lineBars = isClassMode
      ? Charts.bar({
          labels: ['高线', '中线', '低线'],
          data: ['high', 'mid', 'low'].map(k => scope.lineCount[k]),
          colors: ['#6366f1', '#0ea5e9', '#10b981'],
          suffix: ' 人', height: 200
        })
      : Charts.bar({
          labels: clsIds.map(id => Store.className(id)).concat(['年级合计']),
          data: clsIds.map(id => st.byClass[id].lineCount.high).concat([st.all.lineCount.high]),
          suffix: ' 人', height: 200
        });

    /* 题型雷达 */
    const radar = isClassMode
      ? Charts.radar({
          axes: st.parts.map(p => p.name),
          series: [
            { name: scopeName + '平均', data: scope.partRate },
            { name: '年级平均', data: st.all.partRate, color: '#94a3b8' }
          ],
          max: 100, size: 340
        })
      : Charts.radar({
          axes: st.parts.map(p => p.name),
          series: clsIds.map((id, i) => ({ name: Store.className(id), data: st.byClass[id].partRate })),
          max: 100, size: 340
        });

    /* 临界生 */
    const blAll = An.borderline(ex, Store.db.settings.band);
    const bl = isClassMode ? blAll.filter(b => b.classId === cid) : blAll;
    const lineName = { high: '高线', mid: '中线', low: '低线' };

    /* 强弱项 */
    const partRank = st.parts.map((p, i) => ({ name: p.name, rate: scope.partRate[i], avg: scope.partAvg[i], full: p.full }))
      .sort((a, b) => a.rate - b.rate);

    /* 总分排名柱状图 */
    const sortedRows = scopeRows.slice().sort((a, b) => b.total - a.total);
    const rankChart = scoreRankChart(sortedRows, lines, isClassMode ? cid : null);

    /* 总分分布柱状图 */
    const distChart = isClassMode
      ? scoreDistChartSingle(scopeRows, lines, cid)
      : scoreDistChart(st.rows, clsIds, lines);

    return `
      <div class="line-bar" id="x-lines">
        <span class="line-bar-label">📐 分数线：</span>
        <label class="line-tag high"><span>高线</span><input class="inp" type="number" id="x-lh" value="${lines.high}" style="width:64px"></label>
        <label class="line-tag mid"><span>中线</span><input class="inp" type="number" id="x-lm" value="${lines.mid}" style="width:64px"></label>
        <label class="line-tag low"><span>低线</span><input class="inp" type="number" id="x-ll" value="${lines.low}" style="width:64px"></label>
        <button class="btn xs primary" id="x-lsave">保存</button>
      </div>
      <div class="kpi-row">
        ${kpi('参考人数', scope.count + ' 人', '🧑‍🎓')}
        ${kpi(isClassMode ? '班级平均' : '年级平均', scope.avg + ' 分', '📊')}
        ${kpi('高线上线', scope.lineCount.high + ' 人 · ' + UI.pct(scope.lineCount.high, scope.count) + '%', '🎯', 'good')}
        ${kpi('低线上线', scope.lineCount.low + ' 人 · ' + UI.pct(scope.lineCount.low, scope.count) + '%', '✅', 'ok')}
      </div>

      <div class="card">
        <div class="card-head"><h3>📊 总分分布</h3><span class="muted sm">${isClassMode ? esc(scopeName) + ' · 各分数段人数' : '各分数段人数 · 两班对比'}</span></div>
        ${distChart}
      </div>

      <div class="card">
        <div class="card-head"><h3>🏅 总分排名榜</h3><span class="muted sm">${sortedRows.length} 名学生按总分降序</span></div>
        ${rankChart}
      </div>

      ${isClassMode ? '' : `
      <div class="card">
        <div class="card-head"><h3>🏫 班级对比</h3>
          <span class="muted sm">分数线：高 ${lines.high} / 中 ${lines.mid} / 低 ${lines.low}</span></div>
        <div class="table-wrap"><table class="tbl">
          <thead><tr><th>班级</th><th>人数</th><th>平均分</th><th>最高</th><th>最低</th>
            <th>高线</th><th>中线</th><th>低线</th></tr></thead>
          <tbody>${clsIds.map(id => {
            const g = st.byClass[id];
            return `<tr><td><b>${esc(Store.className(id))}</b></td><td>${g.count}</td>
              <td><b>${g.avg}</b></td><td>${g.max}</td><td>${g.min}</td>
              ${['high', 'mid', 'low'].map(k => `<td>${g.lineCount[k]} 人
                <span class="muted sm">${UI.pct(g.lineCount[k], g.count)}%</span>
                ${Charts.meter(g.lineCount[k], g.count, k === 'high' ? '#6366f1' : k === 'mid' ? '#0ea5e9' : '#10b981')}</td>`).join('')}
            </tr>`;
          }).join('')}
          <tr class="sum"><td><b>年级合计</b></td><td>${st.all.count}</td><td><b>${st.all.avg}</b></td>
            <td>${st.all.max}</td><td>${st.all.min}</td>
            ${['high', 'mid', 'low'].map(k => `<td>${st.all.lineCount[k]} 人 <span class="muted sm">${UI.pct(st.all.lineCount[k], st.all.count)}%</span></td>`).join('')}
          </tr></tbody></table></div>
      </div>`}

      <div class="grid-2">
        <div class="card"><div class="card-head"><h3>🎯 上线人数</h3>${isClassMode ? `<span class="muted sm">${esc(scopeName)}</span>` : ''}</div>${lineBars}</div>
        <div class="card"><div class="card-head"><h3>🕸 分题型得分率</h3><span class="muted sm">${isClassMode ? esc(scopeName) + ' vs 年级' : '各班对比'}</span></div>${radar}</div>
      </div>

      <div class="grid-2">
        <div class="card">
          <div class="card-head"><h3>⚡ ${isClassMode ? esc(scopeName) : '年级'}强弱项</h3></div>
          <div class="table-wrap"><table class="tbl">
            <thead><tr><th>题型</th><th>满分</th><th>平均</th><th>得分率</th></tr></thead>
            <tbody>${partRank.slice().reverse().map((p, i) => `<tr>
              <td>${esc(p.name)} ${i === 0 ? '<span class="pill ok">最强</span>' : ''}
                  ${i === partRank.length - 1 ? '<span class="pill bad">最弱</span>' : ''}</td>
              <td class="muted">${p.full}</td><td>${p.avg}</td>
              <td>${Charts.meter(p.rate, 100, p.rate >= 80 ? '#10b981' : p.rate >= 65 ? '#f59e0b' : '#ef4444')}
                  <span class="sm">${p.rate}%</span></td></tr>`).join('')}
            </tbody></table></div>
          <p class="hint">💡 建议优先补：<b>${esc(partRank.slice(0, 2).map(p => p.name).join('、'))}</b>（${isClassMode ? esc(scopeName) : '年级'}得分率最低）</p>
        </div>

        <div class="card">
          <div class="card-head"><h3>🔶 临界生（差 ${Store.db.settings.band} 分内）</h3>
            <button class="btn xs" id="x-band">调整分差</button></div>
          ${bl.length ? `<div class="table-wrap max360"><table class="tbl">
            <thead><tr><th>学生</th>${isClassMode ? '' : '<th>班级</th>'}<th>总分</th><th>目标线</th><th>差距</th><th style="width:80px"></th></tr></thead>
            <tbody>${bl.map(b => `<tr>
              <td><a class="link" data-stu="${b.studentId}">${esc(b.name)}</a></td>
              ${isClassMode ? '' : `<td>${esc(Store.className(b.classId))}</td>`}<td><b>${b.total}</b></td>
              <td><span class="pill ${b.line}">${lineName[b.line]} ${b.lineScore}</span></td>
              <td class="bad"><b>-${b.gap}</b></td>
              <td><button class="btn xs" data-mark="${b.studentId}">加关注</button></td></tr>`).join('')}
            </tbody></table></div>` : empty('暂无临界生', '🎯')}
        </div>
      </div>

      <div class="card">
        <div class="card-head"><h3>👤 个人分析</h3>
          <select class="inp" id="x-stu" style="max-width:220px"><option value="">选择学生…</option>${UI.studentOptions(state.stu, cid)}</select></div>
        ${state.stu ? personal(state.stu) : '<p class="hint">选择学生查看个人趋势、题型雷达与强弱项。</p>'}
      </div>

      <div class="card">
        <div class="card-head"><h3>📋 成绩明细</h3></div>
        ${detailTable(st)}
      </div>`;
  }

  /* ------------- 总分排名榜（SVG 柱状图） ------------- */
  function scoreRankChart(rows, lines, cid) {
    if (!rows.length) return `<div class="chart-empty">暂无数据</div>`;
    const W = 740, H = 280, pl = 40, pr = 12, pt = 10, pb = 50;
    const iw = W - pl - pr, ih = H - pt - pb;
    const maxScore = Math.max(lines.high, rows[0].total) + 10;
    const bw = Math.min(40, iw / rows.length * 0.65);
    const clsColors = { cls_4: '#6366f1', cls_8: '#f59e0b' };

    let bars = '';
    rows.forEach((r, i) => {
      const cx = pl + (iw / rows.length) * (i + 0.5);
      const h = (Math.max(0, r.total || 0) / maxScore) * ih;
      const color = clsColors[r.classId] || '#94a3b8';
      const shortName = r.name.length > 2 ? r.name.slice(0, 2) : r.name;
      bars += `<rect x="${(cx - bw / 2).toFixed(1)}" y="${(pt + ih - h).toFixed(1)}"
        width="${bw.toFixed(1)}" height="${Math.max(h, 1).toFixed(1)}" rx="3" fill="${color}" opacity=".85">
        <title>#${i + 1} ${esc(r.name)} · ${r.total}分</title></rect>
        <text x="${cx.toFixed(1)}" y="${Math.max(pt + 8, pt + ih - h - 3).toFixed(1)}" text-anchor="middle" font-size="8.5" fill="#334155" font-weight="600">${r.total}</text>`;
    });

    // Grid + axis
    let grid = '';
    for (let i = 0; i <= 4; i++) {
      const yy = pt + (ih * i) / 4;
      grid += `<line x1="${pl}" y1="${yy}" x2="${W - pr}" y2="${yy}" class="grid"/>
        <text x="${pl - 6}" y="${yy + 4}" class="ax-y">${Math.round(maxScore * (4 - i) / 4)}</text>`;
    }
    // Label every Nth bar
    const step = rows.length > 30 ? 5 : (rows.length > 15 ? 3 : 1);
    let labels = '';
    for (let i = 0; i < rows.length; i += step) {
      const cx = pl + (iw / rows.length) * (i + 0.5);
      labels += `<text x="${cx.toFixed(1)}" y="${H - 20}" class="ax-x" text-anchor="middle" font-size="9">#${i + 1}</text>`;
    }
    // Line markers
    ['high', 'mid', 'low'].forEach(k => {
      const yy = pt + ih - (lines[k] / maxScore) * ih;
      const colors = { high: '#ef4444', mid: '#f59e0b', low: '#10b981' };
      grid += `<line x1="${pl}" y1="${yy}" x2="${W - pr}" y2="${yy}" stroke="${colors[k]}" stroke-width="1.5" stroke-dasharray="6,3" opacity=".7"/>
        <text x="${W - pr - 4}" y="${yy - 3}" class="ax-x" text-anchor="end" fill="${colors[k]}" font-size="10">${k === 'high' ? '高' : k === 'mid' ? '中' : '低'}${lines[k]}</text>`;
    });

    return `<div class="chart"><svg viewBox="0 0 ${W} ${H}">${grid}${bars}${labels}</svg></div>
      ${cid ? '' : '<div class="chart-legend row"><span><i style="background:#6366f1"></i>初三四班</span><span><i style="background:#f59e0b"></i>初三八班</span></div>'}`;
  }

  /* ------------- 总分分布柱状图（分段对比） ------------- */
  function scoreDistChart(rows, clsIds, lines) {
    const bins = [[0,30],[30,60],[60,90],[90,110],[110,130],[130,150]];
    const clsColors = { cls_4: '#6366f1', cls_8: '#f59e0b' };
    const binData = bins.map(([lo, hi]) => {
      const r = {};
      clsIds.forEach(id => { r[id] = rows.filter(x => x.classId === id && x.total >= lo && x.total < hi + 0.1).length; });
      r.total = Object.values(r).reduce((a, b) => a + b, 0);
      return { label: `${lo}-${hi}`, ...r };
    });

    const W = 520, H = 200, pl = 44, pr = 12, pt = 10, pb = 40;
    const iw = W - pl - pr, ih = H - pt - pb;
    const maxVal = Math.max(5, ...binData.map(b => b.total));
    const groups = binData.length;
    const gap = 8, bw = Math.min(36, (iw / groups - gap) / clsIds.length);

    let grid = '';
    for (let i = 0; i <= 4; i++) {
      const yy = pt + (ih * i) / 4;
      grid += `<line x1="${pl}" y1="${yy}" x2="${W - pr}" y2="${yy}" class="grid"/>
        <text x="${pl - 6}" y="${yy + 4}" class="ax-y">${Math.round(maxVal * (4 - i) / 4)}</text>`;
    }

    let bars = '', labels = '';
    binData.forEach((b, gi) => {
      const cx = pl + (iw / groups) * (gi + 0.5);
      labels += `<text x="${cx.toFixed(1)}" y="${H - 12}" class="ax-x" text-anchor="middle" font-size="10">${b.label}</text>`;
      labels += `<text x="${cx.toFixed(1)}" y="${H - 24}" text-anchor="middle" font-size="9" fill="#64748b">共${b.total}人</text>`;
      clsIds.forEach((id, ci) => {
        const v = b[id] || 0;
        const h = (v / maxVal) * ih;
        const x = cx - ((clsIds.length - 1) * bw) / 2 + ci * bw;
        bars += `<rect x="${(x - bw / 2 + 2).toFixed(1)}" y="${(pt + ih - h).toFixed(1)}"
          width="${(bw - 4).toFixed(1)}" height="${Math.max(h, 0).toFixed(1)}" rx="3"
          fill="${clsColors[id]}" opacity=".82"><title>${esc(Store.className(id))} · ${b.label}分：${v}人</title></rect>`;
        if (v > 0) {
          bars += `<text x="${x.toFixed(1)}" y="${(pt + ih - h - 4).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="bold" fill="${clsColors[id]}">${v}</text>`;
        }
      });
    });

    return `<div class="chart"><svg viewBox="0 0 ${W} ${H}">${grid}${bars}${labels}</svg></div>
      <div class="chart-legend row"><span><i style="background:#6366f1"></i>初三四班</span><span><i style="background:#f59e0b"></i>初三八班</span></div>`;
  }

  /* ------------- 总分分布柱状图（单班） ------------- */
  function scoreDistChartSingle(rows, lines, cid) {
    const bins = [[0,30],[30,60],[60,90],[90,110],[110,130],[130,150]];
    const clsColors = { cls_4: '#6366f1', cls_8: '#f59e0b' };
    const color = clsColors[cid] || '#6366f1';
    const binData = bins.map(([lo, hi]) => {
      const v = rows.filter(x => x.total >= lo && x.total < hi + 0.1).length;
      return { label: `${lo}-${hi}`, count: v };
    });

    const W = 520, H = 200, pl = 44, pr = 12, pt = 10, pb = 40;
    const iw = W - pl - pr, ih = H - pt - pb;
    const maxVal = Math.max(5, ...binData.map(b => b.count));
    const groups = binData.length;
    const bw = Math.min(48, iw / groups * 0.6);

    let grid = '';
    for (let i = 0; i <= 4; i++) {
      const yy = pt + (ih * i) / 4;
      grid += `<line x1="${pl}" y1="${yy}" x2="${W - pr}" y2="${yy}" class="grid"/>
        <text x="${pl - 6}" y="${yy + 4}" class="ax-y">${Math.round(maxVal * (4 - i) / 4)}</text>`;
    }

    let bars = '', labels = '';
    binData.forEach((b, gi) => {
      const cx = pl + (iw / groups) * (gi + 0.5);
      const v = b.count;
      const h = (v / maxVal) * ih;
      labels += `<text x="${cx.toFixed(1)}" y="${H - 12}" class="ax-x" text-anchor="middle" font-size="10">${b.label}</text>`;
      bars += `<rect x="${(cx - bw / 2).toFixed(1)}" y="${(pt + ih - h).toFixed(1)}"
        width="${bw.toFixed(1)}" height="${Math.max(h, 0).toFixed(1)}" rx="4"
        fill="${color}" opacity=".82"><title>${b.label}分：${v}人</title></rect>`;
      if (v > 0) {
        bars += `<text x="${cx.toFixed(1)}" y="${(pt + ih - h - 5).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="bold" fill="${color}">${v}</text>`;
      }
    });

    return `<div class="chart"><svg viewBox="0 0 ${W} ${H}">${grid}${bars}${labels}</svg></div>`;
  }

  function kpi(label, value, icon, tone) {
    return `<div class="kpi ${tone || ''}"><div class="kpi-ico">${icon}</div>
      <div><div class="kpi-v">${esc(value)}</div><div class="kpi-l">${esc(label)}</div></div></div>`;
  }

  function detailTable(st) {
    const cid = state.classId;
    const allRows = st.rows.slice().sort((a, b) => b.total - a.total);
    /* 班级排名：在全班中按总分降序的位置 */
    const classRanked = {};
    Store.classes().forEach(c => {
      const cr = st.rows.filter(r => r.classId === c.id).slice().sort((a, b) => b.total - a.total);
      cr.forEach((r, i) => { classRanked[r.studentId] = i + 1; });
    });
    const rows = cid ? allRows.filter(r => r.classId === cid) : allRows;
    if (!rows.length) return empty('暂无成绩', '📋');

    /* 固定7个分项列定义 */
    const fixedParts = [
      { name: '选择题', full: 100 },
      { name: '主观题', full: 50 },
      { name: '听力表格', full: 10 },
      { name: '短文填空', full: 10 },
      { name: '阅读表达', full: 10 },
      { name: '回答问题', full: 10 },
      { name: '作文', full: 10 }
    ];
    /* 当前考试的 parts 映射：name → index */
    const exPartMap = {};
    (st.parts || []).forEach((p, i) => { exPartMap[p.name] = i; });
    const hasParts = (st.parts || []).length > 0;

    /* 分项取值：优先按名称匹配，无匹配则返回 null */
    const partVal = (r, partName) => {
      const idx = exPartMap[partName];
      if (idx === undefined) return null;
      const v = (r.parts || [])[idx];
      if (v === undefined || v === null || v === '') return null;
      return v;
    };
    const cell = (v) => v === null ? '<span class="muted">/</span>' : String(v);

    return `<div class="table-wrap"><table class="tbl">
      <thead><tr>
        <th style="width:80px">姓名</th>
        <th style="width:56px">班级排名</th>
        <th style="width:56px">年级排名</th>
        <th>总分<span class="muted sm">/150</span></th>
        ${fixedParts.map(p => `<th>${esc(p.name)}<span class="muted sm">/${p.full}</span></th>`).join('')}
      </tr></thead>
      <tbody>${rows.map(r => {
        const clsRank = classRanked[r.studentId] || '';
        const gr = r.gradeRank || '';
        const total = r.total !== undefined ? r.total : '';
        return `<tr class="${total !== '' && total >= st.lines.high ? 'row-high' : ''}">
          <td><a class="link" data-stu="${r.studentId}">${esc(r.name)}</a>${r.focus ? ' ⭐' : ''}</td>
          <td class="muted">${clsRank || '<span class="muted">/</span>'}</td>
          <td class="muted">${gr || '<span class="muted">/</span>'}</td>
          <td><b>${total !== '' ? total : '<span class="muted">/</span>'}</b></td>
          ${fixedParts.map(p => {
            const v = hasParts ? partVal(r, p.name) : null;
            const rate = v !== null && p.full ? v / p.full : 0;
            return `<td class="${v !== null && rate < 0.6 ? 'cell-bad' : v !== null && rate >= 0.9 ? 'cell-good' : ''}">${cell(v)}</td>`;
          }).join('')}
        </tr>`;
      }).join('')}
      </tbody></table></div>`;
  }

  function personal(sid) {
    const list = An.studentExams(sid);
    if (!list.length) return `<p class="hint">该学生暂无成绩记录。</p>`;
    const sw = An.strengthWeakness(sid);
    const last = list[list.length - 1];
    const hasGradeRank = list.some(x => x.gradeRank);
    const hasParts = list.some(x => x.parts && x.parts.length >= 2);
    const partNames = (last.exam.parts || []).map(p => p.name);

    /* 总分趋势线 */
    const trend = Charts.line({
      labels: list.map(x => x.exam.name),
      series: [
        { name: '个人总分', data: list.map(x => x.total) },
        { name: '班级平均', data: list.map(x => x.classAvg), color: '#94a3b8' }
      ],
      height: 220, suffix: ' 分'
    });

    /* 分题型趋势线 */
    const abTrend = hasParts ? Charts.line({
      labels: list.map(x => x.exam.name),
      series: partNames.map((name, i) => ({
        name: name,
        data: list.map(x => (x.parts || [])[i] || 0)
      })),
      height: 180, suffix: ' 分', area: false
    }) : '';

    /* 雷达图 */
    const radar = Charts.radar({
      axes: sw.items.map(i => i.name),
      series: [
        { name: '本人得分率', data: sw.items.map(i => i.rate) },
        { name: '班级平均', data: sw.items.map(i => i.classRate), color: '#94a3b8' }
      ], max: 100, size: 330
    });
    const delta = An.scoreTrendDelta(sid);

    /* 变化明细表 */
    const reversed = list.slice().reverse();
    const chg = (cur, prev, lowerBetter) => {
      if (prev === undefined || prev === null || cur === undefined || cur === null) return '';
      const d = cur - prev;
      if (d === 0) return ' <span class="muted sm">→</span>';
      const good = lowerBetter ? d < 0 : d > 0;
      return ` <span class="${good ? 'good' : 'bad'} sm">${d > 0 ? '↑' : '↓'}${Math.abs(d)}</span>`;
    };

    let th = '<th>考试</th><th>总分</th>';
    if (hasParts) partNames.forEach(n => th += `<th>${esc(n)}</th>`);
    if (hasGradeRank) th += '<th>年排</th>';
    th += '<th>班名</th><th>班均</th>';

    const detailRows = reversed.map((x, i) => {
      const p = reversed[i + 1];
      return `<tr>
        <td>${esc(x.exam.name)}</td>
        <td><b>${x.total}</b>${p ? chg(x.total, p.total, false) : ''}</td>
        ${hasParts ? partNames.map((_, j) => {
          const v = (x.parts || [])[j] || 0;
          const pv = p ? (p.parts || [])[j] : null;
          return `<td>${v}${p ? chg(v, pv, false) : ''}</td>`;
        }).join('') : ''}
        ${hasGradeRank ? `<td>${x.gradeRank || '—'}${p && p.gradeRank ? chg(x.gradeRank, p.gradeRank, true) : ''}</td>` : ''}
        <td>${x.rank}/${x.classCount}${p ? chg(x.rank, p.rank, true) : ''}</td>
        <td class="muted">${x.classAvg}</td>
      </tr>`;
    }).join('');

    return `<div class="grid-2">
        <div>
          <p class="hint" style="margin:0 0 6px"><b>📈 总分趋势</b></p>
          ${trend}
          ${hasParts ? `<p class="hint" style="margin:10px 0 6px"><b>📊 分题型得分趋势</b></p>${abTrend}` : ''}
        </div>
        <div>
          <p class="hint" style="margin:0 0 6px"><b>🕸 题型得分率对比</b></p>
          ${radar}
          <div class="sw-box">
            ${delta ? `<div class="sw-line">较上次：<b class="${delta.delta >= 0 ? 'good' : 'bad'}">${delta.delta >= 0 ? '+' : ''}${delta.delta} 分</b>
              ${delta.rankDelta ? `　班名 <b class="${delta.rankDelta > 0 ? 'good' : 'bad'}">${delta.rankDelta > 0 ? '↑' : '↓'}${Math.abs(delta.rankDelta)}</b>` : ''}</div>` : ''}
            <div class="sw-line">✅ 优势题型：<b class="good">${esc(sw.strong.map(i => i.name + ' ' + i.rate + '%').join('、'))}</b></div>
            <div class="sw-line">⚠️ 薄弱题型：<b class="bad">${esc(sw.weak.map(i => i.name + ' ' + i.rate + '%').join('、'))}</b></div>
            ${sw.belowClass.length ? `<div class="sw-line">📉 明显落后班均：${esc(sw.belowClass.map(i => `${i.name}(${i.delta}%)`).join('、'))}</div>` : ''}
          </div>
        </div>
      </div>
      <div style="margin-top:10px">
        <p class="hint" style="margin:0 0 6px"><b>📋 历次考试变化明细</b>　<span class="muted sm">↑进步(绿) ↓退步(红)　年排/班名数字越小越好</span></p>
        <div class="table-wrap"><table class="tbl mini">
          <thead><tr>${th}</tr></thead>
          <tbody>${detailRows}</tbody>
        </table></div>
      </div>`;
  }

  /* ------------- 考试设置 ------------- */
  function editExam(id) {
    const ex = id ? An.exam(id) : null;
    const parts = ex ? ex.parts : Store.defaultParts();
    const lines = ex ? ex.lines : Object.assign({}, Store.db.settings.lines);
    const partRow = (p, i) => `<div class="part-row" data-i="${i}">
      <input class="inp" value="${esc(p.name)}" data-pn placeholder="题型名">
      <input class="inp" type="number" value="${p.full}" data-pf style="width:90px" placeholder="满分">
      <button class="icon-btn danger" data-prm>✕</button></div>`;

    const mm = modal({
      title: ex ? '⚙️ 考试设置' : '＋ 新建考试',
      width: 640,
      body: `<div class="form">
        <div class="grid3">
          <label>考试名称<input class="inp" id="e-name" value="${esc(ex ? ex.name : '')}" placeholder="如：第一次月考"></label>
          <label>日期<input class="inp" type="date" id="e-date" value="${esc(ex ? ex.date : UI.today())}"></label>
          <label>范围<input class="inp" id="e-scope" value="${esc(ex ? ex.scope : '')}" placeholder="Unit 1-3"></label>
        </div>
        <div class="grid3">
          <label>高线<input class="inp" type="number" id="e-h" value="${lines.high}"></label>
          <label>中线<input class="inp" type="number" id="e-m" value="${lines.mid}"></label>
          <label>低线<input class="inp" type="number" id="e-l" value="${lines.low}"></label>
        </div>
        <div class="row-between"><b>题型与满分</b>
          <div><button class="btn xs" id="e-addpart">＋ 题型</button>
          <button class="btn xs ghost" id="e-reset">恢复默认7项</button></div></div>
        <div id="e-parts">${parts.map(partRow).join('')}</div>
        <p class="hint">题型合计满分：<b id="e-full">${parts.reduce((a, p) => a + Number(p.full || 0), 0)}</b> 分</p>
        ${ex ? `<button class="btn danger ghost block" id="e-del">🗑 删除该场考试</button>` : ''}
      </div>`,
      onOk: (wrap) => {
        const name = UI.$('#e-name', wrap).value.trim();
        if (!name) { toast('请填写考试名称', 'err'); return false; }
        const ps = UI.$$('.part-row', wrap).map(r => ({
          name: UI.$('[data-pn]', r).value.trim() || '题型',
          full: Number(UI.$('[data-pf]', r).value) || 0
        }));
        const data = {
          name, date: UI.$('#e-date', wrap).value || UI.today(),
          scope: UI.$('#e-scope', wrap).value.trim(),
          parts: ps,
          lines: { high: Number(UI.$('#e-h', wrap).value), mid: Number(UI.$('#e-m', wrap).value), low: Number(UI.$('#e-l', wrap).value) }
        };
        if (ex) {
          Store.patch('exams', ex.id, data);
          // 分数线变了，重新计算自动关注
          const updated = An.exam(ex.id);
          if (updated && (updated.scores || []).length) An.autoFocusStudents(updated);
        }
        else {
          const it = Store.push('exams', Object.assign({ scores: [] }, data), 'exam');
          state.examId = it.id;
          setTimeout(() => enterScores(it.id), 250);
        }
        toast('已保存'); App.render();
      }
    });

    const wrap = mm.el;
    const refresh = () => {
      UI.$('#e-full', wrap).textContent = UI.$$('.part-row [data-pf]', wrap).reduce((a, i) => a + Number(i.value || 0), 0);
      UI.$$('[data-prm]', wrap).forEach(b => b.onclick = () => { b.closest('.part-row').remove(); refresh(); });
      UI.$$('[data-pf]', wrap).forEach(i => i.oninput = refresh);
    };
    refresh();
    UI.$('#e-addpart', wrap).onclick = () => {
      UI.$('#e-parts', wrap).insertAdjacentHTML('beforeend', partRow({ name: '', full: 10 }, 99));
      refresh();
    };
    UI.$('#e-reset', wrap).onclick = () => {
      UI.$('#e-parts', wrap).innerHTML = Store.defaultParts().map(partRow).join('');
      refresh();
    };
    if (ex) UI.$('#e-del', wrap).onclick = () => confirmBox(`删除考试「${esc(ex.name)}」及其全部成绩？`, () => {
      Store.remove('exams', ex.id); state.examId = ''; mm.close(); toast('已删除'); App.render();
    }, { danger: true, okText: '删除' });
  }

  /* ------------- 成绩录入 ------------- */
  function enterScores(examId) {
    const ex = An.exam(examId);
    if (!ex) return;
    const parts = ex.parts;
    let classId = state.classId || (Store.classes()[0] || {}).id;

    const rowsHTML = (cid) => Store.students(cid).map(s => {
      const sc = (ex.scores || []).find(x => x.studentId === s.studentId || x.studentId === s.id) || {};
      return `<tr data-sid="${s.id}"><td>${esc(s.no)}</td><td>${esc(s.name)}</td>
        <td><input class="inp num total" type="number" step="0.5" value="${sc.total !== undefined ? sc.total : ''}"></td>
        ${parts.map((p, i) => `<td><input class="inp num part" data-i="${i}" type="number" step="0.5" max="${p.full}"
           value="${sc.parts && sc.parts[i] !== undefined ? sc.parts[i] : ''}"></td>`).join('')}</tr>`;
    }).join('');

    const table = (cid) => `<div class="table-wrap max420"><table class="tbl score-tbl">
      <thead><tr><th style="width:48px">学号</th><th style="width:90px">姓名</th><th>总分</th>
        ${parts.map(p => `<th>${esc(p.name)}<span class="muted sm">/${p.full}</span></th>`).join('')}</tr></thead>
      <tbody id="sc-body">${rowsHTML(cid)}</tbody></table></div>`;

    const mm = modal({
      title: `📝 录入成绩 · ${ex.name}`,
      width: 940,
      body: `<div class="form">
        <div class="row-between">
          <label style="flex:0 0 200px">班级<select class="inp" id="sc-cls">${classOptions(classId)}</select></label>
          <div><button class="btn xs" id="sc-paste">📋 粘贴导入</button>
               <button class="btn xs ghost" id="sc-sum">用分项求和填总分</button></div>
        </div>
        <div id="sc-pastebox" style="display:none">
          <p class="hint">每行一名学生，可用 Tab / 逗号 / 空格分隔。列顺序：<b>姓名 → 总分 → ${parts.map(p => p.name).join(' → ')}</b>；
             只填「姓名 总分」也可以；只填分项时会自动求和。</p>
          <textarea class="inp mono" id="sc-text" rows="6" placeholder="张小雨	108	28	9	8	24	9	12	18"></textarea>
          <button class="btn xs primary" id="sc-parse">识别并填入表格</button>
        </div>
        <div id="sc-table">${table(classId)}</div>
      </div>`,
      okText: '保存成绩',
      onOk: (wrap) => { collect(wrap, ex, classId); toast('成绩已保存'); App.render(); }
    });

    const wrap = mm.el;
    UI.$('#sc-cls', wrap).onchange = e => {
      collect(wrap, ex, classId);         // 切班前先暂存
      classId = e.target.value;
      state.classId = classId;
      UI.$('#sc-table', wrap).innerHTML = table(classId);
    };
    UI.$('#sc-paste', wrap).onclick = () => {
      const box = UI.$('#sc-pastebox', wrap);
      box.style.display = box.style.display === 'none' ? '' : 'none';
    };
    UI.$('#sc-sum', wrap).onclick = () => {
      UI.$$('#sc-body tr', wrap).forEach(tr => {
        const vals = UI.$$('.part', tr).map(i => Number(i.value) || 0);
        if (vals.some(v => v > 0)) UI.$('.total', tr).value = vals.reduce((a, b) => a + b, 0);
      });
      toast('已按分项求和');
    };
    UI.$('#sc-parse', wrap).onclick = () => {
      const text = UI.$('#sc-text', wrap).value;
      const n = parseScores(text, wrap, parts);
      toast(n ? `已填入 ${n} 名学生成绩` : '未匹配到学生，请检查姓名是否与名单一致', n ? 'ok' : 'err');
    };
  }

  function parseScores(text, wrap, parts) {
    const lines = String(text).replace(/\r/g, '').split('\n').map(l => l.trim()).filter(Boolean);
    let n = 0;
    lines.forEach(line => {
      const cells = line.split(/\t|,|，|;|；| +/).map(s => s.trim()).filter(s => s !== '');
      if (!cells.length) return;
      const name = cells.shift();
      const nums = cells.map(Number).filter(v => !isNaN(v));
      const tr = UI.$$('#sc-body tr', wrap).find(tr => UI.$$('td', tr)[1].textContent.trim() === name);
      if (!tr) return;
      let total = null, ps = [];
      if (nums.length === parts.length + 1) { total = nums[0]; ps = nums.slice(1); }
      else if (nums.length === parts.length) { ps = nums; total = nums.reduce((a, b) => a + b, 0); }
      else if (nums.length >= 1) { total = nums[0]; }
      if (total !== null) UI.$('.total', tr).value = total;
      UI.$$('.part', tr).forEach((inp, i) => { if (ps[i] !== undefined) inp.value = ps[i]; });
      n++;
    });
    return n;
  }

  function collect(wrap, ex, classId) {
    const others = (ex.scores || []).filter(s => {
      const stu = Store.student(s.studentId);
      return !stu || stu.classId !== classId;
    });
    const mine = [];
    UI.$$('#sc-body tr', wrap).forEach(tr => {
      const totalInp = UI.$('.total', tr);
      const parts = UI.$$('.part', tr).map(i => i.value === '' ? 0 : Number(i.value));
      const hasPart = parts.some(v => v > 0);
      if (totalInp.value === '' && !hasPart) return;
      const total = totalInp.value !== '' ? Number(totalInp.value) : parts.reduce((a, b) => a + b, 0);
      mine.push({ studentId: tr.dataset.sid, total, parts });
    });
    Store.patch('exams', ex.id, { scores: others.concat(mine) });
    // 自动更新重点关注学生分类
    const updated = An.exam(ex.id);
    if (updated) An.autoFocusStudents(updated);
  }

  /* ------------- 事件 ------------- */
  function bind(view, ex, st) {
    const { $, $$ } = UI;
    const sel = $('#x-exam', view); if (sel) sel.onchange = e => { state.examId = e.target.value; state.stu = ''; App.render(); };
    $('#x-new', view).onclick = () => editExam(null);
    const b1 = $('#x-edit', view); if (b1) b1.onclick = () => editExam(ex.id);
    const b2 = $('#x-scores', view); if (b2) b2.onclick = () => enterScores(ex.id);
    const s1 = $('#x-stu', view); if (s1) s1.onchange = e => { state.stu = e.target.value; App.render(); };

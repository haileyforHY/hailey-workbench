    const fc = $('#x-filtercls', view); if (fc) fc.onchange = e => { state.classId = e.target.value; state.stu = ''; App.render(); };
    const ls = $('#x-lsave', view); if (ls) ls.onclick = () => {
      const h = Number($('#x-lh', view).value);
      const m = Number($('#x-lm', view).value);
      const l = Number($('#x-ll', view).value);
      if (!h || !m || !l) { toast('分数线不能为空或0', 'err'); return; }
      Store.patch('exams', ex.id, { lines: { high: h, mid: m, low: l } });
      // 分数线变了，重新计算自动关注
      const updated = An.exam(ex.id);
      if (updated && (updated.scores || []).length) An.autoFocusStudents(updated);
      toast('分数线已更新'); App.render();
    };
    const bd = $('#x-band', view); if (bd) bd.onclick = () => modal({
      title: '临界生分差', width: 360,
      body: `<div class="form"><label>距离分数线多少分算临界生
        <input class="inp" type="number" id="b-v" value="${Store.db.settings.band}"></label></div>`,
      onOk: w => { Store.db.settings.band = Number(UI.$('#b-v', w).value) || 8; Store.save(); App.render(); }
    });
    $$('[data-stu]', view).forEach(b => b.onclick = () => {
      state.stu = b.dataset.stu;
      App.render();
      setTimeout(() => {
        const el = document.getElementById('x-stu');
        if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
      }, 80);
    });
    $$('[data-mark]', view).forEach(b => b.onclick = () => {
      const s = Store.student(b.dataset.mark);
      const tags = new Set(s.tags || []); tags.add('临界生');
      Store.updateStudent(s.id, { focus: true, tags: Array.from(tags) });
      toast(`${s.name} 已加入重点关注 ⭐`); App.render();
    });
  }

  App.pages.exams = { title: '成绩分析', render };
})();

</script>

          <tbody>${list.map(c => `<tr>
            <td>${esc(c.date)}</td>

          followDate: UI.$('#m-fd', wrap).value,

    $$('[data-del]', view).forEach(b => b.onclick = () => confirmBox('删除这条沟通记录？',
      () => { Store.remove('comms', b.dataset.del); toast('已删除'); App.render(); }, { danger: true, okText: '删除' }));

  App.pages.comm = { title: '家校沟通记录', render, edit };

<script>
/* ===========================================================

(function () {

  const tState = { showDone: false };

      const list = open.filter(t => Number(t.quadrant) === q)
        .sort((a, b) => (a.due || '9999').localeCompare(b.due || '9999'));
      return `<div class="quad q${q}">

          <button class="btn" id="t-toggle">${tState.showDone ? '隐藏' : '查看'}已完成（${done.length}）</button>

      </div>

      <div class="quad-grid">${[1, 2, 3, 4].map(cell).join('')}</div>

      ${tState.showDone ? `<div class="card"><div class="card-head"><h3>🎉 已完成</h3>
        <button class="btn xs ghost" id="t-clear">清空已完成</button></div>
        ${done.length ? `<div class="list">${done.map(t => `<div class="list-item done">
          <div><span class="strike">${esc(t.title)}</span> <span class="muted sm">${esc(t.doneAt || '')}</span></div>
          <button class="btn xs" data-undo="${t.id}">恢复</button></div>`).join('')}</div>` : empty('暂无', '✅')}
      </div>` : ''}`;

    bindTodos(view);

  function srcName(s) {
    return { dictation: '听写欠账', recitation: '背诵欠账', discipline: '违纪跟进', comm: '家校跟进' }[s] || s;
  }

  function editTodo(id, quadrant) {
    const t = id ? Store.db.todos.find(x => x.id === id) : null;
    modal({
      title: t ? '编辑待办' : '＋ 新增待办',
      width: 480,
      body: `<div class="form">
        <label>内容<input class="inp" id="t-title" value="${esc(t ? t.title : '')}" placeholder="如：找李明谈心 / 批改八班作文"></label>
        <div class="grid2">
          <label>象限<select class="inp" id="t-q">
            ${[1, 2, 3, 4].map(q => `<option value="${q}"${String((t ? t.quadrant : quadrant) || 1) === String(q) ? ' selected' : ''}>${Q[q].name}</option>`).join('')}
          </select></label>
          <label>截止日期<input class="inp" type="date" id="t-due" value="${esc(t ? t.due : UI.today())}"></label>
        </div>
      </div>`,
      onOk: (wrap) => {

        if (!title) { toast('请填写内容', 'err'); return false; }

        else Store.push('todos', Object.assign({ done: false, createdAt: UI.today() }, data), 'todo');
        toast('已保存'); App.render();
      }
    });
  }

  function bindTodos(view) {
    const { $, $$ } = UI;
    $('#t-add', view).onclick = () => editTodo(null, 1);
    $('#t-toggle', view).onclick = () => { tState.showDone = !tState.showDone; App.render(); };
    $$('[data-addq]', view).forEach(b => b.onclick = () => editTodo(null, Number(b.dataset.addq)));
    $$('[data-done]', view).forEach(c => c.onchange = () => {
      Store.patch('todos', c.dataset.done, { done: true, doneAt: UI.today() });
      toast('完成一项 🎉'); App.render();
    });
    $$('[data-undo]', view).forEach(b => b.onclick = () => { Store.patch('todos', b.dataset.undo, { done: false, doneAt: '' }); App.render(); });
    $$('[data-edit]', view).forEach(b => b.onclick = () => editTodo(b.dataset.edit));
    $$('[data-del]', view).forEach(b => b.onclick = () => { Store.remove('todos', b.dataset.del); toast('已删除'); App.render(); });
    const clr = $('#t-clear', view);
    if (clr) clr.onclick = () => confirmBox('清空全部已完成待办？', () => {
      Store.db.todos = Store.db.todos.filter(t => !t.done); Store.save(); App.render();
    }, { danger: true, okText: '清空' });
  }

  /* =============== 违纪 =============== */
  const dState = { classId: '', type: '' };

  function renderDiscipline(view) {
    const all = Store.db.discipline.slice().sort((a, b) => b.date.localeCompare(a.date));
    const list = all.filter(d => {
      const s = Store.student(d.studentId);
      if (dState.classId && (!s || s.classId !== dState.classId)) return false;
      if (dState.type && d.type !== dState.type) return false;
      return true;
    });
    const warns = An.disciplineWarnings(3);
    const month = all.filter(d => d.date >= UI.addDays(UI.today(), -30));
    const typeCount = {};
    all.forEach(d => typeCount[d.type] = (typeCount[d.type] || 0) + 1);
    const donut = Charts.donut({
      items: Object.keys(typeCount).map(k => ({ label: k, value: typeCount[k] })),
      size: 220, centerLabel: '违纪总数'
    });

    view.innerHTML = `
      <div class="page-head">
        <div><h2>⚠️ 违纪记录</h2><p class="sub">累计 3 次自动预警 · 类型分布一目了然</p></div>
        <div class="head-actions">
          <select class="inp" id="d-cls" style="max-width:150px">${classOptions(dState.classId, '全部班级')}</select>
          <select class="inp" id="d-type" style="max-width:150px">
            <option value="">全部类型</option>
            ${Store.db.settings.discTypes.map(t => `<option value="${esc(t)}"${dState.type === t ? ' selected' : ''}>${esc(t)}</option>`).join('')}
          </select>
          <button class="btn primary" id="d-add">＋ 记一笔</button>
        </div>
      </div>

      <div class="kpi-row">
        ${kpi('累计记录', all.length + ' 次', '📋')}
        ${kpi('近30天', month.length + ' 次', '📅', month.length > 10 ? 'warn' : '')}
        ${kpi('预警学生', warns.length + ' 人', '🚨', warns.length ? 'danger' : '')}
        ${kpi('未处理', all.filter(d => !d.handled).length + ' 条', '⏳')}
      </div>

      <div class="grid-2">
        <div class="card">
          <div class="card-head"><h3>🚨 累计预警（≥3 次）</h3></div>
          ${warns.length ? `<div class="list">${warns.map(w => `
            <div class="list-item">
              <div><b><a class="link" data-stu="${w.studentId}">${esc(w.name)}</a></b>
                <span class="muted sm">${esc(Store.className(w.classId))}</span>
                <div class="muted sm">${esc(recentTypes(w.studentId))}</div></div>
              <div class="nowrap"><span class="pill bad">${w.count} 次</span>
                <button class="btn xs" data-call="${w.studentId}">约谈家长</button></div>
            </div>`).join('')}</div>` : empty('暂无预警学生 👍', '🎈')}
        </div>
        <div class="card">
          <div class="card-head"><h3>🍩 类型分布</h3></div>
          ${donut}
        </div>
      </div>

      <div class="card">
        <div class="card-head"><h3>🗂 记录列表</h3><span class="muted sm">共 ${list.length} 条</span></div>
        ${list.length ? `<div class="table-wrap max480"><table class="tbl">
          <thead><tr><th style="width:100px">日期</th><th>学生</th><th>班级</th><th>类型</th><th>情况</th><th>处理</th><th style="width:90px">操作</th></tr></thead>
          <tbody>${list.map(d => `<tr>
            <td>${esc(d.date)}</td>
            <td><a class="link" data-stu="${d.studentId}">${esc(Store.studentName(d.studentId))}</a></td>
            <td>${esc(Store.className((Store.student(d.studentId) || {}).classId))}</td>
            <td><span class="chip">${esc(d.type)}</span></td>
            <td class="ellip wide" title="${esc(d.detail)}">${esc(d.detail)}</td>
            <td>${d.handled ? '<span class="pill ok">已处理</span>' : `<button class="btn xs" data-handle="${d.id}">标记处理</button>`}</td>
            <td class="nowrap"><button class="icon-btn" data-edit="${d.id}">✎</button>
              <button class="icon-btn danger" data-del="${d.id}">🗑</button></td></tr>`).join('')}
          </tbody></table></div>` : empty('没有违纪记录，班风不错 👏', '🎉')}
      </div>`;

    bindDisc(view);
  }

  function recentTypes(sid) {
    const list = Store.db.discipline.filter(d => d.studentId === sid).slice(-3).map(d => d.type);
    return list.join('、');
  }

  function editDisc(id, presetStu) {
    const d = id ? Store.db.discipline.find(x => x.id === id) : null;
    const types = Store.db.settings.discTypes;
    modal({
      title: d ? '编辑违纪记录' : '⚠️ 记一笔',
      width: 520,
      body: `<div class="form">
        <div class="grid3">
          <label class="span2">学生<select class="inp" id="d-s">${UI.studentOptions(d ? d.studentId : presetStu)}</select></label>
          <label>日期<input class="inp" type="date" id="d-d" value="${esc(d ? d.date : UI.today())}"></label>
        </div>
        <label>类型<select class="inp" id="d-t">${UI.selectOptions(types, d ? d.type : types[0])}</select></label>
        <label>具体情况<textarea class="inp" id="d-x" rows="3">${esc(d ? d.detail : '')}</textarea></label>
        <label class="check-inline"><input type="checkbox" id="d-h" ${d && d.handled ? 'checked' : ''}> 已处理</label>
        ${!d ? `<label class="check-inline"><input type="checkbox" id="d-todo"> 同时生成一条「找学生谈话」待办</label>` : ''}
      </div>`,
      onOk: (wrap) => {
        const sid = UI.$('#d-s', wrap).value;
        if (!sid) { toast('请选择学生', 'err'); return false; }
        const data = {
          studentId: sid, date: UI.$('#d-d', wrap).value || UI.today(),
          type: UI.$('#d-t', wrap).value, detail: UI.$('#d-x', wrap).value.trim(),
          handled: UI.$('#d-h', wrap).checked
        };
        if (d) Store.patch('discipline', d.id, data);
        else {
          Store.push('discipline', data, 'disc');
          if (UI.$('#d-todo', wrap) && UI.$('#d-todo', wrap).checked) {
            Store.push('todos', {
              title: `找 ${Store.studentName(sid)} 谈话（${data.type}）`, quadrant: 1,
              due: UI.today(), done: false, source: 'discipline', createdAt: UI.today()
            }, 'todo');
          }
          const cnt = An.disciplineCount(sid);
          if (cnt >= 3) toast(`⚠️ ${Store.studentName(sid)} 已累计 ${cnt} 次违纪，建议家校沟通`, 'warn');
        }
        toast('已记录'); App.render();
      }
    });
  }

  function bindDisc(view) {
    const { $, $$ } = UI;
    $('#d-cls', view).onchange = e => { dState.classId = e.target.value; App.render(); };
    $('#d-type', view).onchange = e => { dState.type = e.target.value; App.render(); };
    $('#d-add', view).onclick = () => editDisc(null);
    $$('[data-edit]', view).forEach(b => b.onclick = () => editDisc(b.dataset.edit));
    $$('[data-stu]', view).forEach(b => b.onclick = () => App.openStudent(b.dataset.stu));
    $$('[data-handle]', view).forEach(b => b.onclick = () => { Store.patch('discipline', b.dataset.handle, { handled: true }); App.render(); });
    $$('[data-del]', view).forEach(b => b.onclick = () => confirmBox('删除这条违纪记录？',
      () => { Store.remove('discipline', b.dataset.del); App.render(); }, { danger: true, okText: '删除' }));
    $$('[data-call]', view).forEach(b => b.onclick = () => App.pages.comm.edit(null, b.dataset.call));
  }

  function kpi(label, value, icon, tone) {
    return `<div class="kpi ${tone || ''}"><div class="kpi-ico">${icon}</div>
      <div><div class="kpi-v">${esc(value)}</div><div class="kpi-l">${esc(label)}</div></div></div>`;
  }

  App.pages.todos = { title: '待办', render: renderTodos, edit: editTodo };
  App.pages.discipline = { title: '违纪记录', render: renderDiscipline, edit: editDisc };
})();

</script>
<script>
/* ===========================================================
 * pages/timetable.js — 我的课表
 * =========================================================== */
(function () {
  const { esc, toast, modal, classOptions } = UI;
  const DAYS = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];

  function key(d, p) { return d + '-' + p; }

  function todayCourses() {
    const wd = UI.weekday();
    const tt = Store.db.timetable;
    const out = [];
    for (let p = 1; p <= Store.db.settings.periods; p++) {
      const c = tt[key(wd, p)];
      if (c && (c.classId || c.content)) out.push(Object.assign({ period: p }, c));
    }
    return out;
  }

  function render(view) {
    const s = Store.db.settings;
    const wd = UI.weekday();
    const days = DAYS.slice(0, s.days);
    const tt = Store.db.timetable;

    const rows = [];
    for (let p = 1; p <= s.periods; p++) {
      rows.push(`<tr><th class="p-th">第${p}节</th>${days.map((d, i) => {
        const dnum = i + 1;
        const c = tt[key(dnum, p)] || {};
        const has = c.classId || c.content;
        return `<td class="tt-cell ${dnum === wd ? 'today' : ''} ${has ? 'has' : ''}" data-d="${dnum}" data-p="${p}">
          ${has ? `<div class="tt-cls">${esc(c.classId ? Store.className(c.classId) : '')}</div>
                   <div class="tt-ct">${esc(c.content || '')}</div>
                   ${c.room ? `<div class="tt-room">📍${esc(c.room)}</div>` : ''}`
            : '<span class="tt-add">＋</span>'}
        </td>`;
      }).join('')}</tr>`);
    }

    const tc = todayCourses();
    view.innerHTML = `
      <div class="page-head">
        <div><h2>🗓️ 我的课表</h2><p class="sub">点任意格子即可编辑 · 今天是 ${DAYS[wd - 1]}</p></div>
        <div class="head-actions">
          <label class="inline-lab">天数
            <select class="inp xs" id="tt-days">${[5, 6, 7].map(n => `<option value="${n}"${s.days === n ? ' selected' : ''}>${n}</option>`).join('')}</select></label>
          <label class="inline-lab">节次
            <select class="inp xs" id="tt-periods">${[6, 7, 8, 9, 10].map(n => `<option value="${n}"${s.periods === n ? ' selected' : ''}>${n}</option>`).join('')}</select></label>
          <button class="btn ghost danger" id="tt-clear">清空课表</button>
        </div>
      </div>

      <div class="card">
        <div class="card-head"><h3>📌 今日课程（${DAYS[wd - 1]}）</h3></div>
        ${tc.length ? `<div class="today-row">${tc.map(c => `
          <div class="course-chip"><b>第${c.period}节</b>
            <span>${esc(c.classId ? Store.className(c.classId) : '')}</span>
            <em>${esc(c.content || '')}</em>${c.room ? `<i>📍${esc(c.room)}</i>` : ''}</div>`).join('')}</div>`
        : `<p class="hint">今天没有排课，好好休息 ☕</p>`}
      </div>

      <div class="card">
        <div class="table-wrap"><table class="tbl timetable">
          <thead><tr><th class="p-th"></th>${days.map((d, i) => `<th class="${i + 1 === wd ? 'today' : ''}">${d}</th>`).join('')}</tr></thead>
          <tbody>${rows.join('')}</tbody></table></div>
      </div>`;

    bind(view);
  }

  function editCell(d, p) {
    const k = key(d, p);
    const c = Store.db.timetable[k] || {};
    modal({
      title: `${DAYS[d - 1]} 第${p}节`,
      width: 420,
      body: `<div class="form">
        <label>班级<select class="inp" id="tt-c">${classOptions(c.classId, '（不选）')}</select></label>
        <label>内容<input class="inp" id="tt-t" value="${esc(c.content || '')}" placeholder="如：新课 Unit5 / 听写课 / 早读"></label>
        <label>地点<input class="inp" id="tt-r" value="${esc(c.room || '')}" placeholder="如：三楼多媒体"></label>
        <button class="btn ghost danger block" id="tt-del">清空这一格</button>
      </div>`,
      onOk: (wrap) => {
        Store.db.timetable[k] = {
          classId: UI.$('#tt-c', wrap).value,
          content: UI.$('#tt-t', wrap).value.trim(),
          room: UI.$('#tt-r', wrap).value.trim()
        };
        Store.save(); App.render();
      }
    });
    UI.$('#tt-del').onclick = () => {
      delete Store.db.timetable[k];
      Store.save();
      UI.$$('.modal-mask.show [data-close]')[0].click();
      App.render();
    };
  }

  function bind(view) {
    const { $, $$ } = UI;
    $$('.tt-cell', view).forEach(td => td.onclick = () => editCell(Number(td.dataset.d), Number(td.dataset.p)));
    $('#tt-days', view).onchange = e => { Store.db.settings.days = Number(e.target.value); Store.save(); App.render(); };
    $('#tt-periods', view).onchange = e => { Store.db.settings.periods = Number(e.target.value); Store.save(); App.render(); };
    $('#tt-clear', view).onclick = () => UI.confirmBox('确定清空整张课表？', () => {
      Store.db.timetable = {}; Store.save(); toast('已清空'); App.render();
    }, { danger: true, okText: '清空' });
  }

  App.pages.timetable = { title: '我的课表', render, todayCourses, DAYS };
})();

</script>
<script>
/* ===========================================================
 * pages/sync.js — ☁️ Supabase 云端同步 + ⚙️ 偏好设置
 * 单用户私有：一行 JSON 存全部数据
 * =========================================================== */
(function () {
  const { esc, toast, modal, confirmBox } = UI;
  const LOG_KEY = 'hailey_sync_log';
  let logs = JSON.parse(LS.getItem(LOG_KEY) || '[]');
  let lastPushAt = 0;          // 最近一次推送时间，用于忽略实时回声
  let suppressPush = false;    // 应用云端数据时抑制"改动即推"，避免回环
  let pushTimer = null;        // 改动即推的防抖定时器
  let rtDesired = false;       // 是否期望保持实时连接
  let rtStatus = 'off';        // off | connecting | open | fallback
  let ws = null, hbTimer = null, rtRef = 0, pollTimer = null;

  function cfg() { return Store.db.settings.supabase; }

  function log(text, ok) {
    logs.unshift({ t: new Date().toLocaleString('zh-CN'), text, ok: ok !== false });
    logs = logs.slice(0, 30);
    LS.setItem(LOG_KEY, JSON.stringify(logs));
  }

  function headers() {
    const c = cfg();
    return {
      apikey: c.key,
      Authorization: 'Bearer ' + c.key,
      'Content-Type': 'application/json'
    };
  }

  function base() {
    const c = cfg();
    return String(c.url || '').replace(/\/+$/, '') + '/rest/v1/' + (c.table || 'workbench');
  }

  function ready() {
    const c = cfg();
    return !!(c.url && c.key);
  }

  async function test() {
    if (!ready()) { toast('请先填写完整配置', 'err'); return false; }
    try {
      const r = await fetch(base() + '?select=id&limit=1', { headers: headers() });
      if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + (await r.text()).slice(0, 120));
      log('连接测试成功');
      toast('连接成功 ✅');
      return true;
    } catch (e) {
      log('连接失败：' + e.message, false);
      toast('连接失败：' + e.message, 'err');
      return false;
    }
  }

  async function push(silent) {
    if (!ready()) { if (!silent) toast('请先配置 Supabase', 'err'); return false; }
    // 安全防护：自动推送时，本地无学生数据则跳过，防止空数据覆盖云端
    if (silent && Store.db.students.length === 0) {
      log('跳过自动推送：本地无学生数据（防止覆盖云端）');
      return false;
    }
    try {
      const body = [{ id: cfg().rowId, payload: Store.db, updated_at: new Date().toISOString() }];
      const r = await fetch(base() + '?on_conflict=id', {
        method: 'POST',
        headers: Object.assign({ Prefer: 'resolution=merge-duplicates,return=minimal' }, headers()),
        body: JSON.stringify(body)
      });
      if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + (await r.text()).slice(0, 160));
      Store.clearDirty();
      lastPushAt = Date.now();
      log('推送成功（' + Store.db.students.length + ' 名学生）');
      if (!silent) { toast('已推送到云端 ☁️'); App.render(); }
      App.updateSyncBadge();
      return true;
    } catch (e) {
      log('推送失败：' + e.message, false);
      if (!silent) toast('推送失败：' + e.message, 'err');
      return false;
    }
  }

  async function pull(silent) {
    if (!ready()) { if (!silent) toast('请先配置 Supabase', 'err'); return false; }
    try {
      const r = await fetch(base() + '?id=eq.' + encodeURIComponent(cfg().rowId) + '&select=payload,updated_at', { headers: headers() });
      if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + (await r.text()).slice(0, 160));
      const rows = await r.json();
      if (!rows.length) { if (!silent) toast('云端还没有数据，先推送一次吧'); return false; }
      const remote = rows[0];
      if (!remote.payload) { if (!silent) toast('云端数据为空', 'err'); return false; }
      const localTime = Store.db.meta.updatedAt || '';
      const remoteTime = (remote.payload.meta && remote.payload.meta.updatedAt) || remote.updated_at || '';
      if (silent && remoteTime <= localTime) return false;   // 实时/轮询：云端不新就不覆盖

      const apply = () => {
        suppressPush = true;   // 应用云端数据时不要触发"改动即推"
        const keepSupabase = JSON.parse(JSON.stringify(cfg()));
        Store.setDB(remote.payload);
        Store.db.settings.supabase = keepSupabase;
        Store.saveNow();
        Store.clearDirty();
        suppressPush = false;
        log('拉取成功（云端 ' + (remoteTime || '').slice(0, 19) + '）');
        toast('已从云端恢复 ☁️');
        App.render();
        App.updateSyncBadge();
      };

      if (silent) { apply(); return true; }
      confirmBox(`云端最后更新：<b>${esc((remoteTime || '').slice(0, 19).replace('T', ' '))}</b><br>
        本机最后更新：<b>${esc((localTime || '').slice(0, 19).replace('T', ' '))}</b><br><br>
        拉取会<b>覆盖本机数据</b>，确定继续吗？`, apply, { okText: '覆盖本机', danger: true });
      return true;
    } catch (e) {
      log('拉取失败：' + e.message, false);
      if (!silent) toast('拉取失败：' + e.message, 'err');
      return false;
    }
  }

  /* ---------------- 自动同步引擎 ---------------- */
  // 策略：① 启动先拉云端（防止空数据覆盖）② 始终定时轮询（主同步）③ Realtime 实时推送（锦上添花）
  function schedulePush() {
    if (!cfg().auto || !ready()) return;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(() => { if (Store.dirty) push(true); }, 700);
  }
  function onStoreChange() {
    if (suppressPush) return;
    schedulePush();
  }

  // 云端有变动：忽略自己刚推送产生的回声；本机有未推送改动则先推
  function onRemoteChange() {
    if (Date.now() - lastPushAt < 4000) return;
    if (Store.dirty) push(true);
    else pull(true);
  }

  // 启动时先同步云端：比较学生数量决定拉还是推（核心防覆盖逻辑）
  async function initialSync() {
    if (!ready()) return;
    try {
      const r = await fetch(base() + '?id=eq.' + encodeURIComponent(cfg().rowId) + '&select=payload,updated_at', { headers: headers() });
      if (!r.ok) return;
      const rows = await r.json();
      if (!rows.length) {
        // 云端无数据行：本机有学生则推送
        if (Store.db.students.length > 0) { log('云端为空，推送本机数据'); await push(true); }
        return;
      }
      const remote = rows[0];
      const remoteStudents = ((remote.payload || {}).students || []).length;
      const localStudents = Store.db.students.length;
      if (remoteStudents < localStudents) {
        // 云端学生少于本机 → 推送本机（防止空云端覆盖本机数据）
        log('云端学生(' + remoteStudents + ')少于本机(' + localStudents + ')，推送本机数据');
        await push(true);
      } else {
        // 云端学生≥本机 → 拉取云端
        await pull(true);
      }
    } catch (e) {
      log('初始同步失败：' + e.message, false);
    }
  }

  function realtimeURL() {
    const c = cfg();
    const u = new URL(c.url);
    return `wss://${u.host}/realtime/v1?apikey=${encodeURIComponent(c.key)}&vsn=1.0.0`;
  }

  function connectRT() {
    if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
    if (!cfg().url || !cfg().key) return;
    let url;
    try { url = realtimeURL(); } catch { return; }
    rtStatus = 'connecting';
    try { ws = new WebSocket(url); } catch (e) { rtStatus = 'fallback'; return; }
    ws.onopen = () => {
      rtStatus = 'open';
      const c = cfg();
      ws.send(JSON.stringify({
        topic: 'realtime:' + (c.table || 'workbench'),
        event: 'phx_join',
        payload: { config: { postgres_changes: [{ event: '*', schema: 'public', table: c.table || 'workbench', filter: 'id=eq.' + (c.rowId || 'hailey') }] } },
        ref: '1'
      }));
      log('Realtime 已连接，开始实时监听');
      hbTimer = setInterval(() => {
        if (ws && ws.readyState === WebSocket.OPEN)
          ws.send(JSON.stringify({ topic: 'phoenix', event: 'heartbeat', payload: {}, ref: 'hb' + Date.now() }));
      }, 25000);
      App.updateSyncBadge();
    };
    ws.onmessage = (ev) => {
      let msg; try { msg = JSON.parse(ev.data); } catch { return; }
      if (msg.event === 'postgres_changes') onRemoteChange();
    };
    ws.onerror = () => {};  // 静默：轮询兜底已覆盖，不刷错误日志
    ws.onclose = () => {
      clearInterval(hbTimer); hbTimer = null; ws = null;
      if (rtDesired) {
        rtStatus = 'fallback';
        setTimeout(() => { if (rtDesired && !ws) connectRT(); }, 15000);
      }
    };
  }

  function disconnectRT() {
    if (hbTimer) { clearInterval(hbTimer); hbTimer = null; }
    if (ws) { try { ws.close(); } catch {} ws = null; }
  }

  // 定时轮询：始终运行，无论 Realtime 是否可用（主同步保障）
  function startPolling() {
    stopPolling();
    const sec = Math.max(15, Number(cfg().interval) || 60);
    pollTimer = setInterval(async () => {
      if (Store.dirty) await push(true); else await pull(true);
    }, sec * 1000);
    log('已开启定时同步（每 ' + sec + ' 秒）');
  }
  function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

  function startAuto() {
    stopAuto();
    const c = cfg();
    if (!c.auto || !ready()) return;
    rtDesired = true;
    rtStatus = 'fallback';
    document.addEventListener('store:change', onStoreChange);
    initialSync();      // ① 先拉云端最新数据
    startPolling();     // ② 始终定时轮询
    connectRT();        // ③ 尝试 Realtime（如可用则即时同步）
  }
  function stopAuto() {
    rtDesired = false;
    rtStatus = 'off';
    document.removeEventListener('store:change', onStoreChange);
    disconnectRT();
    stopPolling();
    clearTimeout(pushTimer);
  }

  /* ---------------- 页面 ---------------- */
  function render(view) {
    const c = cfg();
    const s = Store.db.settings;
    view.innerHTML = `
      <div class="page-head">
        <div><h2>☁️ 云端同步与设置</h2><p class="sub">数据默认只存在本机浏览器；接上你自己的 Supabase 即可多设备同步</p></div>
        <div class="head-actions">
          <span class="sync-state ${ready() ? (Store.dirty ? 'dirty' : 'ok') : 'off'}">
            ${ready() ? (
              Store.dirty ? '● 有未推送修改'
              : cfg().auto ? (rtStatus === 'open' ? '● 实时同步中'
                  : rtStatus === 'fallback' ? '● 定时同步中'
                  : rtStatus === 'connecting' ? '● 连接中…'
                  : '● 定时同步中')
              : '● 已配置（手动）'
            ) : '○ 未配置'}</span>
        </div>
      </div>

      <div class="grid-2">
        <div class="card">
          <div class="card-head"><h3>🔐 Supabase 配置</h3></div>
          <div class="form">
            <p class="hint" style="margin:0 0 2px">已为你<b>预配置</b> Supabase 并默认开启实时自动同步——任何设备打开本工作台即自动连云端、多端一致，无需手动填写。想换项目时改这里即可。</p>

            <div class="cfg-group">
              <div class="cfg-group-title">① 连接信息</div>
              <label>Project URL<input class="inp" id="sb-url" value="${esc(c.url)}" placeholder="https://xxxxx.supabase.co"></label>
              <p class="hint" style="margin:0">数据表名固定为 <code>workbench</code>、行 ID 固定为 <code>hailey</code>，单用户私有，无需填写。</p>
            </div>

            <div class="cfg-group">
              <div class="cfg-group-title">② 公开密钥（Anon / Publishable Key）</div>
              <label>公开密钥<input class="inp mono" id="sb-key" type="password" value="${esc(c.key)}" placeholder="eyJhbGciOi..."></label>
            </div>

            <div class="grid2">
              <label class="check-inline"><input type="checkbox" id="sb-auto" ${c.auto ? 'checked' : ''}> 开启实时自动同步</label>
              <label>轮询兜底间隔（秒）<input class="inp" type="number" id="sb-int" value="${c.interval}" min="15"></label>
            </div>
            <p class="hint">开启后：本机数据改动自动推送，并定时拉取云端变化保持多端一致。打开时自动拉取云端最新数据，空数据不会覆盖云端。</p>
            <div class="btn-row">
              <button class="btn" id="sb-save">💾 保存配置</button>
              <button class="btn" id="sb-test">🔌 测试连接</button>
              <button class="btn primary" id="sb-push">⬆️ 推送到云端</button>
              <button class="btn" id="sb-pull">⬇️ 从云端拉取</button>
            </div>
            <p class="hint">建议用 anon key + 行级安全（RLS），把这张表设为仅自己可访问。</p>
            <details class="sql"><summary>📄 第一次使用？点开复制建表 SQL</summary>
<pre class="code">create table if not exists workbench (
  id text primary key,
  payload jsonb,
  updated_at timestamptz default now()
);
alter table workbench enable row level security;
-- 简易私有策略：仅持有本表 key 的可读写（单人使用足够）
create policy "own row" on workbench
  for all using (true) with check (true);
-- 开启 Realtime（实时监听云端变化必需，只需执行一次）
alter publication supabase_realtime add table workbench;</pre>
              <button class="btn xs" id="sb-copysql">复制 SQL</button>
            </details>
          </div>
        </div>

        <div class="card">
          <div class="card-head"><h3>📜 同步日志</h3><button class="btn xs ghost" id="sb-clearlog">清空</button></div>
          ${logs.length ? `<div class="list tight log">${logs.map(l => `<div class="list-item">
            <div><span class="muted sm">${esc(l.t)}</span> ${esc(l.text)}</div>
            <span class="pill ${l.ok ? 'ok' : 'bad'}">${l.ok ? '成功' : '失败'}</span></div>`).join('')}</div>`
        : '<p class="hint">还没有同步记录</p>'}
          <div class="card-head" style="margin-top:16px"><h3>💾 本地备份</h3></div>
          <div class="btn-row">
            <button class="btn" id="bk-export">导出 JSON 备份</button>
            <button class="btn" id="bk-import">导入备份恢复</button>
            <button class="btn danger ghost" id="bk-reset">清空本机数据</button>
          </div>
          <p class="hint">存储用量约 ${(JSON.stringify(Store.db).length / 1024).toFixed(1)} KB</p>
        </div>
      </div>

      <div class="card">
        <div class="card-head"><h3>⚙️ 偏好设置</h3></div>
        <div class="form grid2">
          <label>老师称呼<input class="inp" id="st-teacher" value="${esc(Store.db.meta.teacher)}"></label>
          <label>届别（中考年份）<input class="inp" type="number" id="st-gy" value="${Store.db.meta.gradYear}"></label>
          <label>默认高线<input class="inp" type="number" id="st-h" value="${s.lines.high}"></label>
          <label>默认中线<input class="inp" type="number" id="st-m" value="${s.lines.mid}"></label>
          <label>默认低线<input class="inp" type="number" id="st-l" value="${s.lines.low}"></label>
          <label>临界分差<input class="inp" type="number" id="st-band" value="${s.band}"></label>
          <label class="span2">学生标签（逗号分隔）<input class="inp" id="st-tags" value="${esc(s.tags.join(','))}"></label>
          <label class="span2">违纪类型（逗号分隔）<input class="inp" id="st-dt" value="${esc(s.discTypes.join(','))}"></label>
          <label class="span2">沟通方式（逗号分隔）<input class="inp" id="st-cw" value="${esc(s.commWays.join(','))}"></label>
        </div>
        <div class="btn-row"><button class="btn primary" id="st-save">保存设置</button></div>
      </div>`;

    bind(view);
  }

  function bind(view) {
    const { $ } = UI;
    $('#sb-save', view).onclick = () => {
      const c = cfg();
      c.url = $('#sb-url', view).value.trim();
      c.key = $('#sb-key', view).value.trim();
      // table / rowId 保持默认（workbench / hailey），单用户私有
      c.auto = $('#sb-auto', view).checked;
      c.interval = Number($('#sb-int', view).value) || 60;
      Store.save();
      startAuto();
      toast('配置已保存');
      App.render();
    };
    const syncInputs = () => {                       // 未点保存也能直接测/推/拉
      const c = cfg();
      c.url = $('#sb-url', view).value.trim();
      c.key = $('#sb-key', view).value.trim();
      Store.save();
    };
    $('#sb-test', view).onclick = () => { syncInputs(); test().then(() => App.render()); };
    $('#sb-push', view).onclick = () => { syncInputs(); push(); };
    $('#sb-pull', view).onclick = () => { syncInputs(); pull(); };
    $('#sb-copysql', view).onclick = () => {
      navigator.clipboard.writeText(UI.$('.code', view).textContent).then(() => toast('SQL 已复制'));
    };
    $('#sb-clearlog', view).onclick = () => { logs = []; LS.setItem(LOG_KEY, '[]'); App.render(); };

    $('#bk-export', view).onclick = () => UI.download(`班级工作台备份_${UI.today()}.json`, Store.exportJSON(), 'application/json');
    $('#bk-import', view).onclick = () => {
      const inp = document.createElement('input');
      inp.type = 'file'; inp.accept = '.json';
      inp.onchange = () => {
        const fr = new FileReader();
        fr.onload = () => {
          try { Store.importJSON(String(fr.result)); toast('已恢复备份'); App.render(); }
          catch (e) { toast('恢复失败：' + e.message, 'err'); }
        };
        fr.readAsText(inp.files[0], 'utf-8');
      };
      inp.click();
    };
    $('#bk-reset', view).onclick = () => confirmBox('这会清空本机<b>全部</b>数据（含学生、成绩、记录），确定吗？建议先导出备份。',
      () => { Store.reset(); toast('已清空'); App.render(); }, { danger: true, okText: '清空' });

    $('#st-save', view).onclick = () => {
      const s = Store.db.settings;
      Store.db.meta.teacher = $('#st-teacher', view).value.trim() || 'Hailey';
      Store.db.meta.gradYear = Number($('#st-gy', view).value) || Store.db.meta.gradYear;
      s.lines = { high: Number($('#st-h', view).value), mid: Number($('#st-m', view).value), low: Number($('#st-l', view).value) };
      s.band = Number($('#st-band', view).value) || 8;
      const split = v => v.split(/[,，]/).map(x => x.trim()).filter(Boolean);
      s.tags = split($('#st-tags', view).value);
      s.discTypes = split($('#st-dt', view).value);
      s.commWays = split($('#st-cw', view).value);
      Store.save();
      toast('设置已保存');
      App.render();
    };
  }

  App.pages.sync = { title: '云端同步', render };
  App.sync = { push, pull, test, startAuto, stopAuto, ready };
})();

</script>
</body>
</html>
